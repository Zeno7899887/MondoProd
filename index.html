<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mondo Prod — Catalogue</title>

<style>
  :root{
    --ink:#15151a;
    --ink-soft:rgba(21,21,26,.62);
    --ink-faint:rgba(21,21,26,.38);
    --paper:#ffffff;
    --line:rgba(21,21,26,.10);
    --line-strong:rgba(21,21,26,.20);
    --accent:#8a6d3b;
    --accent-soft:rgba(138,109,59,.12);
    --shadow-sm:0 2px 10px rgba(20,20,25,.06);
    --shadow-md:0 8px 24px rgba(20,20,25,.10);
    --shadow-lg:0 18px 46px rgba(20,20,25,.16);
    --radius:16px;
    --control-h:40px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:transparent; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,Helvetica,sans-serif;
    overflow-x:hidden;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  #catalogue-reader{
    width:100%;
    max-width:1360px;
    margin:0 auto;
    padding:14px 16px 20px;
    text-align:center;
    isolation:isolate;
  }

  /* ===================== LANGUES ===================== */
  #catalogue-languages{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:0 0 18px;
    flex-wrap:wrap;
  }

  .lang-btn{
    appearance:none;
    position:relative;
    z-index:1000;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:76px;
    height:var(--control-h);
    padding:0 14px;
    border:1px solid var(--line);
    border-radius:999px;
    outline:0;
    background:rgba(255,255,255,.86);
    color:var(--ink-soft);
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(14px) saturate(1.4);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    line-height:1;
    opacity:.82;
    transform:translateY(0) scale(1);
    transition:background .2s ease,color .2s ease,border-color .2s ease,
                box-shadow .2s ease,transform .2s ease,opacity .2s ease;
    pointer-events:auto;
    touch-action:manipulation;
  }
  .lang-btn::after{
    content:attr(aria-label);
    font-size:12px;
    font-weight:600;
    letter-spacing:.01em;
  }
  .lang-btn:hover{ opacity:1; transform:translateY(-1px); background:#fff; box-shadow:var(--shadow-md); }
  .lang-btn:active{ transform:translateY(0) scale(.97); }
  .lang-btn.active{
    opacity:1;
    color:var(--ink);
    background:#fff;
    border-color:var(--line-strong);
    box-shadow:0 6px 20px rgba(20,20,25,.14),0 0 0 1px var(--accent-soft) inset;
  }
  .lang-btn.active::before{
    content:"";
    position:absolute;
    left:12px; right:12px; bottom:6px;
    height:2px;
    border-radius:2px;
    background:var(--accent);
    opacity:.75;
  }
  .lang-btn:focus-visible{ box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-md); }

  /* ===================== ZONE LIVRE ===================== */
  #book-area{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 142px;
    min-height:clamp(320px,62vw,790px);
  }

  #book{
    position:relative;
    width:min(1160px,100%);
    max-width:1160px;
    aspect-ratio:1.41421356/1;
    margin:0 auto;
    transform:translateZ(0) scale(var(--reader-scale,.9));
    transform-origin:center center;
    transform-style:preserve-3d;
    background:transparent !important;
    overflow:visible;
    filter:drop-shadow(0 22px 46px rgba(20,20,25,.16));
    transition:transform .18s ease;
  }
  #book .stf,#book .stf__wrapper,#book .stf__block{ margin-left:auto !important; margin-right:auto !important; }
  #book .stf__item{ left:0 !important; right:0 !important; }

  #book,#book .pdf-page,.book-arrow,.lang-btn{ user-select:none; -webkit-user-select:none; }

  #book .pdf-page{
    background:#fff;
    overflow:hidden;
    padding:0;
    margin:0;
    box-shadow:none;
    border-radius:2px;
  }
  #book .pdf-page canvas{
    display:block; width:100%; height:100%;
    background:#fff; object-fit:fill; image-rendering:auto;
  }
  #book .pdf-page img{
    display:block; width:100%; height:100%;
    object-fit:fill; background:#fff;
    user-select:none; -webkit-user-drag:none; pointer-events:none;
  }

  /* ===================== FLÈCHES ===================== */
  .book-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:100;
    width:48px;
    height:48px;
    appearance:none;
    border:1px solid var(--line);
    border-radius:50%;
    background:rgba(255,255,255,.92);
    color:var(--ink);
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    font-size:26px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    cursor:pointer;
    touch-action:manipulation;
    transition:background .2s ease,box-shadow .2s ease,transform .2s ease,opacity .2s ease,border-color .2s ease;
  }
  .book-arrow svg{ width:19px; height:19px; display:block; }
  .book-arrow:hover:not(:disabled){
    background:#fff; border-color:var(--line-strong);
    box-shadow:var(--shadow-md); transform:translateY(-50%) scale(1.05);
  }
  .book-arrow:active:not(:disabled){ transform:translateY(-50%) scale(.96); }
  .book-arrow:disabled{ opacity:.28; cursor:default; box-shadow:none; }
  #first-page{ left:0; }
  #prev-page{ left:56px; }
  #next-page{ right:56px; }
  #last-page{ right:0; }

  /* Coins interactifs */
  #corner-layer{ position:absolute; z-index:150; pointer-events:none; }
  .corner-zone{ position:absolute; width:104px; height:104px; pointer-events:auto; touch-action:none; background:transparent; }
  #corner-tl{ left:0; top:0; cursor:pointer; }
  #corner-bl{ left:0; bottom:0; cursor:pointer; }
  #corner-tr{ right:0; top:0; cursor:pointer; }
  #corner-br{ right:0; bottom:0; cursor:pointer; }

  /* Chargement silencieux : aucun texte au milieu de la liseuse */
  #loading{ display:none !important; }
  #catalogue-reader:not([data-ready="true"]) #book{ opacity:0; pointer-events:none; }
  #catalogue-reader[data-ready="true"] #book{ opacity:1; transition:opacity .35s ease; }

  #catalogue-reader[data-loading="true"] #book-area::after{
    content:"";
    position:absolute;
    inset:0;
    margin:auto;
    width:34px; height:34px;
    border-radius:50%;
    border:3px solid rgba(20,20,25,.12);
    border-top-color:var(--accent);
    animation:mp-spin .8s linear infinite;
    z-index:5;
  }
  @keyframes mp-spin{ to{ transform:rotate(360deg); } }

  #status{
    display:none;
    max-width:780px;
    margin:14px auto 0;
    padding:12px 16px;
    border:1px solid rgba(190,30,45,.18);
    border-radius:12px;
    background:rgba(255,245,246,.9);
    color:#8b2833;
    font-size:13px;
    line-height:1.5;
  }

  /* ===================== CONTRÔLES ===================== */
  #reader-controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    min-height:46px;
    margin:14px 0 0;
    padding:5px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    width:max-content;
    max-width:100%;
    margin-left:auto;
    margin-right:auto;
    background:rgba(255,255,255,.78);
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(14px) saturate(1.4);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
  }
  #reader-controls button{
    appearance:none;
    min-width:36px;
    height:34px;
    border:0;
    outline:0;
    background:transparent;
    color:var(--ink-soft);
    padding:0 9px;
    font-size:19px;
    cursor:pointer;
    border-radius:999px;
    touch-action:manipulation;
    transition:background .18s ease,color .18s ease,transform .18s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #reader-controls button:hover{ background:rgba(21,21,26,.06); color:var(--ink); }
  #reader-controls button:active{ transform:scale(.92); }
  #reader-controls button:focus-visible{ box-shadow:0 0 0 3px var(--accent-soft); }
  #reader-controls button:disabled{ opacity:.28; cursor:default; }

  #page-number{
    min-width:104px;
    padding:0 10px;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    text-align:center;
    letter-spacing:.02em;
  }

  #catalogue-reader:fullscreen{
    width:100vw; max-width:none; height:100vh;
    background:#fff;
    display:flex; flex-direction:column; justify-content:center;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  #catalogue-reader:fullscreen #book-area{ flex:1 1 auto; min-height:0; }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width:900px){
    #catalogue-reader{ padding-left:10px; padding-right:10px; }
    #book-area{ padding:0 88px; min-height:0; }
    #book{ width:min(100%,1040px); }
    #first-page{ left:0; } #prev-page{ left:48px; }
    #next-page{ right:48px; } #last-page{ right:0; }
  }

  @media (max-width:700px){
    #catalogue-languages{ gap:7px; margin-bottom:12px; }
    .lang-btn{ min-width:60px; height:36px; padding:0 10px; font-size:12px; gap:6px; }
    .lang-btn::after{ font-size:11px; }

    #book-area{ padding:0 42px; }
    #book{
      width:min(94vw,470px);
      aspect-ratio:1/1.41421356;
      max-width:470px;
      margin-left:auto !important;
      margin-right:auto !important;
    }
    .book-arrow{ width:40px; height:40px; }
    .book-arrow svg{ width:16px; height:16px; }
    #first-page{ left:0; } #prev-page{ left:0; }
    #next-page{ right:0; } #last-page{ right:0; }
    #reader-controls{ margin-top:10px; }
  }

  @media (max-width:430px){
    .lang-btn{ min-width:0; width:46px; padding:0; }
    .lang-btn::after{ display:none; }
    #book-area{ padding:0 30px; }
    .book-arrow{ width:36px; height:36px; }
    .book-arrow svg{ width:14px; height:14px; }
  }

  @media (prefers-reduced-motion:reduce){
    .lang-btn,.book-arrow,#reader-controls button,#book{ transition:none !important; }
  }
</style>
</head>
<body>

<div id="catalogue-reader" data-ready="false" data-loading="false">

  <!-- LANGUES -->
  <div id="catalogue-languages" aria-label="Choisir la langue du catalogue">
    <button class="lang-btn" data-lang="fr" type="button" aria-label="Français"></button>
    <button class="lang-btn" data-lang="en" type="button" aria-label="English"></button>
    <button class="lang-btn" data-lang="it" type="button" aria-label="Italiano"></button>
    <button class="lang-btn" data-lang="es" type="button" aria-label="Español"></button>
  </div>

  <!-- LIVRE -->
  <div id="book-area">
    <button id="first-page" class="book-arrow" type="button" aria-label="Première page">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 6L9 12L18 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 6L2 12L11 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="prev-page" class="book-arrow" type="button" aria-label="Page précédente">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L8 12L15 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="book"></div>

    <div id="corner-layer" aria-hidden="true">
      <div id="corner-tl" class="corner-zone"></div>
      <div id="corner-bl" class="corner-zone"></div>
      <div id="corner-tr" class="corner-zone"></div>
      <div id="corner-br" class="corner-zone"></div>
    </div>

    <button id="next-page" class="book-arrow" type="button" aria-label="Page suivante">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L16 12L9 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="last-page" class="book-arrow" type="button" aria-label="Dernière page">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6L15 12L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 6L22 12L13 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- CONTRÔLES -->
  <div id="reader-controls">
    <button id="zoom-out" type="button" aria-label="Réduire le zoom">−</button>
    <span id="page-number">1 / 1</span>
    <button id="zoom-in" type="button" aria-label="Augmenter le zoom">+</button>
    <button id="fullscreen" type="button" aria-label="Plein écran">⛶</button>
  </div>

  <div id="status"></div>
</div>

<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- PAGEFLIP -->
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
(function () {
  "use strict";

  /* ========================================================
     PDF.JS
     ======================================================== */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  /* URLS EXACTES */
  const catalogues = {
    fr: "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",
    en: "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",
    it: "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",
    es: "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"
  };

  /* ========================================================
     ÉLÉMENTS
     ======================================================== */
  const readerRoot     = document.getElementById("catalogue-reader");
  const bookElement     = document.getElementById("book");
  const status          = document.getElementById("status");
  const pageNumber      = document.getElementById("page-number");
  const firstButton     = document.getElementById("first-page");
  const prevButton      = document.getElementById("prev-page");
  const nextButton      = document.getElementById("next-page");
  const lastButton      = document.getElementById("last-page");
  const fullscreenButton= document.getElementById("fullscreen");
  const zoomInButton    = document.getElementById("zoom-in");
  const zoomOutButton   = document.getElementById("zoom-out");
  const languageButtons = Array.from(document.querySelectorAll(".lang-btn"));
  const cornerLayer     = document.getElementById("corner-layer");
  const cornerTL        = document.getElementById("corner-tl");
  const cornerBL        = document.getElementById("corner-bl");
  const cornerTR        = document.getElementById("corner-tr");
  const cornerBR        = document.getElementById("corner-br");

  /* ========================================================
     ÉTAT
     ======================================================== */
  let pageFlip = null;
  let pdf = null;

  /* activeLanguage : langue "demandée / sélectionnée à l'écran" (optimiste).
     renderedLanguage : langue RÉELLEMENT affichée dans le livre visible.
     Toute décision de "ce catalogue est déjà ouvert" doit se baser sur
     renderedLanguage, jamais sur activeLanguage seul, sinon un échec réseau
     ou une interruption peut bloquer définitivement le retour vers une
     langue (ex: le Français) tant que la variable optimiste n'est pas
     resynchronisée. */
  let activeLanguage = "fr";
  let renderedLanguage = null;

  let loadingCatalogue = false;

  /* Cache des téléchargements PDF (ArrayBuffer). Aucun PDFDocumentProxy
     PDF.js n'est conservé entre deux changements de langue. */
  const catalogueBufferPromises = new Map();

  const renderedPages = new Set();
  const renderingPages = new Map();
  const pageImageUrls = new Map();
  let renderGeneration = 0;
  let readyPromise = Promise.resolve();

  /* Mode d'affichage réellement utilisé par la dernière instance PageFlip
     construite. Sert à détecter un changement desktop <-> mobile qui doit
     déclencher une reconstruction complète du livre. */
  let bookIsMobile = null;

  /* ========================================================
     UTILITAIRES
     ======================================================== */
  function setActiveLanguage(language) {
    activeLanguage = language;
    languageButtons.forEach(function (button) {
      button.classList.toggle("active", button.dataset.lang === language);
    });
  }

  function showLoading() {
    readerRoot.dataset.loading = "true";
  }
  function hideLoadingIndicator() {
    readerRoot.dataset.loading = "false";
  }
  function markReady() {
    readerRoot.dataset.ready = "true";
  }
  function markNotReady() {
    readerRoot.dataset.ready = "false";
  }

  function showError(message) {
    status.textContent = message;
    status.style.display = "block";
  }
  function hideError() {
    status.style.display = "none";
  }

  /* ========================================================
     LANGUE DU SITE (détection initiale uniquement)
     ======================================================== */
  function detectLanguage() {
    /* Étape 1 — paramètre ?lang=fr */
    try {
      const params = new URLSearchParams(window.location.search);
      const queryLang = (params.get("lang") || "").toLowerCase().split("-")[0];
      if (catalogues[queryLang]) return queryLang;
    } catch (error) {}

    /* Étape 2 — dernière langue choisie dans la liseuse. */
    try {
      const savedLang = (localStorage.getItem("mondoprod-catalogue-lang") || "")
        .toLowerCase().split("-")[0];
      if (catalogues[savedLang]) return savedLang;
    } catch (error) {}

    /* Étape 3 — langue du document HTML. */
    const htmlLang = (document.documentElement.lang || "").toLowerCase().split("-")[0];
    if (catalogues[htmlLang]) return htmlLang;

    /* Étape 4 — langue du navigateur. */
    try {
      const browserLang = (navigator.language || "").toLowerCase().split("-")[0];
      if (catalogues[browserLang]) return browserLang;
    } catch (error) {}

    return "fr";
  }

  /* ========================================================
     DÉTECTION MOBILE / VIEWPORT ROBUSTE
     ======================================================== */
  function safeMatchMedia(query) {
    try {
      if (typeof window.matchMedia === "function") {
        return window.matchMedia(query).matches;
      }
    } catch (error) {}
    return false;
  }

  function viewportWidth() {
    /* iOS Safari + certaines webviews rapportent des largeurs incohérentes
       via window.innerWidth pendant les changements d'orientation ou
       l'apparition du clavier. On utilise visualViewport quand disponible,
       en gardant document.documentElement.clientWidth comme filet de
       sécurité. */
    if (window.visualViewport && window.visualViewport.width) {
      return window.visualViewport.width;
    }
    return document.documentElement.clientWidth || window.innerWidth || 0;
  }

  function isMobileView() {
    if (safeMatchMedia("(max-width: 700px)")) return true;
    return viewportWidth() <= 700;
  }

  /* ========================================================
     RENDRE UNE PAGE PDF DIRECTEMENT DANS UN CANVAS HD
     ======================================================== */
  function getRenderTargetWidth() {
    const bookWidth = bookElement.clientWidth || 1120;
    const mobile = isMobileView();
    const cssPageWidth = mobile ? bookWidth : bookWidth / 2;
    const dpr = (window.devicePixelRatio || 1);
    const multiplier = Math.min(4.0, Math.max(2.8, dpr * 1.8 + 1.4));
    return Math.min(3600, Math.max(1800, Math.ceil(cssPageWidth * multiplier)));
  }

  function sleepFrame() {
    return new Promise(function (resolve) {
      requestAnimationFrame(function () { requestAnimationFrame(resolve); });
    });
  }

  function cancelCurrentRenders() {
    renderingPages.forEach(function (entry) {
      try {
        if (entry && entry.task && typeof entry.task.cancel === "function") {
          entry.task.cancel();
        }
      } catch (error) {}
    });
    renderingPages.clear();
  }

  function revokePageUrl(index) {
    const url = pageImageUrls.get(index);
    if (url) {
      try { URL.revokeObjectURL(url); } catch (error) {}
      pageImageUrls.delete(index);
    }
  }

  function revokeAllPageUrls() {
    pageImageUrls.forEach(function (url) {
      try { URL.revokeObjectURL(url); } catch (error) {}
    });
    pageImageUrls.clear();
  }

  function resetRenderState() {
    renderGeneration++;
    cancelCurrentRenders();
    renderedPages.clear();
    revokeAllPageUrls();
    readyPromise = Promise.resolve();
  }

  function canvasToPngBlob(canvas) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (blob) {
        if (blob) resolve(blob);
        else reject(new Error("Impossible de créer l'image PNG de la page."));
      }, "image/png");
    });
  }

  async function renderPage(index, generation) {
    if (!pdf || generation !== renderGeneration || index < 0 || index >= pdf.numPages) {
      return false;
    }
    if (renderedPages.has(index)) return true;

    const existing = renderingPages.get(index);
    if (existing && existing.generation === generation) return existing.promise;

    const pageElement = bookElement.querySelector('.pdf-page[data-page-index="' + index + '"]');
    if (!pageElement) return false;
    const image = pageElement.querySelector("img");
    if (!image) return false;

    const pdfAtStart = pdf;
    const entry = { generation: generation, task: null, promise: null };

    entry.promise = (async function () {
      try {
        const page = await pdfAtStart.getPage(index + 1);
        if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

        const baseViewport = page.getViewport({ scale: 1 });
        const targetWidth = getRenderTargetWidth();
        const scale = targetWidth / baseViewport.width;
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.createElement("canvas");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        const context = canvas.getContext("2d", { alpha: false });
        if (!context) return false;
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);

        const renderTask = page.render({
          canvasContext: context,
          viewport: viewport,
          intent: "display",
          renderInteractiveForms: true
        });
        entry.task = renderTask;

        await renderTask.promise;
        if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

        const blob = await canvasToPngBlob(canvas);
        if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

        revokePageUrl(index);
        const objectUrl = URL.createObjectURL(blob);
        pageImageUrls.set(index, objectUrl);

        image.onload = null;
        image.src = objectUrl;
        image.alt = "Page " + (index + 1);
        image.style.visibility = "visible";
        renderedPages.add(index);
        return true;
      } catch (error) {
        if (generation !== renderGeneration || (error && error.name === "RenderingCancelledException")) {
          return false;
        }
        console.error("Erreur rendu page " + (index + 1) + " :", error);
        return false;
      }
    })();

    renderingPages.set(index, entry);
    try {
      return await entry.promise;
    } finally {
      const current = renderingPages.get(index);
      if (current === entry) renderingPages.delete(index);
    }
  }

  async function renderPages(indices, generation) {
    const unique = Array.from(new Set(indices)).filter(function (index) {
      return pdf && index >= 0 && index < pdf.numPages;
    });
    if (generation !== renderGeneration) return false;
    await Promise.all(unique.map(function (index) { return renderPage(index, generation); }));
    return generation === renderGeneration;
  }

  function preloadAround(index) {
    if (!pdf) return;
    const generation = renderGeneration;
    const total = pdf.numPages;

    const indices = [];
    const priority = [
      index, index + 1, index + 2, index + 3,
      index - 1, index - 2, index + 4, index + 5,
      index - 3, index - 4, index + 6, index + 7,
      index - 5, index - 6, index - 7
    ];
    priority.forEach(function (i) {
      if (i >= 0 && i < total && !indices.includes(i)) indices.push(i);
    });
    if (index <= 3) {
      [0,1,2,3,4,5,6,7].forEach(function (i) {
        if (i < total && !indices.includes(i)) indices.push(i);
      });
    }
    if (index >= total - 4) {
      [total-8,total-7,total-6,total-5,total-4,total-3,total-2,total-1].forEach(function (i) {
        if (i >= 0 && !indices.includes(i)) indices.push(i);
      });
    }

    readyPromise = readyPromise.then(function () {
      if (generation !== renderGeneration) return;
      return renderPages(indices, generation);
    }).catch(function (error) {
      console.warn("Préchargement :", error);
    });

    return readyPromise;
  }

  async function ensurePagesReady(indices) {
    if (!pdf) return false;
    const generation = renderGeneration;
    const wanted = Array.from(new Set(indices)).filter(function (index) {
      return index >= 0 && index < pdf.numPages;
    });
    await (readyPromise || Promise.resolve());
    if (generation !== renderGeneration) return false;
    return renderPages(wanted, generation);
  }

  /* ========================================================
     CRÉER LA LISEUSE EN MODE HTML
     ======================================================== */
  function createBook() {
    bookElement.innerHTML = "";
    resetRenderState();

    const pageElements = [];
    for (let index = 0; index < pdf.numPages; index++) {
      const page = document.createElement("div");
      page.className = "pdf-page";
      page.dataset.pageIndex = String(index);
      page.setAttribute("data-density", "soft");
      if (index === 0 || index === pdf.numPages - 1) {
        page.setAttribute("data-density", "hard");
      }

      const image = document.createElement("img");
      image.setAttribute("aria-hidden", "true");
      image.alt = "Page " + (index + 1);
      image.style.visibility = "hidden";
      image.decoding = "async";
      image.draggable = false;
      page.appendChild(image);

      bookElement.appendChild(page);
      pageElements.push(page);
    }

    const mobile = isMobileView();
    bookIsMobile = mobile;

    pageFlip = new St.PageFlip(bookElement, {
      width: 760,
      height: 1075,
      size: "stretch",
      minWidth: 250,
      maxWidth: 1800,
      minHeight: 350,
      maxHeight: 2550,
      flippingTime: 950,
      showCover: true,
      drawShadow: true,
      maxShadowOpacity: 0.78,
      showPageCorners: true,
      useMouseEvents: true,
      swipeDistance: 25,
      clickEventForward: true,
      disableFlipByClick: true,
      mobileScrollSupport: true,
      usePortrait: mobile,
      startPage: 0,
      startZIndex: 20,
      autoSize: false
    });

    pageFlip.loadFromHTML(pageElements);
    pageFlip.turnToPage(0);

    requestAnimationFrame(function () {
      applyReaderScale();
      updateCounter();
    });
  }

  /* ========================================================
     COMPTEUR
     ======================================================== */
  function updateCounter() {
    if (!pageFlip || !pdf) return;
    const index = pageFlip.getCurrentPageIndex();
    const total = pdf.numPages;

    if (index === 0) {
      pageNumber.textContent = "1 / " + total;
    } else if (index === total - 1) {
      pageNumber.textContent = total + " / " + total;
    } else {
      const first = index + 1;
      const second = Math.min(index + 2, total);
      pageNumber.textContent = first + "–" + second + " / " + total;
    }

    firstButton.disabled = index === 0;
    prevButton.disabled = index === 0;
    nextButton.disabled = index === total - 1;
    lastButton.disabled = index === total - 1;
  }

  /* ========================================================
     ÉVÉNEMENTS PAGEFLIP — navigation robuste
     ======================================================== */
  let pendingNavigation = null;

  function pageFlipIsFlipping() {
    if (!pageFlip || typeof pageFlip.getState !== "function") return false;
    try {
      return String(pageFlip.getState()) === "flipping";
    } catch (error) {
      return false;
    }
  }

  function runOrQueueNavigation(command) {
    if (!pageFlip) return;
    if (pageFlipIsFlipping()) {
      pendingNavigation = command;
      return;
    }
    pendingNavigation = null;
    try { command(); } catch (error) { console.warn("Navigation PageFlip :", error); }
  }

  function flushPendingNavigation() {
    if (!pageFlip || !pendingNavigation || pageFlipIsFlipping()) return;
    const command = pendingNavigation;
    pendingNavigation = null;
    requestAnimationFrame(function () {
      if (!pageFlip) return;
      try { command(); } catch (error) { console.warn("Navigation PageFlip :", error); }
    });
  }

  function hidePagesUnderCover() {
    bookElement.classList.remove("cover-front-flip-hiding", "cover-back-flip-hiding");
    if (!pageFlip || !pdf) return;
    const index = pageFlip.getCurrentPageIndex();
    const total = pdf.numPages;
    if (index <= 1) bookElement.classList.add("cover-front-flip-hiding");
    else if (index >= total - 2) bookElement.classList.add("cover-back-flip-hiding");
  }
  function showPagesUnderCover() {
    bookElement.classList.remove("cover-front-flip-hiding", "cover-back-flip-hiding");
  }

  function attachPageFlipEvents() {
    if (!pageFlip) return;

    pageFlip.on("flip", function () {
      showPagesUnderCover();
      updateCounter();
      preloadAround(pageFlip.getCurrentPageIndex());
    });

    pageFlip.on("changeState", function (event) {
      const state = event && event.data ? String(event.data) : "";
      const index = pageFlip.getCurrentPageIndex();
      const total = pdf ? pdf.numPages : 0;
      const nearFrontCover = index <= 1;
      const nearBackCover = total > 0 && index >= total - 2;

      if (state === "flipping" && (nearFrontCover || nearBackCover)) {
        hidePagesUnderCover();
      }
      if (state === "read") {
        showPagesUnderCover();
        updateCounter();
        preloadAround(index);
        flushPendingNavigation();
      }
    });

    pageFlip.on("changeOrientation", function () {
      updateCounter();
      preloadAround(pageFlip.getCurrentPageIndex());
    });
  }

  /* ========================================================
     CHARGER UN CATALOGUE — FILE D'ATTENTE ROBUSTE
     ======================================================== */
  function getCatalogueBuffer(language) {
    const url = catalogues[language];
    if (!url) return Promise.reject(new Error("Langue de catalogue inconnue."));

    if (!catalogueBufferPromises.has(language)) {
      const promise = fetch(url, {
        method: "GET",
        cache: "force-cache",
        credentials: "omit"
      }).then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status + " — " + url);
        return response.arrayBuffer();
      }).catch(function (error) {
        catalogueBufferPromises.delete(language);
        throw error;
      });
      catalogueBufferPromises.set(language, promise);
    }
    return catalogueBufferPromises.get(language);
  }

  function createFreshCatalogueDocument(language) {
    return getCatalogueBuffer(language).then(function (buffer) {
      return pdfjsLib.getDocument({
        data: buffer.slice(0),
        disableAutoFetch: false,
        disableStream: false,
        disableRange: false,
        cMapPacked: true
      }).promise;
    });
  }

  let prefetchToken = 0;
  function prefetchOtherCatalogues(currentLanguage) {
    const token = prefetchToken;
    const languages = Object.keys(catalogues).filter(function (language) {
      return language !== currentLanguage;
    });
    let chain = Promise.resolve();
    languages.forEach(function (language) {
      chain = chain.then(function () {
        if (token !== prefetchToken) return;
        return getCatalogueBuffer(language).catch(function () {});
      });
    });
    return chain;
  }

  /* File d'attente des langues. Exemple : FR -> EN -> FR -> IT pendant le
     chargement de EN. On ne remplace jamais le livre au milieu d'un
     chargement. La dernière demande gagne. */
  let languageLoadRunning = false;
  let queuedLanguage = null;
  let languageSequence = 0;
  let loadRetryCount = 0;
  const MAX_LOAD_RETRIES = 2;

  function requestCatalogue(language, isRetry) {
    if (!catalogues[language]) return;

    /* Le même catalogue déjà RÉELLEMENT affiché n'a rien à faire. On
       compare toujours à renderedLanguage (jamais à activeLanguage, qui
       change de façon optimiste dès le clic) afin qu'un échec de
       chargement précédent ne puisse jamais empêcher un futur clic sur
       la même langue de fonctionner. */
    if (!isRetry && language === renderedLanguage && !languageLoadRunning && queuedLanguage === null) {
      setActiveLanguage(renderedLanguage);
      return;
    }

    queuedLanguage = language;
    languageSequence++;

    prefetchToken++;
    setActiveLanguage(language);
    hideError();

    if (!languageLoadRunning) {
      processQueuedCatalogue();
    }
  }

  async function processQueuedCatalogue() {
    if (languageLoadRunning) return;
    languageLoadRunning = true;
    loadingCatalogue = true;

    try {
      while (queuedLanguage !== null) {
        const language = queuedLanguage;
        queuedLanguage = null;
        const requestSequence = languageSequence;

        if (language === renderedLanguage && pdf && pageFlip) {
          activeLanguage = renderedLanguage;
          setActiveLanguage(renderedLanguage);
          continue;
        }

        showLoading();

        let loadedPdf = null;
        try {
          loadedPdf = await createFreshCatalogueDocument(language);

          if (requestSequence !== languageSequence && queuedLanguage !== null) {
            try { loadedPdf.destroy(); } catch (error) {}
            continue;
          }

          const previousPageFlip = pageFlip;
          const previousPdf = pdf;

          pdf = loadedPdf;
          resetRenderState();

          bookElement.innerHTML = "";
          pageFlip = null;

          createBook();
          attachPageFlipEvents();
          pageFlip.update();
          pageFlip.turnToPage(0);

          await sleepFrame();
          await ensurePagesReady([0, 1, 2, 3]);

          activeLanguage = language;
          renderedLanguage = language;
          loadRetryCount = 0;
          setActiveLanguage(activeLanguage);

          try {
            localStorage.setItem("mondoprod-catalogue-lang", activeLanguage);
          } catch (error) {}

          markReady();
          hideLoadingIndicator();
          applyReaderScale();
          updateCounter();
          preloadAround(0);
          positionCornerLayer();

          if (previousPageFlip && previousPageFlip !== pageFlip) {
            try { previousPageFlip.destroy(); } catch (error) {}
          }
          if (previousPdf && previousPdf !== pdf) {
            try { previousPdf.destroy(); } catch (error) {}
          }

          if (queuedLanguage === null) prefetchOtherCatalogues(activeLanguage);

        } catch (error) {
          if (loadedPdf && loadedPdf !== pdf) {
            try { loadedPdf.destroy(); } catch (destroyError) {}
          }
          console.error("Erreur catalogue " + language + " :", error);

          /* Un échec de chargement ne doit jamais faire disparaître le
             catalogue actuellement affiché, et ne doit jamais laisser une
             valeur fantôme dans activeLanguage : on resynchronise
             systématiquement sur renderedLanguage (le livre vraiment
             visible), pour qu'un futur clic sur cette langue fonctionne
             normalement. */
          activeLanguage = renderedLanguage || "fr";
          setActiveLanguage(activeLanguage);

          if (queuedLanguage === null) {
            catalogueBufferPromises.delete(language);

            if (loadRetryCount < MAX_LOAD_RETRIES) {
              loadRetryCount++;
              queuedLanguage = language;
            } else {
              loadRetryCount = 0;
              showError(
                "Impossible de charger le catalogue : " +
                (error && error.message ? error.message : "erreur inconnue")
              );
            }
          }
        }
      }
    } finally {
      languageLoadRunning = false;
      loadingCatalogue = false;
      hideLoadingIndicator();

      if (queuedLanguage !== null) processQueuedCatalogue();
    }
  }

  /* ========================================================
     DRAPEAUX — gestion minimale et indépendante
     ======================================================== */
  languageButtons.forEach(function (button) {
    button.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      const language = String(button.dataset.lang || "").toLowerCase();
      requestCatalogue(language, false);
    }, { passive: false });
  });

  /* ========================================================
     COINS INTERACTIFS
     ======================================================== */
  function positionCornerLayer() {
    if (!cornerLayer || !bookElement) return;
    const areaRect = document.getElementById("book-area").getBoundingClientRect();
    const bookRect = bookElement.getBoundingClientRect();
    cornerLayer.style.left = (bookRect.left - areaRect.left) + "px";
    cornerLayer.style.top = (bookRect.top - areaRect.top) + "px";
    cornerLayer.style.width = bookRect.width + "px";
    cornerLayer.style.height = bookRect.height + "px";
  }

  function bookPointFromPointer(event) {
    const rect = bookElement.getBoundingClientRect();
    /* Le livre est agrandi par CSS scale (readerScale). PageFlip attend
       des coordonnées dans sa taille NON transformée : on reconvertit donc
       les coordonnées écran vers les coordonnées internes de PageFlip afin
       que le geste de coin reste stable, quel que soit le zoom ou le
       navigateur. */
    const scaleFactor = Math.max(readerScale, 0.01);
    const baseWidth = rect.width / scaleFactor || bookElement.clientWidth || 1;
    const baseHeight = rect.height / scaleFactor || bookElement.clientHeight || 1;
    const scaleX = baseWidth ? (rect.width / baseWidth) : 1;
    const scaleY = baseHeight ? (rect.height / baseHeight) : 1;
    const x = Math.max(0, Math.min(baseWidth, (event.clientX - rect.left) / scaleX));
    const y = Math.max(0, Math.min(baseHeight, (event.clientY - rect.top) / scaleY));
    return { x: x, y: y };
  }

  function bindCornerZone(zone) {
    if (!zone) return;
    let activePointerId = null;

    zone.addEventListener("pointerdown", function (event) {
      if (!pageFlip || !pdf || pageFlipIsFlipping()) return;
      if (event.button !== undefined && event.button !== 0) return;
      activePointerId = event.pointerId;
      try { zone.setPointerCapture(event.pointerId); } catch (error) {}
      event.preventDefault();
      event.stopPropagation();
      try { pageFlip.startUserTouch(bookPointFromPointer(event)); } catch (error) { activePointerId = null; }
    });

    zone.addEventListener("pointermove", function (event) {
      if (activePointerId !== event.pointerId || !pageFlip) return;
      event.preventDefault();
      event.stopPropagation();
      try { pageFlip.userMove(bookPointFromPointer(event), false); } catch (error) {}
    });

    function finish(event) {
      if (activePointerId !== event.pointerId || !pageFlip) return;
      event.preventDefault();
      event.stopPropagation();
      try { pageFlip.userStop(bookPointFromPointer(event), false); } catch (error) {}
      try { zone.releasePointerCapture(event.pointerId); } catch (error) {}
      activePointerId = null;
    }
    zone.addEventListener("pointerup", finish);
    zone.addEventListener("pointercancel", finish);
  }

  bindCornerZone(cornerTL);
  bindCornerZone(cornerBL);
  bindCornerZone(cornerTR);
  bindCornerZone(cornerBR);
  positionCornerLayer();

  /* ========================================================
     FLÈCHES
     ======================================================== */
  firstButton.addEventListener("click", function () {
    runOrQueueNavigation(function () {
      if (!pageFlip) return;
      pageFlip.turnToPage(0);
    });
  });

  lastButton.addEventListener("click", function () {
    runOrQueueNavigation(function () {
      if (!pageFlip || !pdf) return;
      pageFlip.turnToPage(Math.max(0, pdf.numPages - 1));
    });
  });

  prevButton.addEventListener("click", async function () {
    if (!pageFlip || !pdf) return;
    const current = pageFlip.getCurrentPageIndex();

    if (pageFlipIsFlipping()) {
      pendingNavigation = async function () {
        await ensurePagesReady([current-4,current-3,current-2,current-1,current,current+1,current+2]);
        if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
      };
      return;
    }
    await ensurePagesReady([current-4,current-3,current-2,current-1,current,current+1,current+2]);
    if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
  });

  nextButton.addEventListener("click", async function () {
    if (!pageFlip || !pdf) return;
    const current = pageFlip.getCurrentPageIndex();

    if (pageFlipIsFlipping()) {
      pendingNavigation = async function () {
        await ensurePagesReady([current-2,current-1,current,current+1,current+2,current+3,current+4]);
        if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
      };
      return;
    }
    await ensurePagesReady([current-2,current-1,current,current+1,current+2,current+3,current+4]);
    if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
  });

  /* ========================================================
     ZOOM
     ======================================================== */
  let readerScale = 0.90;
  const ZOOM_MIN = 0.72;
  const ZOOM_MAX = 1.14;
  const ZOOM_STEP = 0.06;

  function applyReaderScale() {
    bookElement.style.setProperty("--reader-scale", String(readerScale));
    bookElement.style.transform = "translateZ(0) scale(" + readerScale + ")";
    bookElement.style.transformOrigin = "center center";
    positionCornerLayer();
    zoomInButton.disabled = readerScale >= ZOOM_MAX - 0.001;
    zoomOutButton.disabled = readerScale <= ZOOM_MIN + 0.001;
  }
  applyReaderScale();

  zoomInButton.addEventListener("click", function () {
    readerScale = Math.min(ZOOM_MAX, +(readerScale + ZOOM_STEP).toFixed(2));
    applyReaderScale();
  });
  zoomOutButton.addEventListener("click", function () {
    readerScale = Math.max(ZOOM_MIN, +(readerScale - ZOOM_STEP).toFixed(2));
    applyReaderScale();
  });

  /* ========================================================
     PLEIN ÉCRAN — API standard + fallback WebKit / MS
     ======================================================== */
  function requestFullscreenSafe(element) {
    if (element.requestFullscreen) return element.requestFullscreen();
    if (element.webkitRequestFullscreen) return element.webkitRequestFullscreen();
    if (element.msRequestFullscreen) return element.msRequestFullscreen();
    return Promise.reject(new Error("Plein écran non supporté."));
  }
  function exitFullscreenSafe() {
    if (document.exitFullscreen) return document.exitFullscreen();
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
    if (document.msExitFullscreen) return document.msExitFullscreen();
    return Promise.resolve();
  }
  function currentFullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
  }

  fullscreenButton.addEventListener("click", async function () {
    try {
      if (!currentFullscreenElement()) {
        await requestFullscreenSafe(readerRoot);
      } else {
        await exitFullscreenSafe();
      }
    } catch (error) {
      console.error("Fullscreen :", error);
    }
  });

  ["fullscreenchange", "webkitfullscreenchange", "MSFullscreenChange"].forEach(function (name) {
    document.addEventListener(name, function () {
      requestAnimationFrame(function () {
        if (pageFlip) pageFlip.update();
        positionCornerLayer();
      });
    });
  });

  /* ========================================================
     CLAVIER
     ======================================================== */
  document.addEventListener("keydown", function (event) {
    if (!pageFlip) return;
    if (event.key === "ArrowRight") {
      const current = pageFlip.getCurrentPageIndex();
      ensurePagesReady([current-2,current-1,current,current+1,current+2,current+3,current+4]).then(function () {
        if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
      });
    }
    if (event.key === "ArrowLeft") {
      const current = pageFlip.getCurrentPageIndex();
      ensurePagesReady([current-4,current-3,current-2,current-1,current,current+1,current+2]).then(function () {
        if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
      });
    }
  });

  /* ========================================================
     REDIMENSIONNEMENT — reconstruction complète si le mode
     desktop/mobile change réellement (corrige le bug où le
     mobile affichait la mise en page ordinateur).
     ======================================================== */
  let resizeTimer = null;

  function handleViewportChange() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (!pageFlip || !pdf) return;

      const mobileNow = isMobileView();

      if (mobileNow !== bookIsMobile) {
        /* Le mode a changé : on reconstruit entièrement PageFlip avec la
           bonne valeur de usePortrait, sinon la mise en page reste figée
           dans le mode détecté au chargement initial. */
        const currentIndex = pageFlip.getCurrentPageIndex();
        try { pageFlip.destroy(); } catch (error) {}
        pageFlip = null;

        createBook();
        attachPageFlipEvents();
        pageFlip.update();
        pageFlip.turnToPage(Math.min(currentIndex, pdf.numPages - 1));

        readyPromise = sleepFrame().then(function () {
          return ensurePagesReady([currentIndex-2,currentIndex-1,currentIndex,currentIndex+1,currentIndex+2]);
        });
        preloadAround(currentIndex);
      } else {
        resetRenderState();
        pageFlip.update();
        const current = pageFlip.getCurrentPageIndex();
        readyPromise = sleepFrame().then(function () {
          return ensurePagesReady([current-2,current-1,current,current+1,current+2]);
        });
        preloadAround(current);
      }

      positionCornerLayer();
    }, 160);
  }

  window.addEventListener("resize", handleViewportChange);
  window.addEventListener("orientationchange", handleViewportChange);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", handleViewportChange);
  }
  if (typeof ResizeObserver === "function") {
    try {
      const observer = new ResizeObserver(function () { handleViewportChange(); });
      observer.observe(document.getElementById("book-area"));
    } catch (error) {}
  }

  /* ========================================================
     DÉMARRAGE
     ======================================================== */
  const initialLanguage = detectLanguage();
  setActiveLanguage(initialLanguage);
  requestCatalogue(initialLanguage, false);

})();
</script>
</body>
</html>
