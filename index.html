<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue V14</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  #catalogue-reader {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0;
    text-align: center;
  }

  /* =========================================================
     LANGUES
     ========================================================= */

  #catalogue-languages {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 0 18px;
  }

  .lang-btn {
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 2px;
    margin: 0;
    font-size: 40px;
    line-height: 1;
    cursor: pointer;
    opacity: .40;
    transform: scale(1);
    transition: opacity .20s ease, transform .20s ease;
  }

  .lang-btn:hover {
    opacity: .88;
    transform: scale(1.08);
  }

  .lang-btn.active {
    opacity: 1;
    transform: scale(1.14);
  }

  /* =========================================================
     ZONE LIVRE
     ========================================================= */

  #book-area {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 58px;
  }

  /*
    IMPORTANT :
    le livre est transparent autour de ses pages.
    Cela permet de voir le fond du site lorsqu'une moitié
    du livre ne contient aucune page.
  */
  #book {
    position: relative;
    width: min(1120px, 100%);
    max-width: 1120px;
    aspect-ratio: 1.41421356 / 1;
    margin: 0 auto;
    transform: translateZ(0);
    transform-style: preserve-3d;
    background: transparent !important;
  }

  /* =========================================================
     FLÈCHES
     ========================================================= */

  .book-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;

    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.54);
    color: #fff;

    font-size: 36px;
    line-height: 1;

    cursor: pointer;

    transition:
      background .18s ease,
      transform .18s ease,
      opacity .18s ease;
  }

  .book-arrow:hover:not(:disabled) {
    background: rgba(0,0,0,.78);
    transform: translateY(-50%) scale(1.05);
  }

  .book-arrow:disabled {
    opacity: .18;
    cursor: default;
  }

  #first-page { left: 3px; }
  #prev-page  { left: 62px; }
  #next-page  { right: 62px; }
  #last-page  { right: 3px; }

  /*
    Les flèches restent visibles même sur les couvertures.
    La désactivation dépend uniquement de la première/dernière
    page, pas de l'orientation.
  */

  /* =========================================================
     CHARGEMENT
     ========================================================= */

  #loading {
    position: absolute;
    inset: 0;
    z-index: 90;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;

    color: rgba(0,0,0,.55);
    font-size: 14px;

    opacity: 1;
    transition: opacity .25s ease;
  }

  #loading.hidden {
    opacity: 0;
  }

  #status {
    display: none;

    max-width: 92%;
    margin: 16px auto;

    color: #666;

    font-size: 14px;
    line-height: 1.45;
  }

  /* =========================================================
     CONTROLES
     ========================================================= */

  #reader-controls {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 8px;

    margin: 14px 0 0;
  }

  #reader-controls button {
    appearance: none;
    border: 0;
    outline: 0;

    background: transparent;

    padding: 6px 9px;

    font-size: 22px;

    cursor: pointer;

    border-radius: 8px;

    transition: background .18s ease;
  }

  #reader-controls button:hover {
    background: rgba(0,0,0,.06);
  }

  #page-number {
    min-width: 104px;

    font-size: 14px;

    font-variant-numeric: tabular-nums;

    text-align: center;
  }

  /* =========================================================
     MOBILE
     ========================================================= */

  @media (max-width: 700px) {

    #catalogue-languages {
      gap: 9px;
      margin-bottom: 13px;
    }

    .lang-btn {
      font-size: 34px;
    }

    #book-area {
      padding: 0 40px;
    }

    /*
      Sur mobile, PageFlip utilise le mode portrait :
      couverture seule au centre,
      pages intérieures une par une.
    */
    #book {
      width: min(92vw, 470px);
      aspect-ratio: 1 / 1.41421356;
      max-width: 470px;
    }

    .book-arrow {
      width: 43px;
      height: 43px;
      font-size: 29px;
    }

    #first-page { left: 1px; }
    #prev-page  { left: 48px; }
    #next-page  { right: 48px; }
    #last-page  { right: 1px; }

  }

  /* =========================================================
     PLEIN ÉCRAN
     ========================================================= */

  #catalogue-reader:fullscreen {
    width: 100vw;
    max-width: none;
    height: 100vh;

    background: #fff;

    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  #catalogue-reader:fullscreen #book-area {
    flex: 0 0 auto;
  }

</style>
</head>

<body>

<div id="catalogue-reader">

  <!-- =======================================================
       DRAPEAUX
       ======================================================= -->

  <div id="catalogue-languages"
       aria-label="Choisir la langue du catalogue">

    <button
      class="lang-btn"
      data-lang="fr"
      type="button"
      aria-label="Français">
      🇫🇷
    </button>

    <button
      class="lang-btn"
      data-lang="en"
      type="button"
      aria-label="English">
      🇬🇧
    </button>

    <button
      class="lang-btn"
      data-lang="it"
      type="button"
      aria-label="Italiano">
      🇮🇹
    </button>

    <button
      class="lang-btn"
      data-lang="es"
      type="button"
      aria-label="Español">
      🇪🇸
    </button>

  </div>


  <!-- =======================================================
       LIVRE
       ======================================================= -->

  <div id="book-area">

    <button
      id="first-page"
      class="book-arrow"
      type="button"
      aria-label="Première page">
      «
    </button>


    <button
      id="prev-page"
      class="book-arrow"
      type="button"
      aria-label="Page précédente">
      ‹
    </button>


    <div id="book"></div>


    <button
      id="next-page"
      class="book-arrow"
      type="button"
      aria-label="Page suivante">
      ›
    </button>


    <button
      id="last-page"
      class="book-arrow"
      type="button"
      aria-label="Dernière page">
      »
    </button>


    <div id="loading">
      Chargement du catalogue…
    </div>

  </div>


  <!-- =======================================================
       CONTRÔLES
       ======================================================= -->

  <div id="reader-controls">

    <button
      id="zoom-out"
      type="button"
      aria-label="Réduire le zoom">
      −
    </button>

    <span id="page-number">
      1 / 1
    </span>

    <button
      id="zoom-in"
      type="button"
      aria-label="Augmenter le zoom">
      +
    </button>

    <button
      id="fullscreen"
      type="button"
      aria-label="Plein écran">
      ⛶
    </button>

  </div>


  <div id="status"></div>

</div>


<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- =========================================================
     PAGEFLIP
     ========================================================= -->

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>

(function () {

  "use strict";


  /* ========================================================
     PDF.JS
     ======================================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ========================================================
     URLS EXACTES
     ======================================================== */

  const catalogues = {

    fr:
      "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",

    en:
      "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",

    it:
      "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",

    es:
      "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"

  };


  /* ========================================================
     ÉLÉMENTS
     ======================================================== */

  const bookElement =
    document.getElementById("book");

  const loading =
    document.getElementById("loading");

  const status =
    document.getElementById("status");

  const pageNumber =
    document.getElementById("page-number");

  const firstButton =
    document.getElementById("first-page");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const lastButton =
    document.getElementById("last-page");

  const fullscreenButton =
    document.getElementById("fullscreen");

  const zoomInButton =
    document.getElementById("zoom-in");

  const zoomOutButton =
    document.getElementById("zoom-out");

  const languageButtons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );


  /* ========================================================
     ÉTAT
     ======================================================== */

  let pageFlip = null;

  let pdf = null;

  let activeLanguage = "fr";

  let loadingCatalogue = false;


  /* ========================================================
     UTILITAIRES
     ======================================================== */

  function setActiveLanguage(language) {

    languageButtons.forEach(
      function (button) {

        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );

      }
    );

  }


  function showLoading(message) {

    loading.textContent =
      message || "Chargement du catalogue…";

    loading.classList.remove(
      "hidden"
    );

  }


  function hideLoading() {

    loading.classList.add(
      "hidden"
    );

  }


  function showError(message) {

    status.textContent =
      message;

    status.style.display =
      "block";

    hideLoading();

  }


  function hideError() {

    status.style.display =
      "none";

  }


  /* ========================================================
     LANGUE DU SITE
     ======================================================== */

  function detectLanguage() {

    /*
      1 — ?lang=fr
    */

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const queryLang =
        (
          params.get("lang") ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[queryLang]
      ) {

        return queryLang;

      }

    } catch (error) {}


    /*
      2 — Langue du document.
    */

    const htmlLang =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLang]
    ) {

      return htmlLang;

    }


    /*
      3 — Langue du navigateur.
    */

    try {

      const browserLang =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[browserLang]
      ) {

        return browserLang;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     RENDRE UNE PAGE PDF HAUTE RÉSOLUTION
     ======================================================== */

  async function renderPageToImage(
    pageIndex
  ) {

    const page =
      await pdf.getPage(
        pageIndex
      );


    const baseViewport =
      page.getViewport({
        scale: 1
      });


    /*
      Résolution volontairement élevée :
      les images restent nettes pendant le mouvement
      de la page et sur les écrans Retina.

      1600 px de largeur est largement suffisant
      pour une page affichée dans la liseuse.
    */

    const targetWidth =
      1600;


    const scale =
      targetWidth /
      baseViewport.width;


    const viewport =
      page.getViewport({
        scale: scale
      });


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      Math.ceil(
        viewport.width
      );

    canvas.height =
      Math.ceil(
        viewport.height
      );


    const context =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    context.fillStyle =
      "#ffffff";

    context.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    await page.render({

      canvasContext:
        context,

      viewport:
        viewport,

      intent:
        "display",

      renderInteractiveForms:
        true

    }).promise;


    /*
      PNG sans perte pour conserver au maximum
      la netteté du PDF.
    */

    const blob =
      await new Promise(
        function (resolve) {

          canvas.toBlob(
            resolve,
            "image/png"
          );

        }
      );


    if (!blob) {

      throw new Error(
        "Impossible de préparer la page " +
        pageIndex
      );

    }


    const url =
      URL.createObjectURL(
        blob
      );


    return url;

  }


  /* ========================================================
     LIBÉRER LES URLS
     ======================================================== */

  function revokeImages(
    images
  ) {

    images.forEach(
      function (url) {

        try {

          URL.revokeObjectURL(
            url
          );

        } catch (error) {}

      }
    );

  }


  /* ========================================================
     CRÉER UNE VRAIE LISEUSE
     ======================================================== */

  function createBook(
    images
  ) {

    /*
      Le livre utilise le système natif de PageFlip.

      showCover:true :
        - page 1 = couverture seule, centrée
        - pages intérieures = double page
        - dernière page = couverture seule, centrée

      usePortrait:true :
        - mobile = page seule
        - desktop = double page

      La transition est donc gérée par PageFlip
      comme une vraie feuille accrochée à sa reliure.
    */

    pageFlip =
      new St.PageFlip(
        bookElement,
        {

          width: 760,

          height: 1075,

          size: "stretch",

          minWidth: 250,

          maxWidth: 1800,

          minHeight: 350,

          maxHeight: 2550,

          /*
            Animation réaliste :
            un peu plus lente qu'un simple slide.
          */

          flippingTime: 950,

          /*
            Première + dernière pages seules.
          */

          showCover: true,

          /*
            Ombres.
          */

          drawShadow: true,

          maxShadowOpacity: .78,

          /*
            Coins.
          */

          showPageCorners: true,

          /*
            Navigation tactile/souris.
          */

          useMouseEvents: true,

          swipeDistance: 25,

          clickEventForward: false,

          mobileScrollSupport: true,

          /*
            Responsive :
            double page desktop,
            page seule mobile.
          */

          usePortrait: true,

          startPage: 0,

          startZIndex: 20,

          autoSize: false

        }
      );


    pageFlip.loadFromImages(
      images
    );


    pageFlip.turnToPage(
      0
    );


    /*
      Mise à jour immédiate.
    */

    requestAnimationFrame(
      updateCounter
    );

  }


  /* ========================================================
     COMPTEUR
     ======================================================== */

  function updateCounter() {

    if (
      !pageFlip ||
      !pdf
    ) {

      return;

    }


    const index =
      pageFlip.getCurrentPageIndex();


    const total =
      pdf.numPages;


    /*
      Première couverture.
    */

    if (
      index === 0
    ) {

      pageNumber.textContent =
        "1 / " +
        total;

    }

    /*
      Dernière couverture.
    */

    else if (
      index === total - 1
    ) {

      pageNumber.textContent =
        total +
        " / " +
        total;

    }

    /*
      Pages intérieures.
    */

    else {

      const first =
        index + 1;


      const second =
        Math.min(
          index + 2,
          total
        );


      /*
        En double page on affiche
        "2–3 / 44", "4–5 / 44", etc.
      */

      pageNumber.textContent =
        first +
        "–" +
        second +
        " / " +
        total;

    }


    firstButton.disabled =
      index <= 0;

    prevButton.disabled =
      index <= 0;

    nextButton.disabled =
      index >= total - 1;

    lastButton.disabled =
      index >= total - 1;

  }


  /* ========================================================
     ÉVÉNEMENTS PAGEFLIP
     ======================================================== */

  function attachPageFlipEvents() {

    if (
      !pageFlip
    ) {

      return;

    }


    pageFlip.on(
      "flip",
      function () {

        updateCounter();

      }
    );


    pageFlip.on(
      "changeOrientation",
      function () {

        updateCounter();

      }
    );

  }


  /* ========================================================
     CHARGER UN CATALOGUE
     ======================================================== */

  async function loadCatalogue(
    language
  ) {

    if (
      loadingCatalogue
    ) {

      return;

    }


    if (
      !catalogues[language]
    ) {

      language =
        "fr";

    }


    loadingCatalogue =
      true;


    activeLanguage =
      language;


    setActiveLanguage(
      language
    );


    hideError();

    showLoading();


    let images = [];


    try {

      /*
        Détruire le livre précédent
        avant de commencer.
      */

      if (
        pageFlip
      ) {

        try {

          pageFlip.destroy();

        } catch (error) {}

        pageFlip = null;

      }


      /*
        URL exacte GitHub Pages.
      */

      const response =
        await fetch(
          catalogues[language],
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          catalogues[language]
        );

      }


      const data =
        await response.arrayBuffer();


      pdf =
        await pdfjsLib.getDocument({
          data: data
        }).promise;


      /*
        Préparer toutes les pages.
      */

      for (
        let i = 1;
        i <= pdf.numPages;
        i++
      ) {

        showLoading(
          "Préparation du catalogue " +
          i +
          " / " +
          pdf.numPages +
          "…"
        );


        images.push(
          await renderPageToImage(
            i
          )
        );

      }


      /*
        Création de la liseuse.
      */

      createBook(
        images
      );


      attachPageFlipEvents();


      hideLoading();


    } catch (error) {

      console.error(
        "Erreur catalogue :",
        error
      );


      /*
        Si la construction a échoué,
        les object URLs déjà créées sont libérées.
      */

      revokeImages(
        images
      );


      showError(
        "Impossible de charger le catalogue : " +
        (
          error &&
          error.message
            ? error.message
            : "erreur inconnue"
        )
      );


    } finally {

      loadingCatalogue =
        false;

    }

  }


  /* ========================================================
     DRAPEAUX
     ======================================================== */

  languageButtons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {

          loadCatalogue(
            button.dataset.lang
          );

        }
      );

    }
  );


  /* ========================================================
     FLÈCHES
     ======================================================== */

  firstButton.addEventListener(
    "click",
    function () {
      if (pageFlip) {
        pageFlip.turnToPage(0);
      }
    }
  );


  lastButton.addEventListener(
    "click",
    function () {
      if (pageFlip && pdf) {
        pageFlip.turnToPage(
          Math.max(0, pdf.numPages - 1)
        );
      }
    }
  );


  prevButton.addEventListener(
    "click",
    function () {

      if (
        pageFlip
      ) {

        pageFlip.flipPrev(
          "bottom"
        );

      }

    }
  );


  nextButton.addEventListener(
    "click",
    function () {

      if (
        pageFlip
      ) {

        pageFlip.flipNext(
          "bottom"
        );

      }

    }
  );


  /* ========================================================
     ZOOM
     ======================================================== */

  let readerScale = 1;


  zoomInButton.addEventListener(
    "click",
    function () {

      readerScale =
        Math.min(
          1.14,
          readerScale + .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      bookElement.style.transformOrigin =
        "center center";

    }
  );


  zoomOutButton.addEventListener(
    "click",
    function () {

      readerScale =
        Math.max(
          .90,
          readerScale - .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      bookElement.style.transformOrigin =
        "center center";

    }
  );


  /* ========================================================
     PLEIN ÉCRAN
     ======================================================== */

  fullscreenButton.addEventListener(
    "click",
    async function () {

      try {

        if (
          !document.fullscreenElement
        ) {

          await document
            .getElementById(
              "catalogue-reader"
            )
            .requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(
          "Fullscreen:",
          error
        );

      }

    }
  );


  /* ========================================================
     CLAVIER
     ======================================================== */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        !pageFlip
      ) {

        return;

      }


      if (
        event.key === "ArrowRight"
      ) {

        pageFlip.flipNext(
          "bottom"
        );

      }


      if (
        event.key === "ArrowLeft"
      ) {

        pageFlip.flipPrev(
          "bottom"
        );

      }

    }
  );


  /* ========================================================
     DÉMARRAGE
     ======================================================== */

  loadCatalogue(
    detectLanguage()
  );

})();

</script>

</body>
</html>
