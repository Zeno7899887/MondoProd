<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  #catalogue-reader {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    text-align: center;
  }

  /* =========================================================
     LANGUES
     ========================================================= */

  #catalogue-languages {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 0 18px;
  }

  .lang-btn {
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 2px;
    margin: 0;
    font-size: 40px;
    line-height: 1;
    cursor: pointer;
    opacity: .40;
    transform: scale(1);
    transition:
      opacity .20s ease,
      transform .20s ease;
  }

  .lang-btn:hover {
    opacity: .88;
    transform: scale(1.08);
  }

  .lang-btn.active {
    opacity: 1;
    transform: scale(1.14);
  }

  .lang-btn:disabled {
    cursor: default;
  }

  /* =========================================================
     LIVRE
     ========================================================= */

  #book-area {
    position: relative;
    width: 100%;
    padding: 0 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #book-stage {
    position: relative;
    width: min(1120px, 100%);
    max-width: 1120px;
    aspect-ratio: 1.41421356 / 1;
    margin: 0 auto;
    background: transparent !important;
    perspective: 2500px;
    transform-style: preserve-3d;
    overflow: visible;
  }

  #inner-book {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent !important;
    z-index: 10;
  }

  #inner-book.hidden {
    display: none !important;
  }

  .pdf-page {
    position: relative;
    overflow: hidden;
    background: #fff;
    margin: 0;
    padding: 0;
  }

  .pdf-page canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
  }

  /* =========================================================
     COUVERTURES
     ========================================================= */

  #cover-layer {
    position: absolute;
    inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: transparent !important;
  }

  #cover-layer.hidden {
    display: none !important;
  }

  .cover-page {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    max-width: 560px;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 20px 48px rgba(0,0,0,.24),
      0 1px 3px rgba(0,0,0,.12);
    transform-style: preserve-3d;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    will-change: transform;
  }

  .cover-page canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #fff;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  #front-cover {
    left: 50%;
    transform: translateX(-50%) rotateY(0deg);
    transform-origin: left center;
  }

  #back-cover {
    left: 50%;
    transform: translateX(-50%) rotateY(0deg);
    transform-origin: right center;
    display: none;
  }

  /*
    Ombre légère sur la couverture pendant le mouvement,
    sans modifier la position de la page.
  */
  .cover-page::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(
        90deg,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,.035) 82%,
        rgba(0,0,0,.16) 100%
      );
    opacity: .72;
  }

  /* =========================================================
     APERÇU SOUS LES COUVERTURES
     ========================================================= */

  #interior-preview {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    pointer-events: none;
    background: transparent;
  }

  #preview-left,
  #preview-right {
    width: 50%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  #preview-left canvas,
  #preview-right canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  @media (max-width: 700px) {
    #preview-left {
      display: none;
    }

    #preview-right {
      width: 100%;
    }
  }

  /* =========================================================
     FLÈCHES
     ========================================================= */

  .book-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 150;

    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.54);
    color: #fff;

    font-size: 36px;
    line-height: 1;

    cursor: pointer;

    transition:
      background .18s ease,
      transform .18s ease,
      opacity .18s ease;
  }

  .book-arrow:hover:not(:disabled) {
    background: rgba(0,0,0,.78);
    transform: translateY(-50%) scale(1.05);
  }

  .book-arrow:disabled {
    opacity: .18;
    cursor: default;
  }

  #first-page { left: 2px; }
  #prev-page  { left: 62px; }
  #next-page  { right: 62px; }
  #last-page  { right: 2px; }

  /* =========================================================
     CHARGEMENT
     ========================================================= */

  #loading {
    position: absolute;
    inset: 0;
    z-index: 200;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;

    color: rgba(0,0,0,.55);
    font-size: 14px;

    opacity: 1;
    transition: opacity .20s ease;
  }

  #loading.hidden {
    opacity: 0;
  }

  #status {
    display: none;
    max-width: 92%;
    margin: 16px auto;
    color: #666;
    font-size: 14px;
    line-height: 1.45;
  }

  /* =========================================================
     CONTROLES
     ========================================================= */

  #reader-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }

  #reader-controls button {
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 6px 9px;
    font-size: 22px;
    cursor: pointer;
    border-radius: 8px;
  }

  #reader-controls button:hover {
    background: rgba(0,0,0,.06);
  }

  #page-number {
    min-width: 106px;
    text-align: center;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* =========================================================
     MOBILE
     ========================================================= */

  @media (max-width: 700px) {
    #catalogue-languages {
      gap: 9px;
      margin-bottom: 13px;
    }

    .lang-btn {
      font-size: 34px;
    }

    #book-area {
      padding: 0 42px;
    }

    #book-stage {
      width: min(92vw, 470px);
      aspect-ratio: 1 / 1.41421356;
      max-width: 470px;
    }

    .cover-page {
      width: 100%;
      max-width: 470px;
    }

    #front-cover,
    #back-cover {
      left: 0;
      width: 100%;
      transform: translateX(0) rotateY(0deg);
    }

    #first-page { left: 0; }
    #prev-page {
      left: 0;
      top: calc(50% + 55px);
    }
    #next-page {
      right: 0;
      top: calc(50% + 55px);
    }
    #last-page { right: 0; }

    .book-arrow {
      width: 43px;
      height: 43px;
      font-size: 29px;
    }

    #reader-controls {
      margin-top: 11px;
    }
  }

  /* =========================================================
     PLEIN ÉCRAN
     ========================================================= */

  #catalogue-reader:fullscreen {
    width: 100vw;
    max-width: none;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <div id="catalogue-languages" aria-label="Choisir la langue du catalogue">

    <button class="lang-btn" data-lang="fr" type="button" aria-label="Français">🇫🇷</button>
    <button class="lang-btn" data-lang="en" type="button" aria-label="English">🇬🇧</button>
    <button class="lang-btn" data-lang="it" type="button" aria-label="Italiano">🇮🇹</button>
    <button class="lang-btn" data-lang="es" type="button" aria-label="Español">🇪🇸</button>

  </div>


  <div id="book-area">

    <button id="first-page" class="book-arrow" type="button" aria-label="Première page">«</button>

    <button id="prev-page" class="book-arrow" type="button" aria-label="Page précédente">‹</button>


    <div id="book-stage">

      <div id="inner-book" class="hidden"></div>


      <div id="interior-preview">

        <div id="preview-left"></div>
        <div id="preview-right"></div>

      </div>


      <div id="cover-layer" class="hidden">

        <div id="front-cover" class="cover-page">
          <canvas id="front-cover-canvas"></canvas>
        </div>

        <div id="back-cover" class="cover-page">
          <canvas id="back-cover-canvas"></canvas>
        </div>

      </div>


      <div id="loading">
        Chargement du catalogue…
      </div>

    </div>


    <button id="next-page" class="book-arrow" type="button" aria-label="Page suivante">›</button>

    <button id="last-page" class="book-arrow" type="button" aria-label="Dernière page">»</button>

  </div>


  <div id="reader-controls">

    <button id="zoom-out" type="button" aria-label="Réduire le zoom">−</button>

    <span id="page-number">1 / 1</span>

    <button id="zoom-in" type="button" aria-label="Augmenter le zoom">+</button>

    <button id="fullscreen" type="button" aria-label="Plein écran">⛶</button>

  </div>


  <div id="status"></div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>
(function () {

  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ========================================================
     URLS PUBLIQUES EXACTES
     ======================================================== */

  const catalogues = {

    fr:
      "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",

    en:
      "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",

    it:
      "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",

    es:
      "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"

  };


  /* ========================================================
     ELEMENTS
     ======================================================== */

  const stage =
    document.getElementById("book-stage");

  const innerBook =
    document.getElementById("inner-book");

  const preview =
    document.getElementById("interior-preview");

  const previewLeft =
    document.getElementById("preview-left");

  const previewRight =
    document.getElementById("preview-right");

  const coverLayer =
    document.getElementById("cover-layer");

  const frontCover =
    document.getElementById("front-cover");

  const backCover =
    document.getElementById("back-cover");

  const frontCanvas =
    document.getElementById("front-cover-canvas");

  const backCanvas =
    document.getElementById("back-cover-canvas");

  const loading =
    document.getElementById("loading");

  const status =
    document.getElementById("status");

  const counter =
    document.getElementById("page-number");

  const firstButton =
    document.getElementById("first-page");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const lastButton =
    document.getElementById("last-page");

  const zoomIn =
    document.getElementById("zoom-in");

  const zoomOut =
    document.getElementById("zoom-out");

  const fullscreen =
    document.getElementById("fullscreen");

  const languageButtons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );


  /* ========================================================
     ETAT
     ======================================================== */

  let pdf =
    null;

  let pageFlip =
    null;

  let pageEntries =
    new Map();

  let activeLanguage =
    "fr";

  let mode =
    "front";

  let currentInnerIndex =
    0;

  let busy =
    false;

  let loadingCatalogue =
    false;

  let loadToken =
    0;

  let currentAbortController =
    null;

  let readerScale =
    1;


  /* ========================================================
     AFFICHAGE
     ======================================================== */

  function showLoading(
    text
  ) {

    loading.textContent =
      text ||
      "Chargement du catalogue…";

    loading.classList.remove(
      "hidden"
    );

  }


  function hideLoading() {

    loading.classList.add(
      "hidden"
    );

  }


  function showError(
    message
  ) {

    status.textContent =
      message;

    status.style.display =
      "block";

    hideLoading();

  }


  function hideError() {

    status.style.display =
      "none";

  }


  function setActiveLanguage(
    language
  ) {

    languageButtons.forEach(
      function (button) {

        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );

      }
    );

  }


  function setLanguageButtonsDisabled(
    disabled
  ) {

    /*
      Les drapeaux restent cliquables pendant
      un chargement de langue.
      Un second clic remplace proprement le premier.
    */

    languageButtons.forEach(
      function (button) {

        button.disabled =
          false;

      }
    );

  }


  /* ========================================================
     LANGUE DU SITE
     ======================================================== */

  function detectLanguage() {

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const query =
        (
          params.get("lang") ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[query]
      ) {

        return query;

      }

    } catch (error) {}


    const htmlLang =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLang]
    ) {

      return htmlLang;

    }


    try {

      const browser =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[browser]
      ) {

        return browser;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     NETTOYAGE
     ======================================================== */

  function destroyInnerBook() {


    if (
      pageFlip
    ) {

      try {

        pageFlip.destroy();

      } catch (error) {}

      pageFlip =
        null;

    }


    innerBook.innerHTML =
      "";


    pageEntries =
      new Map();

    currentInnerIndex =
      0;

  }


  /* ========================================================
     CRÉER UNE PAGE INTÉRIEURE
     ======================================================== */

  function createPageElement(
    pdfPageNumber
  ) {

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "pdf-page";


    const canvas =
      document.createElement(
        "canvas"
      );


    wrapper.appendChild(
      canvas
    );


    pageEntries.set(
      pdfPageNumber,
      {
        wrapper: wrapper,
        canvas: canvas,
        rendered: false,
        rendering: null,
        renderSize: ""
      }
    );


    return wrapper;

  }


  /* ========================================================
     RENDU HD À LA DEMANDE
     ======================================================== */

  async function renderEntry(
    pdfPageNumber
  ) {

    const entry =
      pageEntries.get(
        pdfPageNumber
      );


    if (
      !entry ||
      !pdf
    ) {

      return;

    }


    const width =
      Math.max(
        1,
        entry.wrapper.clientWidth
      );

    const height =
      Math.max(
        1,
        entry.wrapper.clientHeight
      );


    /*
      Si le moteur n'a pas encore donné de dimension,
      on attend son premier layout.
    */

    if (
      width < 50 ||
      height < 50
    ) {

      await new Promise(
        function (resolve) {

          requestAnimationFrame(
            resolve
          );

        }
      );

    }


    const currentWidth =
      Math.max(
        1,
        entry.wrapper.clientWidth
      );

    const currentHeight =
      Math.max(
        1,
        entry.wrapper.clientHeight
      );


    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        3
      );


    const renderKey =
      Math.round(
        currentWidth
      ) +
      "x" +
      Math.round(
        currentHeight
      ) +
      "@" +
      dpr;


    /*
      Si la page existe déjà en HD à cette taille,
      aucun nouveau rendu.
    */

    if (
      entry.rendered &&
      entry.renderSize === renderKey
    ) {

      return;

    }


    if (
      entry.rendering
    ) {

      return entry.rendering;

    }


    entry.rendering =
      (async function () {

        const page =
          await pdf.getPage(
            pdfPageNumber
          );


        const base =
          page.getViewport({
            scale: 1
          });


        const fit =
          Math.min(
            currentWidth / base.width,
            currentHeight / base.height
          );


        /*
          Rendu toujours plus dense que l'affichage.
          Le canvas final est au minimum 2x CSS et jusqu'à 3x
          sur Retina, avec une limite raisonnable.
        */

        const targetPixelWidth =
          Math.min(
            2600,
            Math.max(
              1600,
              Math.round(
                currentWidth *
                dpr
              )
            )
          );


        const scale =
          Math.min(
            fit * dpr,
            targetPixelWidth /
              base.width
          );


        const viewport =
          page.getViewport({
            scale: scale
          });


        entry.canvas.width =
          Math.ceil(
            viewport.width
          );


        entry.canvas.height =
          Math.ceil(
            viewport.height
          );


        entry.canvas.style.width =
          "100%";

        entry.canvas.style.height =
          "100%";


        const ctx =
          entry.canvas.getContext(
            "2d",
            {
              alpha:
                false
            }
          );


        ctx.imageSmoothingEnabled =
          true;

        ctx.imageSmoothingQuality =
          "high";


        ctx.fillStyle =
          "#fff";


        ctx.fillRect(
          0,
          0,
          entry.canvas.width,
          entry.canvas.height
        );


        await page.render({

          canvasContext:
            ctx,

          viewport:
            viewport,

          intent:
            "display",

          renderInteractiveForms:
            true

        }).promise;


        entry.rendered =
          true;

        entry.renderSize =
          renderKey;

      })();


    try {

      await entry.rendering;

    } finally {

      entry.rendering =
        null;

    }

  }


  /* ========================================================
     PRECHARGEMENT LIMITÉ
     ======================================================== */

  async function preloadNear(
    innerIndex
  ) {

    if (
      !pdf
    ) {

      return;

    }


    const center =
      innerIndex + 2;


    const wanted = [

      center,
      center + 1,
      center + 2,
      center + 3

    ];


    const unique =
      Array.from(
        new Set(
          wanted.filter(
            function (n) {

              return (
                n >= 2 &&
                n <= pdf.numPages - 1
              );

            }
          )
        )
      );


    /*
      Première passe :
      page actuellement visible immédiatement.
    */

    if (
      unique.length
    ) {

      await renderEntry(
        unique[0]
      );

    }


    /*
      Puis les pages voisines.
    */

    for (
      let i = 1;
      i < unique.length;
      i++
    ) {

      /*
        Laisse le navigateur respirer entre deux rendus.
      */

      await new Promise(
        function (resolve) {

          requestAnimationFrame(
            resolve
          );

        }
      );


      await renderEntry(
        unique[i]
      );

    }

  }


  /* ========================================================
     RENDRE UNE COUVERTURE EN CANVAS HD
     ======================================================== */

  async function renderCover(
    pdfPageNumber,
    canvas
  ) {

    const page =
      await pdf.getPage(
        pdfPageNumber
      );


    const base =
      page.getViewport({
        scale: 1
      });


    const cssWidth =
      Math.max(
        1,
        canvas.parentElement.clientWidth
      );


    const cssHeight =
      Math.max(
        1,
        canvas.parentElement.clientHeight
      );


    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        3
      );


    const fit =
      Math.min(
        cssWidth / base.width,
        cssHeight / base.height
      );


    const maxWidth =
      Math.min(
        2600,
        Math.max(
          1800,
          Math.round(
            cssWidth *
            dpr
          )
        )
      );


    const scale =
      Math.min(
        fit * dpr,
        maxWidth / base.width
      );


    const viewport =
      page.getViewport({
        scale:
          scale
      });


    canvas.width =
      Math.ceil(
        viewport.width
      );

    canvas.height =
      Math.ceil(
        viewport.height
      );


    canvas.style.width =
      "100%";

    canvas.style.height =
      "100%";


    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha:
            false
        }
      );


    ctx.imageSmoothingEnabled =
      true;

    ctx.imageSmoothingQuality =
      "high";

    ctx.fillStyle =
      "#fff";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    await page.render({

      canvasContext:
        ctx,

      viewport:
        viewport,

      intent:
        "display"

    }).promise;

  }


  /* ========================================================
     CREER LE MOTEUR INTERIEUR
     ======================================================== */

  function createInnerBook() {

    destroyInnerBook();


    const elements =
      [];


    /*
      PDF 1 = couverture.
      PDF total = dernière page.
      Le moteur ne reçoit que PDF 2 -> total-1.
    */

    for (
      let pdfPage = 2;
      pdfPage < pdf.numPages;
      pdfPage++
    ) {

      elements.push(
        createPageElement(
          pdfPage
        )
      );

    }


    pageFlip =
      new St.PageFlip(
        innerBook,
        {

          width:
            760,

          height:
            1075,

          size:
            "stretch",

          minWidth:
            260,

          maxWidth:
            1800,

          minHeight:
            360,

          maxHeight:
            2550,

          flippingTime:
            900,

          drawShadow:
            true,

          maxShadowOpacity:
            .78,

          showPageCorners:
            true,

          useMouseEvents:
            true,

          swipeDistance:
            24,

          clickEventForward:
            false,

          mobileScrollSupport:
            true,

          usePortrait:
            true,

          showCover:
            false,

          autoSize:
            true,

          startPage:
            0,

          startZIndex:
            20

        }
      );


    pageFlip.loadFromHTML(
      elements
    );


    pageFlip.on(
      "flip",
      async function (event) {

        currentInnerIndex =
          event.data;


        updateCounter();


        /*
          Rend la page nouvellement visible
          et quelques voisines, sans bloquer
          l'interface.
        */

        preloadNear(
          currentInnerIndex
        );

      }
    );


    pageFlip.on(
      "changeOrientation",
      function () {

        updateCounter();


        preloadNear(
          pageFlip.getCurrentPageIndex()
        );

      }
    );


    pageFlip.turnToPage(
      0
    );

  }


  /* ========================================================
     APERÇU SOUS COUVERTURE
     ======================================================== */

  function clearPreview() {

    previewLeft.innerHTML =
      "";

    previewRight.innerHTML =
      "";

  }


  async function showOpeningPreview() {

    clearPreview();


    const firstEntry =
      pageEntries.get(2);


    if (
      firstEntry
    ) {

      await renderEntry(
        2
      );


      const canvas =
        firstEntry.canvas.cloneNode(
          true
        );


      previewRight.appendChild(
        canvas
      );

    }


    preview.style.display =
      "flex";

  }


  async function showClosingPreview() {

    clearPreview();


    const leftPage =
      Math.max(
        2,
        pdf.numPages - 2
      );


    const rightPage =
      Math.max(
        2,
        pdf.numPages - 1
      );


    const leftEntry =
      pageEntries.get(
        leftPage
      );


    const rightEntry =
      pageEntries.get(
        rightPage
      );


    if (
      leftEntry
    ) {

      await renderEntry(
        leftPage
      );


      previewLeft.appendChild(
        leftEntry.canvas.cloneNode(
          true
        )
      );

    }


    if (
      rightEntry &&
      !isMobile()
    ) {

      await renderEntry(
        rightPage
      );


      previewRight.appendChild(
        rightEntry.canvas.cloneNode(
          true
        )
      );

    }


    preview.style.display =
      "flex";

  }


  /* ========================================================
     ETAT COUVERTURE AVANT
     ======================================================== */

  function showFrontCover() {

    mode =
      "front";


    busy =
      false;


    innerBook.classList.add(
      "hidden"
    );


    preview.style.display =
      "none";


    coverLayer.classList.remove(
      "hidden"
    );


    frontCover.style.display =
      "block";


    backCover.style.display =
      "none";


    frontCover.style.width =
      isMobile()
        ? "100%"
        : "50%";


    frontCover.style.left =
      isMobile()
        ? "0"
        : "50%";


    frontCover.style.transformOrigin =
      "left center";


    frontCover.style.transition =
      "none";


    frontCover.style.transform =
      isMobile()
        ? "translateX(0) rotateY(0deg)"
        : "translateX(-50%) rotateY(0deg)";


    updateCounter();

  }


  /* ========================================================
     OUVERTURE COUVERTURE
     ======================================================== */

  async function openFrontCover() {

    if (
      busy ||
      !pdf
    ) {

      return;

    }


    busy =
      true;


    /*
      Le moteur intérieur est déjà présent.
      On ne prépare que la page immédiatement visible.
    */

    innerBook.classList.remove(
      "hidden"
    );


    await preloadNear(
      0
    );


    await showOpeningPreview();


    frontCover.style.transition =
      "none";


    frontCover.style.transform =
      isMobile()
        ? "translateX(0) rotateY(0deg)"
        : "translateX(-50%) rotateY(0deg)";


    coverLayer.classList.remove(
      "hidden"
    );


    requestAnimationFrame(
      function () {

        requestAnimationFrame(
          function () {

            frontCover.style.transition =
              "transform 900ms cubic-bezier(.215,.61,.355,1)";


            frontCover.style.transform =
              isMobile()
                ? "translateX(0) rotateY(-180deg)"
                : "translateX(-50%) rotateY(-180deg)";

          }
        );

      }
    );


    await new Promise(
      function (resolve) {

        setTimeout(
          resolve,
          930
        );

      }
    );


    frontCover.style.transition =
      "none";


    frontCover.style.transform =
      isMobile()
        ? "translateX(0)"
        : "translateX(-50%)";


    coverLayer.classList.add(
      "hidden"
    );


    preview.style.display =
      "none";


    mode =
      "inner";


    if (
      pageFlip
    ) {

      pageFlip.turnToPage(
        0
      );

    }


    updateCounter();


    busy =
      false;

  }


  /* ========================================================
     ETAT DERNIERE PAGE
     ======================================================== */

  function showBackCover() {

    mode =
      "back";


    innerBook.classList.add(
      "hidden"
    );


    preview.style.display =
      "none";


    coverLayer.classList.remove(
      "hidden"
    );


    frontCover.style.display =
      "none";


    backCover.style.display =
      "block";


    backCover.style.width =
      isMobile()
        ? "100%"
        : "50%";


    backCover.style.left =
      isMobile()
        ? "0"
        : "50%";


    backCover.style.transformOrigin =
      "right center";


    backCover.style.transition =
      "none";


    backCover.style.transform =
      isMobile()
        ? "translateX(0)"
        : "translateX(-50%)";


    updateCounter();

  }


  /* ========================================================
     FERMETURE VERS DERNIERE PAGE
     ======================================================== */

  async function closeToBackCover() {

    if (
      busy ||
      !pdf
    ) {

      return;

    }


    busy =
      true;


    const lastInnerIndex =
      Math.max(
        0,
        (
          pdf.numPages - 2
        ) - 2
      );


    await preloadNear(
      lastInnerIndex
    );


    await showClosingPreview();


    coverLayer.classList.remove(
      "hidden"
    );


    frontCover.style.display =
      "none";


    backCover.style.display =
      "block";


    backCover.style.width =
      isMobile()
        ? "100%"
        : "50%";


    backCover.style.left =
      isMobile()
        ? "0"
        : "50%";


    backCover.style.transformOrigin =
      isMobile()
        ? "right center"
        : "left center";


    backCover.style.transition =
      "none";


    backCover.style.transform =
      isMobile()
        ? "translateX(0) rotateY(0deg)"
        : "translateX(0) rotateY(0deg)";


    requestAnimationFrame(
      function () {

        requestAnimationFrame(
          function () {

            backCover.style.transition =
              "transform 900ms cubic-bezier(.215,.61,.355,1)";


            backCover.style.transform =
              isMobile()
                ? "translateX(0) rotateY(180deg)"
                : "translateX(0) rotateY(180deg)";

          }
        );

      }
    );


    await new Promise(
      function (resolve) {

        setTimeout(
          resolve,
          930
        );

      }
    );


    innerBook.classList.add(
      "hidden"
    );


    preview.style.display =
      "none";


    backCover.style.transition =
      "none";


    backCover.style.transform =
      isMobile()
        ? "translateX(0)"
        : "translateX(-50%)";


    mode =
      "back";


    updateCounter();


    busy =
      false;

  }


  /* ========================================================
     OUVRIR DEPUIS LE DOS
     ======================================================== */

  async function openBackCover() {

    if (
      busy ||
      !pdf
    ) {

      return;

    }


    busy =
      true;


    const lastInnerIndex =
      Math.max(
        0,
        (
          pdf.numPages - 2
        ) - 2
      );


    innerBook.classList.remove(
      "hidden"
    );


    await preloadNear(
      lastInnerIndex
    );


    if (
      pageFlip
    ) {

      pageFlip.turnToPage(
        lastInnerIndex
      );

    }


    await showClosingPreview();


    coverLayer.classList.remove(
      "hidden"
    );


    frontCover.style.display =
      "none";


    backCover.style.display =
      "block";


    backCover.style.width =
      isMobile()
        ? "100%"
        : "50%";


    backCover.style.left =
      isMobile()
        ? "0"
        : "50%";


    backCover.style.transformOrigin =
      "right center";


    backCover.style.transition =
      "none";


    backCover.style.transform =
      isMobile()
        ? "translateX(0) rotateY(0deg)"
        : "translateX(-50%) rotateY(0deg)";


    requestAnimationFrame(
      function () {

        requestAnimationFrame(
          function () {

            backCover.style.transition =
              "transform 900ms cubic-bezier(.215,.61,.355,1)";


            backCover.style.transform =
              isMobile()
                ? "translateX(0) rotateY(-180deg)"
                : "translateX(0) rotateY(-180deg)";

          }
        );

      }
    );


    await new Promise(
      function (resolve) {

        setTimeout(
          resolve,
          930
        );

      }
    );


    coverLayer.classList.add(
      "hidden"
    );


    preview.style.display =
      "none";


    backCover.style.transition =
      "none";


    backCover.style.transform =
      isMobile()
        ? "translateX(0)"
        : "translateX(-50%)";


    mode =
      "inner";


    if (
      pageFlip
    ) {

      pageFlip.turnToPage(
        lastInnerIndex
      );

    }


    updateCounter();


    busy =
      false;

  }


  /* ========================================================
     COMPTEUR
     ======================================================== */

  function updateCounter() {

    if (
      !pdf
    ) {

      return;

    }


    const total =
      pdf.numPages;


    if (
      mode ===
      "front"
    ) {

      counter.textContent =
        "1 / " +
        total;


      firstButton.disabled =
        true;

      prevButton.disabled =
        true;

      nextButton.disabled =
        false;

      lastButton.disabled =
        false;


      return;

    }


    if (
      mode ===
      "back"
    ) {

      counter.textContent =
        total +
        " / " +
        total;


      firstButton.disabled =
        false;

      prevButton.disabled =
        false;

      nextButton.disabled =
        true;

      lastButton.disabled =
        true;


      return;

    }


    if (
      !pageFlip
    ) {

      return;

    }


    const index =
      pageFlip.getCurrentPageIndex();


    currentInnerIndex =
      index;


    const firstPdfPage =
      index + 2;


    if (
      pageFlip.getOrientation() ===
      "portrait"
    ) {

      counter.textContent =
        firstPdfPage +
        " / " +
        total;

    } else {

      const secondPdfPage =
        Math.min(
          firstPdfPage + 1,
          total - 1
        );


      counter.textContent =
        firstPdfPage +
        "–" +
        secondPdfPage +
        " / " +
        total;

    }


    firstButton.disabled =
      false;

    lastButton.disabled =
      false;

    prevButton.disabled =
      index <= 0;


    const lastInnerIndex =
      Math.max(
        0,
        (
          total - 2
        ) - 2
      );


    nextButton.disabled =
      index >=
      lastInnerIndex;

  }


  /* ========================================================
     CHARGEMENT D'UNE LANGUE
     ======================================================== */

  async function loadLanguage(
    language
  ) {

    /*
      Un clic plus récent remplace immédiatement
      un chargement précédent.
    */

    loadToken += 1;

    const myToken =
      loadToken;


    if (
      currentAbortController
    ) {

      try {

        currentAbortController.abort();

      } catch (error) {}

    }


    currentAbortController =
      new AbortController();


    activeLanguage =
      catalogues[language]
        ? language
        : "fr";


    setActiveLanguage(
      activeLanguage
    );


    /*
      Désormais les drapeaux ne sont JAMAIS bloqués.
    */

    setLanguageButtonsDisabled(
      false
    );


    showLoading(
      "Chargement du catalogue…"
    );


    hideError();


    /*
      L'ancien livre disparaît seulement lorsque le nouveau
      PDF est prêt : pas d'écran vide pendant le téléchargement.
    */

    loadingCatalogue =
      true;


    try {

      const response =
        await fetch(
          catalogues[activeLanguage],
          {
            cache:
              "no-store",

            signal:
              currentAbortController.signal
          }
        );


      if (
        myToken !==
        loadToken
      ) {

        return;

      }


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          catalogues[activeLanguage]
        );

      }


      const data =
        await response.arrayBuffer();


      if (
        myToken !==
        loadToken
      ) {

        return;

      }


      const newPdf =
        await pdfjsLib
          .getDocument({
            data:
              data
          })
          .promise;


      if (
        myToken !==
        loadToken
      ) {

        try {

          newPdf.destroy();

        } catch (error) {}

        return;

      }


      /*
        Tout ce qui suit appartient au nouveau catalogue.
      */

      if (
        pageFlip
      ) {

        try {

          pageFlip.destroy();

        } catch (error) {}

        pageFlip =
          null;

      }


      innerBook.innerHTML =
        "";

      pageEntries =
        new Map();


      if (
        pdf
      ) {

        try {

          pdf.destroy();

        } catch (error) {}

      }


      pdf =
        newPdf;


      mode =
        "front";


      currentInnerIndex =
        0;


      /*
        Préparation UNIQUEMENT des deux couvertures.
        C'est ce qui rend le changement de langue rapide.
      */

      await renderCover(
        1,
        frontCanvas
      );


      if (
        myToken !==
        loadToken
      ) {

        return;

      }


      await renderCover(
        pdf.numPages,
        backCanvas
      );


      if (
        myToken !==
        loadToken
      ) {

        return;

      }


      /*
        Construction du moteur intérieur.
        Les pages internes ne sont PAS rendues maintenant.
      */

      createInnerBook();


      /*
        Couverture visible immédiatement.
      */

      showFrontCover();


      hideLoading();


      /*
        Le premier contenu intérieur est préparé en arrière-plan.
        Ça ne bloque plus l'affichage de la couverture.
      */

      window.setTimeout(
        function () {

          if (
            myToken === loadToken &&
            pdf
          ) {

            preloadNear(0);

          }

        },
        0
      );


    } catch (error) {

      /*
        Un ancien chargement annulé n'est pas une erreur à afficher.
      */

      if (
        error &&
        error.name ===
        "AbortError"
      ) {

        return;

      }


      if (
        myToken !==
        loadToken
      ) {

        return;

      }


      console.error(
        "Erreur chargement catalogue:",
        error
      );


      showError(
        "Impossible de charger le catalogue : " +
        (
          error &&
          error.message
            ? error.message
            : "erreur inconnue"
        )
      );


    } finally {

      if (
        myToken ===
        loadToken
      ) {

        loadingCatalogue =
          false;

      }

    }

  }


  /* ========================================================
     PREMIERE PAGE
     ======================================================== */

  firstButton.addEventListener(
    "click",
    async function () {

      if (
        busy ||
        !pdf ||
        mode === "front"
      ) {

        return;

      }


      /*
        Saut direct : aucun flip intermédiaire.
      */

      showFrontCover();

    }
  );


  /* ========================================================
     DERNIERE PAGE
     ======================================================== */

  lastButton.addEventListener(
    "click",
    async function () {

      if (
        busy ||
        !pdf ||
        mode === "back"
      ) {

        return;

      }


      /*
        Saut direct à la dernière page.
      */

      showBackCover();

    }
  );


  /* ========================================================
     PRECEDENT
     ======================================================== */

  prevButton.addEventListener(
    "click",
    async function () {

      if (
        busy ||
        !pdf
      ) {

        return;

      }


      if (
        mode === "front"
      ) {

        return;

      }


      if (
        mode === "back"
      ) {

        await openBackCover();

        return;

      }


      if (
        !pageFlip
      ) {

        return;

      }


      const index =
        pageFlip.getCurrentPageIndex();


      if (
        index <= 0
      ) {

        showFrontCover();

        return;

      }


      pageFlip.flipPrev(
        "bottom"
      );

    }
  );


  /* ========================================================
     SUIVANT
     ======================================================== */

  nextButton.addEventListener(
    "click",
    async function () {

      if (
        busy ||
        !pdf
      ) {

        return;

      }


      if (
        mode === "front"
      ) {

        await openFrontCover();

        return;

      }


      if (
        mode === "back"
      ) {

        return;

      }


      if (
        !pageFlip
      ) {

        return;

      }


      const index =
        pageFlip.getCurrentPageIndex();


      const lastInnerIndex =
        Math.max(
          0,
          (
            pdf.numPages - 2
          ) - 2
        );


      if (
        index >=
        lastInnerIndex
      ) {

        await closeToBackCover();

        return;

      }


      pageFlip.flipNext(
        "bottom"
      );

    }
  );


  /* ========================================================
     DRAPEAUX
     ======================================================== */

  languageButtons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {

          const language =
            button.dataset.lang;


          if (
            language ===
            activeLanguage &&
            !loadingCatalogue
          ) {

            return;

          }


          /*
            Important :
            on ne bloque plus jamais les boutons.
            Un clic lance/remplace le chargement.
          */

          loadLanguage(
            language
          );

        }
      );

    }
  );


  /* ========================================================
     ZOOM
     ======================================================== */

  zoomIn.addEventListener(
    "click",
    function () {

      readerScale =
        Math.min(
          1.12,
          readerScale + .04
        );


      stage.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      stage.style.transformOrigin =
        "center center";

    }
  );


  zoomOut.addEventListener(
    "click",
    function () {

      readerScale =
        Math.max(
          .90,
          readerScale - .04
        );


      stage.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      stage.style.transformOrigin =
        "center center";

    }
  );


  /* ========================================================
     PLEIN ECRAN
     ======================================================== */

  fullscreen.addEventListener(
    "click",
    async function () {

      try {

        if (
          !document.fullscreenElement
        ) {

          await reader.requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(
          "Fullscreen:",
          error
        );

      }

    }
  );


  /* ========================================================
     CLAVIER
     ======================================================== */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key ===
        "ArrowRight"
      ) {

        nextButton.click();

      }


      if (
        event.key ===
        "ArrowLeft"
      ) {

        prevButton.click();

      }


      if (
        event.key ===
        "Home"
      ) {

        firstButton.click();

      }


      if (
        event.key ===
        "End"
      ) {

        lastButton.click();

      }

    }
  );


  /* ========================================================
     SWIPE
     ======================================================== */

  let touchStartX =
    0;

  let touchStartY =
    0;


  stage.addEventListener(
    "touchstart",
    function (event) {

      const touch =
        event.changedTouches[0];


      touchStartX =
        touch.screenX;

      touchStartY =
        touch.screenY;

    },
    {
      passive:
        true
    }
  );


  stage.addEventListener(
    "touchend",
    function (event) {

      if (
        busy
      ) {

        return;

      }


      const touch =
        event.changedTouches[0];


      const dx =
        touchStartX -
        touch.screenX;


      const dy =
        touchStartY -
        touch.screenY;


      if (
        Math.abs(dx) < 45 ||
        Math.abs(dx) < Math.abs(dy)
      ) {

        return;

      }


      if (
        dx > 0
      ) {

        nextButton.click();

      } else {

        prevButton.click();

      }

    },
    {
      passive:
        true
    }
  );


  /* ========================================================
     RESIZE
     ======================================================== */

  window.addEventListener(
    "resize",
    function () {

      clearTimeout(
        window.__catalogueResize
      );


      window.__catalogueResize =
        setTimeout(
          async function () {

            if (
              pageFlip
            ) {

              pageEntries.forEach(
                function (entry) {

                  entry.rendered =
                    false;

                }
              );


              pageFlip.update();


              preloadNear(
                pageFlip.getCurrentPageIndex()
              );

            }


            if (
              pdf &&
              mode === "front"
            ) {

              await renderCover(
                1,
                frontCanvas
              );

            }


            if (
              pdf &&
              mode === "back"
            ) {

              await renderCover(
                pdf.numPages,
                backCanvas
              );

            }


            if (
              mode === "front"
            ) {

              frontCover.style.width =
                isMobile()
                  ? "100%"
                  : "50%";


              frontCover.style.left =
                isMobile()
                  ? "0"
                  : "50%";


              frontCover.style.transform =
                isMobile()
                  ? "translateX(0) rotateY(0deg)"
                  : "translateX(-50%) rotateY(0deg)";

            }


            if (
              mode === "back"
            ) {

              backCover.style.width =
                isMobile()
                  ? "100%"
                  : "50%";


              backCover.style.left =
                isMobile()
                  ? "0"
                  : "50%";


              backCover.style.transform =
                isMobile()
                  ? "translateX(0)"
                  : "translateX(-50%)";

            }


            updateCounter();

          },
          180
        );

    }
  );


  /* ========================================================
     DEMARRAGE
     ======================================================== */

  loadLanguage(
    detectLanguage()
  );

})();
</script>
