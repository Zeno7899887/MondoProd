<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue V18</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif; overflow-x:hidden; color:#1d1d1f; }

  #catalogue-reader {
    width:100%;
    max-width:1360px;
    margin:0 auto;
    padding:10px 14px 16px;
    text-align:center;
    isolation:isolate;
  }

  #catalogue-languages {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:0 0 14px;
  }

  .lang-btn {
    appearance:none;
    position:relative;
    z-index:1000;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-width:74px;
    height:38px;
    padding:0 11px;
    border:1px solid rgba(0,0,0,.10);
    border-radius:999px;
    outline:0;
    background:rgba(255,255,255,.84);
    color:rgba(0,0,0,.58);
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    opacity:.72;
    transform:translateY(0);
    transition:background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease;
    pointer-events:auto;
  }
  .lang-btn::after {
    content:attr(aria-label);
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .lang-btn:hover { opacity:1; transform:translateY(-1px); background:#fff; box-shadow:0 5px 16px rgba(0,0,0,.10); }
  .lang-btn.active { opacity:1; color:#111; background:#fff; border-color:rgba(0,0,0,.20); box-shadow:0 5px 18px rgba(0,0,0,.12); }
  .lang-btn:focus-visible { box-shadow:0 0 0 3px rgba(0,0,0,.12), 0 5px 18px rgba(0,0,0,.12); }

  #book-area {
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 72px;
    min-height:clamp(320px, 62vw, 790px);
  }

  #book {
    position:relative;
    width:min(1160px, 100%);
    max-width:1160px;
    aspect-ratio:1.41421356 / 1;
    margin:0 auto;
    transform:translateZ(0);
    transform-style:preserve-3d;
    background:transparent !important;
    overflow:visible;
  }

  #book .stf,
  #book .stf__wrapper,
  #book .stf__block {
    margin-left:auto !important;
    margin-right:auto !important;
  }
  #book .stf { left:0 !important; right:0 !important; }

  #book, #book .pdf-page, .book-arrow, .lang-btn { user-select:none; -webkit-user-select:none; }

  #book .pdf-page {
    background:#fff;
    overflow:hidden;
    padding:0;
    margin:0;
    box-shadow:none;
  }
  #book .pdf-page canvas {
    display:block;
    width:100%;
    height:100%;
    background:#fff;
    object-fit:fill;
    image-rendering:auto;
  }

  /* Keeps the unused half transparent while the physical cover is being turned. */
  #book.cover-flip-hiding .stf__item.--soft { visibility:hidden !important; }
  #book.cover-flip-hiding .stf__item.--hard { visibility:visible !important; }

  .book-arrow {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:100;
    width:46px;
    height:46px;
    appearance:none;
    border:1px solid rgba(0,0,0,.12);
    border-radius:50%;
    background:rgba(255,255,255,.90);
    color:#1b1b1b;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:31px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 0 2px;
    cursor:pointer;
    transition:background .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease, border-color .18s ease;
  }
  .book-arrow:hover:not(:disabled) { background:#fff; border-color:rgba(0,0,0,.20); box-shadow:0 8px 25px rgba(0,0,0,.16); transform:translateY(-50%) scale(1.04); }
  .book-arrow:active:not(:disabled) { transform:translateY(-50%) scale(.98); }
  .book-arrow:disabled { opacity:.25; cursor:default; box-shadow:none; }
  #first-page { left:10px; }
  #prev-page { left:62px; }
  #next-page { right:62px; }
  #last-page { right:10px; }

  #loading {
    position:absolute;
    inset:0;
    z-index:90;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    color:rgba(0,0,0,.60);
    font-size:13px;
    font-weight:500;
    letter-spacing:.01em;
    opacity:1;
    transition:opacity .25s ease;
  }
  #loading.hidden { opacity:0; }

  #status {
    display:none;
    max-width:780px;
    margin:12px auto 0;
    padding:10px 14px;
    border:1px solid rgba(190,30,45,.18);
    border-radius:10px;
    background:rgba(255,245,246,.86);
    color:#8b2833;
    font-size:13px;
    line-height:1.45;
  }

  #reader-controls {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    min-height:42px;
    margin:8px 0 0;
    padding:4px 8px;
    border:1px solid rgba(0,0,0,.08);
    border-radius:999px;
    width:max-content;
    max-width:100%;
    margin-left:auto;
    margin-right:auto;
    background:rgba(255,255,255,.68);
    box-shadow:0 2px 12px rgba(0,0,0,.05);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #reader-controls button {
    appearance:none;
    min-width:34px;
    height:32px;
    border:0;
    outline:0;
    background:transparent;
    color:rgba(0,0,0,.70);
    padding:0 8px;
    font-size:20px;
    cursor:pointer;
    border-radius:999px;
    transition:background .16s ease, color .16s ease, transform .16s ease;
  }
  #reader-controls button:hover { background:rgba(0,0,0,.06); color:#111; }
  #reader-controls button:focus-visible { box-shadow:0 0 0 3px rgba(0,0,0,.10); }
  #page-number { min-width:104px; padding:0 8px; font-size:12px; font-weight:600; color:rgba(0,0,0,.62); font-variant-numeric:tabular-nums; text-align:center; }

  #catalogue-reader:fullscreen { width:100vw; max-width:none; height:100vh; background:#fff; display:flex; flex-direction:column; justify-content:center; padding:12px 14px; }
  #catalogue-reader:fullscreen #book-area { flex:1 1 auto; min-height:0; }

  @media (max-width: 900px) {
    #catalogue-reader { padding-left:8px; padding-right:8px; }
    #book-area { padding:0 52px; min-height:0; }
    #book { width:min(100%, 1040px); }
    #first-page { left:2px; }
    #prev-page { left:48px; }
    #next-page { right:48px; }
    #last-page { right:2px; }
  }

  @media (max-width: 700px) {
    #catalogue-languages { gap:6px; margin-bottom:10px; }
    .lang-btn { min-width:58px; height:34px; padding:0 8px; font-size:16px; gap:5px; }
    .lang-btn::after { font-size:10px; }
    #book-area { padding:0 42px; }
    #book { width:min(92vw, 470px); aspect-ratio:1 / 1.41421356; max-width:470px; margin-left:auto !important; margin-right:auto !important; }
    .book-arrow { width:40px; height:40px; font-size:27px; }
    #first-page { left:0; }
    #prev-page { left:39px; }
    #next-page { right:39px; }
    #last-page { right:0; }
    #reader-controls { margin-top:6px; }
  }

  @media (max-width: 430px) {
    .lang-btn { min-width:0; width:44px; padding:0; }
    .lang-btn::after { display:none; }
    #book-area { padding:0 36px; }
    .book-arrow { width:36px; height:36px; font-size:24px; }
    #prev-page { left:34px; }
    #next-page { right:34px; }
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <!-- =======================================================
       DRAPEAUX
       ======================================================= -->

  <div id="catalogue-languages"
       aria-label="Choisir la langue du catalogue">

    <button
      class="lang-btn"
      data-lang="fr"
      type="button"
      aria-label="Français">
      🇫🇷
    </button>

    <button
      class="lang-btn"
      data-lang="en"
      type="button"
      aria-label="English">
      🇬🇧
    </button>

    <button
      class="lang-btn"
      data-lang="it"
      type="button"
      aria-label="Italiano">
      🇮🇹
    </button>

    <button
      class="lang-btn"
      data-lang="es"
      type="button"
      aria-label="Español">
      🇪🇸
    </button>

  </div>


  <!-- =======================================================
       LIVRE
       ======================================================= -->

  <div id="book-area">

    <button
      id="first-page"
      class="book-arrow"
      type="button"
      aria-label="Première page">
      «
    </button>


    <button
      id="prev-page"
      class="book-arrow"
      type="button"
      aria-label="Page précédente">
      ‹
    </button>


    <div id="book"></div>


    <button
      id="next-page"
      class="book-arrow"
      type="button"
      aria-label="Page suivante">
      ›
    </button>


    <button
      id="last-page"
      class="book-arrow"
      type="button"
      aria-label="Dernière page">
      »
    </button>


    <div id="loading">
      Chargement du catalogue…
    </div>

  </div>


  <!-- =======================================================
       CONTRÔLES
       ======================================================= -->

  <div id="reader-controls">

    <button
      id="zoom-out"
      type="button"
      aria-label="Réduire le zoom">
      −
    </button>

    <span id="page-number">
      1 / 1
    </span>

    <button
      id="zoom-in"
      type="button"
      aria-label="Augmenter le zoom">
      +
    </button>

    <button
      id="fullscreen"
      type="button"
      aria-label="Plein écran">
      ⛶
    </button>

  </div>


  <div id="status"></div>

</div>


<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- =========================================================
     PAGEFLIP
     ========================================================= -->

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>

(function () {

  "use strict";


  /* ========================================================
     PDF.JS
     ======================================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ========================================================
     URLS EXACTES
     ======================================================== */

  const catalogues = {

    fr:
      "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",

    en:
      "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",

    it:
      "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",

    es:
      "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"

  };


  /* ========================================================
     ÉLÉMENTS
     ======================================================== */

  const bookElement =
    document.getElementById("book");

  const loading =
    document.getElementById("loading");

  const status =
    document.getElementById("status");

  const pageNumber =
    document.getElementById("page-number");

  const firstButton =
    document.getElementById("first-page");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const lastButton =
    document.getElementById("last-page");

  const fullscreenButton =
    document.getElementById("fullscreen");

  const zoomInButton =
    document.getElementById("zoom-in");

  const zoomOutButton =
    document.getElementById("zoom-out");

  const languageButtons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );


  /* ========================================================
     ÉTAT
     ======================================================== */

  let pageFlip = null;

  let pdf = null;

  let activeLanguage = "fr";

  let loadRequestId = 0;
  let activeLoadRequestId = 0;


  /* ========================================================
     UTILITAIRES
     ======================================================== */

  function setActiveLanguage(language) {

    languageButtons.forEach(
      function (button) {

        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );

      }
    );

  }


  function showLoading(message) {

    loading.textContent =
      message || "Chargement du catalogue…";

    loading.classList.remove(
      "hidden"
    );

  }


  function hideLoading() {

    loading.classList.add(
      "hidden"
    );

  }


  function showError(message) {

    status.textContent =
      message;

    status.style.display =
      "block";

    hideLoading();

  }


  function hideError() {

    status.style.display =
      "none";

  }


  /* ========================================================
     LANGUE DU SITE
     ======================================================== */

  function detectLanguage() {

    /*
      1 — ?lang=fr
    */

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const queryLang =
        (
          params.get("lang") ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[queryLang]
      ) {

        return queryLang;

      }

    } catch (error) {}


    /*
      2 — Langue du document.
    */

    const htmlLang =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLang]
    ) {

      return htmlLang;

    }


    /*
      3 — Langue du navigateur.
    */

    try {

      const browserLang =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[browserLang]
      ) {

        return browserLang;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     RENDRE UNE PAGE PDF DIRECTEMENT DANS UN CANVAS HD
     ======================================================== */

  let renderGeneration = 0;

  const renderedPages = new Map();


  function isMobileView() {

    return window.matchMedia("(max-width: 700px)").matches;

  }


  function getRenderTargetWidth() {

    const bookWidth =
      bookElement.clientWidth || 1120;

    const cssPageWidth =
      isMobileView()
        ? bookWidth
        : bookWidth / 2;

    /*
      Environ 3,8 px de rendu par pixel CSS au minimum
      sur un écran courant, avec une limite raisonnable
      pour ne pas exploser la mémoire du navigateur.
    */
    return Math.min(3600, Math.max(1800, Math.ceil(cssPageWidth * Math.min(4.0, window.devicePixelRatio * 2.4 + 1.8))));

  }


  async function renderPage(index, generation) {

    if (!pdf || generation !== renderGeneration) {
      return false;
    }

    const pageElement =
      document.querySelector(
        '#book .pdf-page[data-page-index="' + index + '"]'
      );

    if (!pageElement) {
      return false;
    }

    const canvas =
      pageElement.querySelector('canvas');

    if (!canvas) {
      return false;
    }

    if (renderedPages.get(index) === generation) {
      return true;
    }

    const page =
      await pdf.getPage(index + 1);

    if (generation !== renderGeneration) {
      return false;
    }

    const baseViewport =
      page.getViewport({ scale: 1 });

    const targetWidth =
      getRenderTargetWidth();

    const scale =
      targetWidth / baseViewport.width;

    const viewport =
      page.getViewport({ scale: scale });

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    const context =
      canvas.getContext('2d', { alpha: false });

    context.save();
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.restore();

    await page.render({
      canvasContext: context,
      viewport: viewport,
      intent: 'display',
      renderInteractiveForms: true
    }).promise;

    if (generation !== renderGeneration) {
      return false;
    }

    renderedPages.set(index, generation);

    return true;

  }


  async function renderPages(indices, generation) {

    const unique =
      Array.from(new Set(indices))
        .filter(function (index) {
          return index >= 0 && pdf && index < pdf.numPages;
        });

    for (const index of unique) {

      if (generation !== renderGeneration) {
        return;
      }

      await renderPage(index, generation);

    }

  }


  function clearRenderedPages() {

    renderedPages.clear();

  }

  /* ========================================================
     CRÉER LA LISEUSE EN MODE HTML
     ======================================================== */

  function createBook() {

    bookElement.innerHTML = '';
    clearRenderedPages();

    const pageElements = [];

    for (
      let index = 0;
      index < pdf.numPages;
      index++
    ) {

      const page =
        document.createElement('div');

      page.className = 'pdf-page';
      page.dataset.pageIndex = String(index);
      page.setAttribute('data-density', 'soft');

      if (index === 0 || index === pdf.numPages - 1) {
        page.setAttribute('data-density', 'hard');
      }

      const canvas =
        document.createElement('canvas');

      canvas.setAttribute('aria-hidden', 'true');

      page.appendChild(canvas);
      bookElement.appendChild(page);
      pageElements.push(page);

    }

    pageFlip =
      new St.PageFlip(
        bookElement,
        {
          width: 760,
          height: 1075,
          size: 'stretch',
          minWidth: 250,
          maxWidth: 1800,
          minHeight: 350,
          maxHeight: 2550,
          flippingTime: 950,
          showCover: true,
          drawShadow: true,
          maxShadowOpacity: .78,
          showPageCorners: true,
          useMouseEvents: true,
          swipeDistance: 25,
          clickEventForward: false,
          mobileScrollSupport: true,
          usePortrait: isMobileView(),
          startPage: 0,
          startZIndex: 20,
          autoSize: false
        }
      );

    pageFlip.loadFromHTML(pageElements);
    pageFlip.turnToPage(0);

    requestAnimationFrame(function () {
      updateCounter();
    });

  }

  /* ========================================================
     COMPTEUR
     ======================================================== */

  function updateCounter() {

    if (
      !pageFlip ||
      !pdf
    ) {

      return;

    }


    const index =
      pageFlip.getCurrentPageIndex();


    const total =
      pdf.numPages;


    /*
      Première couverture.
    */

    if (
      index === 0
    ) {

      pageNumber.textContent =
        "1 / " +
        total;

    }

    /*
      Dernière couverture.
    */

    else if (
      index === total - 1
    ) {

      pageNumber.textContent =
        total +
        " / " +
        total;

    }

    /*
      Pages intérieures.
    */

    else {

      const first =
        index + 1;


      const second =
        Math.min(
          index + 2,
          total
        );


      /*
        En double page on affiche
        "2–3 / 44", "4–5 / 44", etc.
      */

      pageNumber.textContent =
        first +
        "–" +
        second +
        " / " +
        total;

    }


    firstButton.disabled =
      index <= 0;

    prevButton.disabled =
      index <= 0;

    nextButton.disabled =
      index >= total - 1;

    lastButton.disabled =
      index >= total - 1;

  }


  /* ========================================================
     ÉVÉNEMENTS PAGEFLIP
     ======================================================== */

  function hidePagesUnderCover() {

    bookElement.classList.add('cover-flip-hiding');

  }


  function showPagesUnderCover() {

    bookElement.classList.remove('cover-flip-hiding');

  }


  function preloadAround(index) {

    const generation = renderGeneration;

    const total = pdf ? pdf.numPages : 0;

    if (!total) {
      return;
    }

    const indices = [index - 2, index - 1, index, index + 1, index + 2];

    if (index <= 1) {
      indices.push(0, 1, 2);
    }

    if (index >= total - 2) {
      indices.push(total - 3, total - 2, total - 1);
    }

    renderPages(indices, generation);

  }


  /* Navigation robustesse : une commande demandée pendant une
     animation est mémorisée et exécutée dès que PageFlip redevient
     disponible. La dernière commande gagne, ce qui évite tout blocage. */
  let pendingNavigation = null;

  function pageFlipIsFlipping() {
    if (!pageFlip || typeof pageFlip.getState !== "function") return false;
    try {
      return String(pageFlip.getState()) === "flipping";
    } catch (error) {
      return false;
    }
  }

  function runOrQueueNavigation(command) {
    if (!pageFlip) return;

    if (pageFlipIsFlipping()) {
      pendingNavigation = command;
      return;
    }

    pendingNavigation = null;
    try {
      command();
    } catch (error) {
      console.warn("Navigation PageFlip :", error);
    }
  }

  function flushPendingNavigation() {
    if (!pageFlip || !pendingNavigation || pageFlipIsFlipping()) return;

    const command = pendingNavigation;
    pendingNavigation = null;

    requestAnimationFrame(function () {
      if (!pageFlip) return;
      try {
        command();
      } catch (error) {
        console.warn("Navigation PageFlip :", error);
      }
    });
  }

  function attachPageFlipEvents() {

    if (!pageFlip) {
      return;
    }

    pageFlip.on(
      'flip',
      function () {

        showPagesUnderCover();
        updateCounter();
        preloadAround(pageFlip.getCurrentPageIndex());

      }
    );

    pageFlip.on(
      'changeState',
      function (event) {

        const state =
          event && event.data
            ? String(event.data)
            : '';

        const index =
          pageFlip.getCurrentPageIndex();

        const total =
          pdf ? pdf.numPages : 0;

        const nearFrontCover =
          index <= 1;

        const nearBackCover =
          total > 0 && index >= total - 2;

        if (state === 'flipping' && (nearFrontCover || nearBackCover)) {
          hidePagesUnderCover();
        }

        if (state === 'read') {
          showPagesUnderCover();
          updateCounter();
          flushPendingNavigation();
          return;
        }

        updateCounter();

      }
    );

    pageFlip.on(
      'changeOrientation',
      function () {

        updateCounter();

        preloadAround(pageFlip.getCurrentPageIndex());

      }
    );

  }

  /* ========================================================
     CHARGER UN CATALOGUE
     ======================================================== */

  async function loadCatalogue(
    language
  ) {

    if (!catalogues[language]) {
      language = "fr";
    }

    /*
      Chaque clic crée une nouvelle requête logique.
      La précédente peut donc être abandonnée proprement sans
      empêcher le changement de langue pendant un chargement.
    */
    const requestId = ++loadRequestId;
    activeLoadRequestId = requestId;
    pendingNavigation = null;

    activeLanguage = language;
    document.documentElement.dataset.catalogueReady = "false";
    setActiveLanguage(language);
    try { localStorage.setItem("mondoprod-catalogue-lang", language); } catch (error) {}
    hideError();
    showLoading("Chargement du catalogue…");

    try {

      if (pageFlip) {
        try { pageFlip.destroy(); } catch (error) {}
        pageFlip = null;
      }

      /* Vider immédiatement l'ancien livre pour éviter qu'un clic
         sur une autre langue semble ne rien faire. */
      bookElement.innerHTML = "";
      pdf = null;
      clearRenderedPages();

      /*
        IMPORTANT : on charge directement l'URL GitHub Pages avec PDF.js.
        On évite fetch()+arrayBuffer() et le paramètre ?v=... qui peuvent
        provoquer des problèmes de cache/CORS selon l'hébergement du site.
      */
      const pdfUrl = catalogues[language];

      const loadingTask = pdfjsLib.getDocument({
        url: pdfUrl,
        disableAutoFetch: false,
        disableStream: false,
        disableRange: false,
        cMapPacked: true
      });

      const loadedPdf = await loadingTask.promise;

      if (requestId !== activeLoadRequestId) {
        try { await loadedPdf.destroy(); } catch (error) {}
        return;
      }

      if (requestId !== activeLoadRequestId) {
        try { loadedPdf.destroy(); } catch (error) {}
        return;
      }

      pdf = loadedPdf;
      renderGeneration++;
      clearRenderedPages();
      const generation = renderGeneration;

      createBook();
      attachPageFlipEvents();
      if (pageFlip) {
        pageFlip.update();
        pageFlip.turnToPage(0);
      }
      updateCounter();

      showLoading("Rendu haute définition…");

      await renderPages([0, 1, 2], generation);

      if (requestId !== activeLoadRequestId) return;

      hideLoading();
      document.documentElement.dataset.catalogueReady = "true";
      document.documentElement.dataset.catalogueLanguage = activeLanguage;
      updateCounter();
      preloadAround(pageFlip ? pageFlip.getCurrentPageIndex() : 0);

    } catch (error) {

      if (requestId !== activeLoadRequestId) return;

      renderGeneration++;

      console.error("Erreur catalogue :", error);

      showError(
        "Impossible de charger le catalogue : " +
        (error && error.message ? error.message : "erreur inconnue")
      );

    }
  }

  /* ========================================================
     DRAPEAUX
     ======================================================== */

  languageButtons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function (event) {

          event.preventDefault();
          event.stopPropagation();

          const requestedLanguage = button.dataset.lang;

          if (!catalogues[requestedLanguage]) {
            return;
          }

          if (requestedLanguage === activeLanguage && pdf) {
            return;
          }

          loadCatalogue(requestedLanguage);

        }
      );

    }
  );


  /* ========================================================
     FLÈCHES
     ======================================================== */

  firstButton.addEventListener(
    "click",
    function () {
      runOrQueueNavigation(function () {
        if (!pageFlip) return;
        pageFlip.turnToPage(0);
      });
    }
  );


  lastButton.addEventListener(
    "click",
    function () {
      runOrQueueNavigation(function () {
        if (!pageFlip || !pdf) return;
        pageFlip.turnToPage(Math.max(0, pdf.numPages - 1));
      });
    }
  );


  prevButton.addEventListener(
    "click",
    function () {
      runOrQueueNavigation(function () {
        if (!pageFlip) return;
        preloadAround(Math.max(0, pageFlip.getCurrentPageIndex() - 2));
        pageFlip.flipPrev("bottom");
      });
    }
  );


  nextButton.addEventListener(
    "click",
    function () {
      runOrQueueNavigation(function () {
        if (!pageFlip) return;
        preloadAround(Math.min((pdf ? pdf.numPages - 1 : 0), pageFlip.getCurrentPageIndex() + 2));
        pageFlip.flipNext("bottom");
      });
    }
  );


  /* ========================================================
     ZOOM
     ======================================================== */

  let readerScale = 1;


  zoomInButton.addEventListener(
    "click",
    function () {

      readerScale =
        Math.min(
          1.14,
          readerScale + .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      bookElement.style.transformOrigin =
        "center center";

    }
  );


  zoomOutButton.addEventListener(
    "click",
    function () {

      readerScale =
        Math.max(
          .90,
          readerScale - .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      bookElement.style.transformOrigin =
        "center center";

    }
  );


  /* ========================================================
     PLEIN ÉCRAN
     ======================================================== */

  fullscreenButton.addEventListener(
    "click",
    async function () {

      try {

        if (
          !document.fullscreenElement
        ) {

          await document
            .getElementById(
              "catalogue-reader"
            )
            .requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(
          "Fullscreen:",
          error
        );

      }

    }
  );


  /* ========================================================
     CLAVIER
     ======================================================== */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        !pageFlip
      ) {

        return;

      }


      if (
        event.key === "ArrowRight"
      ) {

        preloadAround(Math.min((pdf ? pdf.numPages - 1 : 0), pageFlip.getCurrentPageIndex() + 2));
        pageFlip.flipNext(
          "bottom"
        );

      }


      if (
        event.key === "ArrowLeft"
      ) {

        preloadAround(Math.max(0, pageFlip.getCurrentPageIndex() - 2));
        pageFlip.flipPrev(
          "bottom"
        );

      }

    }
  );


  /* ========================================================
     REDIMENSIONNEMENT
     ======================================================== */

  let resizeTimer = null;

  window.addEventListener('resize', function () {

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(function () {

      clearRenderedPages();

      if (pageFlip && pdf) {
        pageFlip.update();
        preloadAround(pageFlip.getCurrentPageIndex());
      }

    }, 180);

  });


  /* ========================================================
     DÉMARRAGE
     ======================================================== */

  loadCatalogue(
    detectLanguage()
  );

})();

</script>

</body>
</html>
