<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  #catalogue-reader {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0;
    text-align: center;
  }

  /* =========================================================
     LANGUES
     ========================================================= */

  #catalogue-languages {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 0 18px;
  }

  .lang-btn {
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 2px;
    margin: 0;
    font-size: 40px;
    line-height: 1;
    cursor: pointer;
    opacity: .40;
    transform: scale(1);
    transition:
      opacity .20s ease,
      transform .20s ease;
  }

  .lang-btn:hover {
    opacity: .88;
    transform: scale(1.08);
  }

  .lang-btn.active {
    opacity: 1;
    transform: scale(1.14);
  }

  /* =========================================================
     ZONE LIVRE
     ========================================================= */

  #book-area {
    position: relative;
    width: 100%;
    padding: 0 58px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /*
    Le livre garde toujours la même boîte géométrique.
    PageFlip gère le passage :
      couverture = 1 page centrée
      intérieur  = 2 pages
      dernière couverture = 1 page centrée
  */

  #book {
    position: relative;
    width: min(1120px, 100%);
    aspect-ratio: 1.41421356 / 1;
    margin: 0 auto;
    transform: translateZ(0);
    overflow: visible;
  }

  #book canvas {
    display: block;
  }

  /* Évite une bordure ajoutée par le thème du site */
  #book,
  #book * {
    border: 0;
  }

  /* =========================================================
     FLÈCHES
     ========================================================= */

  .book-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;

    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.54);
    color: #fff;

    font-size: 36px;
    line-height: 1;

    cursor: pointer;

    transition:
      background .18s ease,
      transform .18s ease,
      opacity .18s ease;
  }

  .book-arrow:hover:not(:disabled) {
    background: rgba(0,0,0,.78);
    transform: translateY(-50%) scale(1.05);
  }

  .book-arrow:disabled {
    opacity: .18;
    cursor: default;
  }

  #prev-page {
    left: 3px;
  }

  #next-page {
    right: 3px;
  }

  /* =========================================================
     CHARGEMENT
     ========================================================= */

  #loading {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 90;

    pointer-events: none;

    font-size: 14px;
    color: rgba(0,0,0,.55);

    opacity: 1;
    transition: opacity .25s ease;
  }

  #loading.hidden {
    opacity: 0;
  }

  #status {
    display: none;

    max-width: 92%;
    margin: 16px auto;

    color: #666;
    font-size: 14px;
    line-height: 1.45;
  }

  /* =========================================================
     CONTRÔLES
     ========================================================= */

  #reader-controls {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 8px;

    margin: 14px 0 0;
  }

  #reader-controls button {
    appearance: none;
    border: 0;
    outline: 0;

    background: transparent;

    padding: 6px 9px;

    font-size: 22px;

    cursor: pointer;

    border-radius: 8px;

    transition:
      background .18s ease,
      transform .18s ease;
  }

  #reader-controls button:hover {
    background: rgba(0,0,0,.06);
  }

  #page-number {
    min-width: 100px;

    font-size: 14px;

    font-variant-numeric: tabular-nums;

    text-align: center;
  }

  /* =========================================================
     PLEIN ÉCRAN
     ========================================================= */

  #catalogue-reader:fullscreen {
    width: 100vw;
    max-width: none;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;

    background: #fff;
  }

  #catalogue-reader:fullscreen #book-area {
    flex: 0 0 auto;
  }

  /* =========================================================
     MOBILE
     ========================================================= */

  @media (max-width: 700px) {

    #catalogue-languages {
      gap: 9px;
      margin-bottom: 13px;
    }

    .lang-btn {
      font-size: 34px;
    }

    #book-area {
      padding: 0 40px;
    }

    /*
      En mobile PageFlip passe en portrait :
      une page à la fois, y compris les couvertures.
    */
    #book {
      width: min(92vw, 470px);
      aspect-ratio: 1 / 1.41421356;
      max-width: 470px;
    }

    .book-arrow {
      width: 43px;
      height: 43px;
      font-size: 29px;
    }

    #prev-page {
      left: 1px;
    }

    #next-page {
      right: 1px;
    }

    #reader-controls {
      margin-top: 11px;
    }
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <div id="catalogue-languages" aria-label="Choisir la langue du catalogue">

    <button
      class="lang-btn"
      data-lang="fr"
      type="button"
      aria-label="Français">
      🇫🇷
    </button>

    <button
      class="lang-btn"
      data-lang="en"
      type="button"
      aria-label="English">
      🇬🇧
    </button>

    <button
      class="lang-btn"
      data-lang="it"
      type="button"
      aria-label="Italiano">
      🇮🇹
    </button>

    <button
      class="lang-btn"
      data-lang="es"
      type="button"
      aria-label="Español">
      🇪🇸
    </button>

  </div>


  <div id="book-area">

    <button
      id="prev-page"
      class="book-arrow"
      type="button"
      aria-label="Page précédente">
      ‹
    </button>


    <div id="book"></div>


    <button
      id="next-page"
      class="book-arrow"
      type="button"
      aria-label="Page suivante">
      ›
    </button>


    <div id="loading">
      Chargement du catalogue…
    </div>

  </div>


  <div id="reader-controls">

    <button
      id="zoom-out"
      type="button"
      aria-label="Réduire le zoom">
      −
    </button>

    <span id="page-number">
      1 / 1
    </span>

    <button
      id="zoom-in"
      type="button"
      aria-label="Augmenter le zoom">
      +
    </button>

    <button
      id="fullscreen"
      type="button"
      aria-label="Plein écran">
      ⛶
    </button>

  </div>


  <div id="status"></div>

</div>


<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- =========================================================
     STPAGEFLIP
     ========================================================= -->

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>

(function () {

  "use strict";


  /* ========================================================
     PDF.JS
     ======================================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ========================================================
     URLS EXACTES GITHUB PAGES
     ======================================================== */

  const catalogues = {

    fr:
      "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",

    en:
      "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",

    it:
      "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",

    es:
      "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"

  };


  /* ========================================================
     ÉLÉMENTS
     ======================================================== */

  const bookElement =
    document.getElementById("book");

  const loading =
    document.getElementById("loading");

  const status =
    document.getElementById("status");

  const pageNumber =
    document.getElementById("page-number");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const zoomInButton =
    document.getElementById("zoom-in");

  const zoomOutButton =
    document.getElementById("zoom-out");

  const fullscreenButton =
    document.getElementById("fullscreen");

  const languageButtons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );


  /* ========================================================
     ÉTAT
     ======================================================== */

  let pageFlip = null;

  let pdf = null;

  let activeLanguage = "fr";

  let objectUrls = [];

  let loadingCatalogue = false;

  let zoom = 1;


  /* ========================================================
     AFFICHAGE
     ======================================================== */

  function showError(message) {

    status.textContent =
      message;

    status.style.display =
      "block";

    loading.classList.add(
      "hidden"
    );

  }


  function hideError() {

    status.style.display =
      "none";

  }


  function showLoading(message) {

    loading.textContent =
      message || "Chargement du catalogue…";

    loading.classList.remove(
      "hidden"
    );

  }


  function hideLoading() {

    loading.classList.add(
      "hidden"
    );

  }


  /* ========================================================
     LANGUE
     ======================================================== */

  function setActiveLanguage(
    language
  ) {

    languageButtons.forEach(
      function (button) {

        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );

      }
    );

  }


  function detectLanguage() {

    /*
      1. ?lang=fr
    */

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const lang =
        (
          params.get("lang") ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[lang]
      ) {

        return lang;

      }

    } catch (error) {}


    /*
      2. Langue envoyée explicitement
         par la page parent si elle en définit une.
    */

    try {

      if (
        window.SITE_LANGUAGE &&
        catalogues[
          String(
            window.SITE_LANGUAGE
          ).toLowerCase()
        ]
      ) {

        return String(
          window.SITE_LANGUAGE
        ).toLowerCase();

      }

    } catch (error) {}


    /*
      3. Langue HTML
    */

    const htmlLang =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLang]
    ) {

      return htmlLang;

    }


    /*
      4. Referrer
    */

    try {

      const ref =
        (
          document.referrer ||
          ""
        ).toLowerCase();


      const match =
        ref.match(
          /(?:^|[\/?&_=.-])(fr|en|it|es)(?:[\/?&_=.-]|$)/
        );


      if (
        match &&
        catalogues[match[1]]
      ) {

        return match[1];

      }

    } catch (error) {}


    /*
      5. Navigateur
    */

    try {

      const browser =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[browser]
      ) {

        return browser;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     PRÉPARER UNE IMAGE DE PAGE
     ======================================================== */

  async function renderPdfPageToImage(
    pageNumber
  ) {

    const page =
      await pdf.getPage(
        pageNumber
      );


    const base =
      page.getViewport({
        scale: 1
      });


    /*
      Résolution assez élevée pour un affichage
      net sur desktop et Retina.
    */

    const targetWidth =
      1200;


    const scale =
      targetWidth /
      base.width;


    const viewport =
      page.getViewport({
        scale: scale
      });


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      Math.ceil(
        viewport.width
      );

    canvas.height =
      Math.ceil(
        viewport.height
      );


    const context =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    context.fillStyle =
      "#fff";


    context.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    await page.render({

      canvasContext:
        context,

      viewport:
        viewport,

      intent:
        "display"

    }).promise;


    /*
      WebP presque sans perte.
      Cela évite les gros JPEG flous pendant
      l'animation 3D.
    */

    const blob =
      await new Promise(
        function (resolve) {

          canvas.toBlob(
            resolve,
            "image/webp",
            .98
          );

        }
      );


    if (!blob) {

      throw new Error(
        "Impossible de convertir la page " +
        pageNumber
      );

    }


    const url =
      URL.createObjectURL(
        blob
      );


    objectUrls.push(
      url
    );


    return url;

  }


  /* ========================================================
     NETTOYAGE
     ======================================================== */

  function destroyBook() {

    if (
      pageFlip
    ) {

      try {

        pageFlip.destroy();

      } catch (error) {

        console.warn(
          "PageFlip destroy:",
          error
        );

      }

    }


    pageFlip = null;


    objectUrls.forEach(
      function (url) {

        try {

          URL.revokeObjectURL(
            url
          );

        } catch (error) {}

      }
    );


    objectUrls = [];


    bookElement.innerHTML =
      "";

  }


  /* ========================================================
     CALCUL DU COMPTEUR
     ======================================================== */

  function updateCounter() {

    if (
      !pageFlip ||
      !pdf
    ) {

      return;

    }


    const currentIndex =
      pageFlip.getCurrentPageIndex();


    const total =
      pdf.numPages;


    /*
      Avec showCover :
        1re page = couverture seule
        pages intérieures = double page
        dernière page = couverture seule
    */

    if (
      currentIndex === 0
    ) {

      pageNumber.textContent =
        "1 / " +
        total;

    } else if (
      currentIndex === total - 1
    ) {

      pageNumber.textContent =
        total +
        " / " +
        total;

    } else {

      const left =
        currentIndex % 2 === 0
          ? currentIndex + 1
          : currentIndex;

      const right =
        Math.min(
          left + 1,
          total
        );


      pageNumber.textContent =
        left +
        "–" +
        right +
        " / " +
        total;

    }


    prevButton.disabled =
      currentIndex <= 0;


    nextButton.disabled =
      currentIndex >= total - 1;

  }


  /* ========================================================
     CRÉER LA LISEUSE
     ======================================================== */

  function createBook(
    images
  ) {

    const width =
      760;

    const height =
      1075;


    /*
      PARAMÈTRES CLÉS :

      showCover: true
      ----------------
      La première et la dernière page
      sont traitées comme des couvertures.
      Elles sont donc seules et centrées.

      usePortrait:
      ----------------
      Sur petit écran : portrait.
      Sur grand écran : double page intérieure.

      size: stretch
      ----------------
      Le livre garde sa place et ses dimensions
      pendant toute l'animation.
    */

    pageFlip =
      new St.PageFlip(
        bookElement,
        {

          width:
            width,

          height:
            height,

          size:
            "stretch",

          minWidth:
            260,

          maxWidth:
            1800,

          minHeight:
            370,

          maxHeight:
            2550,

          /*
            Vraie animation de livre.
          */

          flippingTime:
            950,

          /*
            Première et dernière pages
            = couvertures seules.
          */

          showCover:
            true,

          /*
            Ombres réalistes.
          */

          drawShadow:
            true,

          maxShadowOpacity:
            .78,

          /*
            Coins manipulables.
          */

          showPageCorners:
            true,

          /*
            Le flip peut être effectué
            avec souris/tactile.
          */

          useMouseEvents:
            true,

          swipeDistance:
            25,

          clickEventForward:
            false,

          mobileScrollSupport:
            true,

          /*
            Le livre change automatiquement
            en affichage portrait sur mobile.
          */

          usePortrait:
            true,

          startPage:
            0,

          startZIndex:
            20,

          autoSize:
            false

        }
      );


    /*
      IMPORTANT :

      loadFromImages + showCover:true.

      PageFlip gère lui-même :
        couverture seule
        -> double page
        -> couverture seule

      pendant le même flip.
    */

    pageFlip.loadFromImages(
      images
    );


    /*
      On commence toujours sur la couverture.
    */

    pageFlip.turnToPage(
      0
    );


    /*
      Compteur.
    */

    updateCounter();

  }


  /* ========================================================
     ÉVÉNEMENTS PAGEFLIP
     ======================================================== */

  function attachEvents() {

    if (
      !pageFlip
    ) {

      return;

    }


    pageFlip.on(
      "flip",
      function () {

        updateCounter();

      }
    );


    pageFlip.on(
      "changeOrientation",
      function () {

        updateCounter();

      }
    );

  }


  /* ========================================================
     CHARGER UN CATALOGUE
     ======================================================== */

  async function loadCatalogue(
    language
  ) {

    if (
      loadingCatalogue
    ) {

      return;

    }


    if (
      !catalogues[language]
    ) {

      language =
        "fr";

    }


    loadingCatalogue =
      true;


    activeLanguage =
      language;


    setActiveLanguage(
      language
    );


    hideError();


    showLoading();


    try {

      destroyBook();


      /*
        URL ABSOLUE EXACTE.
      */

      const response =
        await fetch(
          catalogues[language],
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          catalogues[language]
        );

      }


      const pdfData =
        await response.arrayBuffer();


      pdf =
        await pdfjsLib
          .getDocument({
            data: pdfData
          })
          .promise;


      /*
        Préparation des pages.
      */

      const images =
        [];


      for (
        let page = 1;
        page <= pdf.numPages;
        page++
      ) {

        showLoading(
          "Préparation du catalogue " +
          page +
          " / " +
          pdf.numPages +
          "…"
        );


        images.push(
          await renderPdfPageToImage(
            page
          )
        );

      }


      /*
        Création du véritable livre.
      */

      createBook(
        images
      );


      /*
        Événements.
      */

      attachEvents();


      hideLoading();


    } catch (error) {

      console.error(
        "Erreur liseuse :",
        error
      );


      showError(
        "Impossible de charger le catalogue : " +
        (
          error &&
          error.message
            ? error.message
            : "erreur inconnue"
        )
      );


    } finally {

      loadingCatalogue =
        false;

    }

  }


  /* ========================================================
     NAVIGATION
     ======================================================== */

  prevButton.addEventListener(
    "click",
    function () {

      if (
        pageFlip
      ) {

        pageFlip.flipPrev(
          "bottom"
        );

      }

    }
  );


  nextButton.addEventListener(
    "click",
    function () {

      if (
        pageFlip
      ) {

        pageFlip.flipNext(
          "bottom"
        );

      }

    }
  );


  /* ========================================================
     ZOOM
     ======================================================== */

  zoomInButton.addEventListener(
    "click",
    function () {

      zoom =
        Math.min(
          1.16,
          zoom + .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        zoom +
        ")";

      bookElement.style.transformOrigin =
        "center center";

    }
  );


  zoomOutButton.addEventListener(
    "click",
    function () {

      zoom =
        Math.max(
          .90,
          zoom - .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        zoom +
        ")";

      bookElement.style.transformOrigin =
        "center center";

    }
  );


  /* ========================================================
     PLEIN ÉCRAN
     ======================================================== */

  fullscreenButton.addEventListener(
    "click",
    async function () {

      try {

        if (
          !document.fullscreenElement
        ) {

          await document
            .getElementById(
              "catalogue-reader"
            )
            .requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(
          "Fullscreen:",
          error
        );

      }

    }
  );


  /* ========================================================
     CLAVIER
     ======================================================== */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        !pageFlip
      ) {

        return;

      }


      if (
        event.key ===
        "ArrowRight"
      ) {

        pageFlip.flipNext(
          "bottom"
        );

      }


      if (
        event.key ===
        "ArrowLeft"
      ) {

        pageFlip.flipPrev(
          "bottom"
        );

      }

    }
  );


  /* ========================================================
     DRAPEAUX
     ======================================================== */

  languageButtons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {

          const language =
            button.dataset.lang;


          if (
            language ===
            activeLanguage
          ) {

            return;

          }


          loadCatalogue(
            language
          );

        }
      );

    }
  );


  /* ========================================================
     SWIPE
     ======================================================== */

  let touchStartX = 0;
  let touchStartY = 0;


  bookElement.addEventListener(
    "touchstart",
    function (event) {

      const touch =
        event.changedTouches[0];

      touchStartX =
        touch.screenX;

      touchStartY =
        touch.screenY;

    },
    {
      passive: true
    }
  );


  bookElement.addEventListener(
    "touchend",
    function (event) {

      if (
        !pageFlip
      ) {

        return;

      }


      const touch =
        event.changedTouches[0];

      const dx =
        touchStartX -
        touch.screenX;

      const dy =
        touchStartY -
        touch.screenY;


      if (
        Math.abs(dx) < 45 ||
        Math.abs(dx) < Math.abs(dy)
      ) {

        return;

      }


      if (
        dx > 0
      ) {

        pageFlip.flipNext(
          "bottom"
        );

      } else {

        pageFlip.flipPrev(
          "bottom"
        );

      }

    },
    {
      passive: true
    }
  );


  /* ========================================================
     LANGUE AUTOMATIQUE + DÉMARRAGE
     ======================================================== */

  loadCatalogue(
    detectLanguage()
  );

})();
