<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue</title>

<style>
  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  #catalogue-reader {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    text-align: center;
  }

  /* =========================
     LANGUES
     ========================= */

  #catalogue-languages {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 0 18px;
  }

  .lang-btn {
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 2px;
    margin: 0;
    font-size: 40px;
    line-height: 1;
    cursor: pointer;
    opacity: .40;
    transform: scale(1);
    transition: opacity .2s ease, transform .2s ease;
  }

  .lang-btn:hover {
    opacity: .88;
    transform: scale(1.08);
  }

  .lang-btn.active {
    opacity: 1;
    transform: scale(1.14);
  }

  /* =========================
     LIVRE
     ========================= */

  #book-area {
    position: relative;
    width: 100%;
    padding: 0 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #book-stage {
    position: relative;
    width: min(1120px, 100%);
    max-width: 1120px;
    aspect-ratio: 1.41421356 / 1;
    margin: 0 auto;
    background: transparent !important;
    perspective: 2500px;
    transform-style: preserve-3d;
  }

  #inner-book {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent !important;
    z-index: 10;
  }

  #inner-book.hidden {
    display: none !important;
  }

  .pdf-page {
    position: relative;
    overflow: hidden;
    background: #fff;
    margin: 0;
    padding: 0;
  }

  .pdf-page canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
  }

  /* =========================
     APERÇU PENDANT COUVERTURES
     ========================= */

  #interior-preview {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    pointer-events: none;
    background: transparent;
  }

  #interior-preview.opening {
    display: flex;
  }

  #preview-left,
  #preview-right {
    position: relative;
    width: 50%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  @media (max-width: 700px) {
    #preview-left {
      display: none;
    }

    #preview-right {
      width: 100%;
    }
  }

  #preview-left img,
  #preview-right img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
  }

  /* =========================
     COUVERTURES
     ========================= */

  #cover-layer {
    position: absolute;
    inset: 0;
    z-index: 70;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    background: transparent !important;
  }

  #cover-layer.hidden {
    display: none !important;
  }

  .cover-page {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    max-width: 560px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 20px 48px rgba(0,0,0,.24), 0 1px 3px rgba(0,0,0,.12);
    transform-style: preserve-3d;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    will-change: transform;
  }

  .cover-page img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    user-select: none;
    -webkit-user-drag: none;
  }

  #front-cover {
    left: 50%;
    transform: translateX(-50%) rotateY(0deg);
    transform-origin: left center;
  }

  #back-cover {
    left: 50%;
    transform: translateX(-50%) rotateY(0deg);
    transform-origin: right center;
    display: none;
  }

  /* =========================
     FLÈCHES
     ========================= */

  .book-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 150;

    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.54);
    color: #fff;

    font-size: 36px;
    line-height: 1;

    cursor: pointer;

    transition: background .18s ease, transform .18s ease, opacity .18s ease;
  }

  .book-arrow:hover:not(:disabled) {
    background: rgba(0,0,0,.78);
    transform: translateY(-50%) scale(1.05);
  }

  .book-arrow:disabled {
    opacity: .18;
    cursor: default;
  }

  #first-page { left: 2px; }
  #prev-page  { left: 62px; }
  #next-page  { right: 62px; }
  #last-page  { right: 2px; }

  /* =========================
     LOADING
     ========================= */

  #loading {
    position: absolute;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    color: rgba(0,0,0,.55);
    font-size: 14px;
    background: transparent;
    transition: opacity .2s ease;
  }

  #loading.hidden {
    opacity: 0;
  }

  #status {
    display: none;
    max-width: 92%;
    margin: 16px auto;
    color: #666;
    font-size: 14px;
    line-height: 1.45;
  }

  /* =========================
     CONTROLES
     ========================= */

  #reader-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }

  #reader-controls button {
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 6px 9px;
    font-size: 22px;
    cursor: pointer;
    border-radius: 8px;
  }

  #reader-controls button:hover {
    background: rgba(0,0,0,.06);
  }

  #page-number {
    min-width: 104px;
    text-align: center;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 700px) {
    #catalogue-languages {
      gap: 9px;
      margin-bottom: 13px;
    }

    .lang-btn {
      font-size: 34px;
    }

    #book-area {
      padding: 0 42px;
    }

    #book-stage {
      width: min(92vw, 470px);
      aspect-ratio: 1 / 1.41421356;
      max-width: 470px;
    }

    .cover-page {
      width: 100%;
      max-width: 470px;
    }

    #front-cover,
    #back-cover {
      left: 0;
      transform: translateX(0) rotateY(0deg);
    }

    #first-page { left: 0; }
    #prev-page  { left: 0; top: calc(50% + 55px); }
    #next-page  { right: 0; top: calc(50% + 55px); }
    #last-page  { right: 0; }

    .book-arrow {
      width: 43px;
      height: 43px;
      font-size: 29px;
    }
  }

  #catalogue-reader:fullscreen {
    width: 100vw;
    max-width: none;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <!-- LANGUES -->
  <div id="catalogue-languages" aria-label="Choisir la langue du catalogue">
    <button class="lang-btn" data-lang="fr" type="button" aria-label="Français">🇫🇷</button>
    <button class="lang-btn" data-lang="en" type="button" aria-label="English">🇬🇧</button>
    <button class="lang-btn" data-lang="it" type="button" aria-label="Italiano">🇮🇹</button>
    <button class="lang-btn" data-lang="es" type="button" aria-label="Español">🇪🇸</button>
  </div>

  <!-- LIVRE -->
  <div id="book-area">

    <button id="first-page" class="book-arrow" type="button" aria-label="Première page">«</button>
    <button id="prev-page" class="book-arrow" type="button" aria-label="Page précédente">‹</button>

    <div id="book-stage">

      <div id="inner-book" class="hidden"></div>

      <!--
        Pendant l'ouverture de la couverture avant :
        page 2 apparaît à droite seulement.
        Le reste reste transparent.
      -->
      <div id="interior-preview">
        <div id="preview-left"></div>
        <div id="preview-right"></div>
      </div>

      <!-- COUVERTURES -->
      <div id="cover-layer" class="hidden">

        <div id="front-cover" class="cover-page">
          <img id="front-cover-img" alt="Couverture du catalogue">
        </div>

        <div id="back-cover" class="cover-page">
          <img id="back-cover-img" alt="Dernière page du catalogue">
        </div>

      </div>

      <div id="loading">Chargement du catalogue…</div>

    </div>

    <button id="next-page" class="book-arrow" type="button" aria-label="Page suivante">›</button>
    <button id="last-page" class="book-arrow" type="button" aria-label="Dernière page">»</button>

  </div>

  <!-- CONTROLES -->
  <div id="reader-controls">
    <button id="zoom-out" type="button" aria-label="Réduire le zoom">−</button>
    <span id="page-number">1 / 1</span>
    <button id="zoom-in" type="button" aria-label="Augmenter le zoom">+</button>
    <button id="fullscreen" type="button" aria-label="Plein écran">⛶</button>
  </div>

  <div id="status"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
(function () {

  "use strict";

  /* ========================================================
     PDF.JS
     ======================================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ========================================================
     URLS EXACTES GITHUB PAGES
     ======================================================== */

  const catalogues = {
    fr: "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",
    en: "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",
    it: "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",
    es: "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"
  };


  /* ========================================================
     ELEMENTS
     ======================================================== */

  const stage =
    document.getElementById("book-stage");

  const innerBook =
    document.getElementById("inner-book");

  const preview =
    document.getElementById("interior-preview");

  const previewLeft =
    document.getElementById("preview-left");

  const previewRight =
    document.getElementById("preview-right");

  const coverLayer =
    document.getElementById("cover-layer");

  const frontCover =
    document.getElementById("front-cover");

  const backCover =
    document.getElementById("back-cover");

  const frontCoverImg =
    document.getElementById("front-cover-img");

  const backCoverImg =
    document.getElementById("back-cover-img");

  const loading =
    document.getElementById("loading");

  const status =
    document.getElementById("status");

  const counter =
    document.getElementById("page-number");

  const firstButton =
    document.getElementById("first-page");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const lastButton =
    document.getElementById("last-page");

  const zoomIn =
    document.getElementById("zoom-in");

  const zoomOut =
    document.getElementById("zoom-out");

  const fullscreen =
    document.getElementById("fullscreen");

  const languageButtons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );


  /* ========================================================
     ETAT
     ======================================================== */

  let pdf =
    null;

  let pageFlip =
    null;

  let activeLanguage =
    "fr";

  let mode =
    "front";

  let busy =
    false;

  let loadingCatalogue =
    false;

  let currentInnerIndex =
    0;

  let pageEntries =
    new Map();

  let readerScale =
    1;

  let currentRenderToken =
    0;


  /* ========================================================
     UTILITAIRES
     ======================================================== */

  function isMobile() {

    return window.matchMedia(
      "(max-width: 700px)"
    ).matches;

  }


  function showLoading(
    text
  ) {

    loading.textContent =
      text ||
      "Chargement du catalogue…";

    loading.classList.remove(
      "hidden"
    );

  }


  function hideLoading() {

    loading.classList.add(
      "hidden"
    );

  }


  function showError(
    message
  ) {

    status.textContent =
      message;

    status.style.display =
      "block";

    hideLoading();

  }


  function hideError() {

    status.style.display =
      "none";

  }


  function setActiveLanguage(
    language
  ) {

    languageButtons.forEach(
      function (button) {

        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );

      }
    );

  }


  /* ========================================================
     LANGUE
     ======================================================== */

  function detectLanguage() {

    try {

      const query =
        new URLSearchParams(
          window.location.search
        )
        .get("lang");


      const queryLang =
        (
          query ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[queryLang]
      ) {

        return queryLang;

      }

    } catch (error) {}


    const htmlLang =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLang]
    ) {

      return htmlLang;

    }


    try {

      const browserLang =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[browserLang]
      ) {

        return browserLang;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     DETRUIRE MOTEUR
     ======================================================== */

  function destroyInnerBook() {

    currentRenderToken += 1;


    if (
      pageFlip
    ) {

      try {

        pageFlip.destroy();

      } catch (error) {}

      pageFlip =
        null;

    }


    innerBook.innerHTML =
      "";


    pageEntries =
      new Map();


    currentInnerIndex =
      0;

  }


  /* ========================================================
     PAGE HTML
     ======================================================== */

  function createPageElement(
    pdfPageNumber
  ) {

    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.className =
      "pdf-page";


    wrapper.dataset.pdfPage =
      String(
        pdfPageNumber
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    wrapper.appendChild(
      canvas
    );


    const entry = {

      pdfPageNumber:
        pdfPageNumber,

      wrapper:
        wrapper,

      canvas:
        canvas,

      rendered:
        false,

      rendering:
        null

    };


    pageEntries.set(
      pdfPageNumber,
      entry
    );


    return wrapper;

  }


  /* ========================================================
     RENDU HD A LA DEMANDE
     ======================================================== */

  async function renderEntry(
    pdfPageNumber
  ) {

    const entry =
      pageEntries.get(
        pdfPageNumber
      );


    if (
      !entry ||
      !pdf
    ) {

      return;

    }


    if (
      entry.rendered
    ) {

      return;

    }


    if (
      entry.rendering
    ) {

      return entry.rendering;

    }


    const token =
      currentRenderToken;


    entry.rendering =
      (async function () {

        const page =
          await pdf.getPage(
            pdfPageNumber
          );


        if (
          token !==
          currentRenderToken
        ) {

          return;

        }


        /*
          Taille réelle de la page dans
          le moteur au moment du rendu.
        */

        const width =
          Math.max(
            300,
            entry.wrapper.clientWidth
          );


        const height =
          Math.max(
            400,
            entry.wrapper.clientHeight
          );


        const base =
          page.getViewport({
            scale: 1
          });


        /*
          Densité élevée, sans conversion JPEG/WebP.
          Le PDF est rendu directement dans un canvas
          haute résolution.
        */

        const dpr =
          Math.min(
            window.devicePixelRatio || 1,
            3
          );


        const fit =
          Math.min(
            width / base.width,
            height / base.height
          );


        const targetWidth =
            Math.min(
              2400,
              Math.max(
                1500,
                Math.round(
                  width * dpr
                )
              )
            );


        const scale =
          Math.min(
            fit * dpr,
            targetWidth /
              base.width
          );


        const viewport =
          page.getViewport({
            scale: scale
          });


        entry.canvas.width =
          Math.ceil(
            viewport.width
          );


        entry.canvas.height =
          Math.ceil(
            viewport.height
          );


        entry.canvas.style.width =
          "100%";

        entry.canvas.style.height =
          "100%";


        const ctx =
          entry.canvas.getContext(
            "2d",
            {
              alpha: false
            }
          );


        ctx.imageSmoothingEnabled =
          true;

        ctx.imageSmoothingQuality =
          "high";

        ctx.fillStyle =
          "#fff";

        ctx.fillRect(
          0,
          0,
          entry.canvas.width,
          entry.canvas.height
        );


        await page.render({

          canvasContext:
            ctx,

          viewport:
            viewport,

          intent:
            "display",

          renderInteractiveForms:
            true

        }).promise;


        if (
          token ===
          currentRenderToken
        ) {

          entry.rendered =
            true;

        }

      })();


    try {

      await entry.rendering;

    } finally {

      entry.rendering =
        null;

    }

  }


  /* ========================================================
     PRECHARGER SEULEMENT CE QUI EST NECESSAIRE
     ======================================================== */

  async function preloadInnerPages(
    innerIndex
  ) {

    if (
      !pdf
    ) {

      return;

    }


    /*
      innerIndex 0 = PDF page 2.
      On prépare 2 pages avant + 4 après.
      Jamais les 42 pages d'un coup.
    */

    const center =
      innerIndex + 2;


    const list = [

      center - 2,
      center - 1,
      center,
      center + 1,
      center + 2,
      center + 3

    ];


    const unique =
      Array.from(
        new Set(
          list.filter(
            function (n) {

              return (
                n >= 2 &&
                n <= pdf.numPages - 1
              );

            }
          )
        )
      );


    for (
      let i = 0;
      i < unique.length;
      i++
    ) {

      await renderEntry(
        unique[i]
      );

    }

  }


  /* ========================================================
     COPIE D'UN CANVAS DANS UN PREVIEW
     ======================================================== */

  function copyCanvasToPreview(
    sourceCanvas,
    container
  ) {

    container.innerHTML =
      "";


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      sourceCanvas.width;

    canvas.height =
      sourceCanvas.height;


    canvas.style.width =
      "100%";

    canvas.style.height =
      "100%";


    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    ctx.drawImage(
      sourceCanvas,
      0,
      0
    );


    container.appendChild(
      canvas
    );

  }


  function updateOpeningPreview() {

    /*
      Lorsque la couverture avant s'ouvre,
      la page 2 apparaît à droite.

      La moitié gauche reste transparente :
      le fond du SITE123 reste donc visible.
    */

    preview.style.display =
      "flex";


    previewLeft.innerHTML =
      "";


    const firstInner =
      pageEntries.get(2);


    if (
      firstInner &&
      firstInner.rendered
    ) {

      copyCanvasToPreview(
        firstInner.canvas,
        previewRight
      );

    } else {

      previewRight.innerHTML =
        "";

    }

  }


  function updateClosingPreview() {

    /*
      Pour la dernière couverture,
      les dernières pages intérieures restent
      visibles du côté où elles existent.
    */

    preview.style.display =
      "flex";


    previewLeft.innerHTML =
      "";

    previewRight.innerHTML =
      "";


    const lastInner =
      pageEntries.get(
        pdf.numPages - 1
      );


    const previousInner =
      pageEntries.get(
        pdf.numPages - 2
      );


    if (
      previousInner &&
      previousInner.rendered
    ) {

      copyCanvasToPreview(
        previousInner.canvas,
        previewLeft
      );

    }


    if (
      lastInner &&
      lastInner.rendered &&
      !isMobile()
    ) {

      copyCanvasToPreview(
        lastInner.canvas,
        previewRight
      );

    }

  }


  /* ========================================================
     COMPTEUR
     ======================================================== */

  function updateCounter() {

    if (
      !pdf
    ) {

      return;

    }


    const total =
      pdf.numPages;


    if (
      mode ===
      "front"
    ) {

      counter.textContent =
        "1 / " +
        total;


      firstButton.disabled =
        true;

      prevButton.disabled =
        true;

      nextButton.disabled =
        false;

      lastButton.disabled =
        false;


      return;

    }


    if (
      mode ===
      "back"
    ) {

      counter.textContent =
        total +
        " / " +
        total;


      firstButton.disabled =
        false;

      prevButton.disabled =
        false;

      nextButton.disabled =
        true;

      lastButton.disabled =
        true;


      return;

    }


    if (
      !pageFlip
    ) {

      return;

    }


    const index =
      pageFlip.getCurrentPageIndex();


    currentInnerIndex =
      index;


    const firstPdf =
      index + 2;


    if (
      pageFlip.getOrientation() ===
      "portrait"
    ) {

      counter.textContent =
        firstPdf +
        " / " +
        total;

    } else {

      const secondPdf =
        Math.min(
          firstPdf + 1,
          total - 1
        );


      counter.textContent =
        firstPdf +
        "–" +
        secondPdf +
        " / " +
        total;

    }


    /*
      Début du contenu intérieur.
    */

    prevButton.disabled =
      index <= 0;


    /*
      Dernier spread intérieur.
    */

    const lastSpread =
      Math.max(
        0,
        (
          total - 2
        ) - 2
      );


    nextButton.disabled =
      index >= lastSpread;


    firstButton.disabled =
      false;


    lastButton.disabled =
      false;

  }


  /* ========================================================
     CREER LE LIVRE INTERIEUR
     ======================================================== */

  function createInnerBook() {

    destroyInnerBook();


    const elements =
      [];


    /*
      Seulement pages 2 -> avant-dernière.
    */

    for (
      let pdfPage = 2;
      pdfPage < pdf.numPages;
      pdfPage++
    ) {

      elements.push(
        createPageElement(
          pdfPage
        )
      );

    }


    pageFlip =
      new St.PageFlip(
        innerBook,
        {

          width:
            760,

          height:

  /* ========================================================
     CHANGEMENT DE LANGUE
     ======================================================== */

  async function loadLanguage(
    language
  ) {

    if (
      loadingCatalogue
    ) {

      return;

    }


    loadingCatalogue =
      true;


    activeLanguage =
      catalogues[language]
        ? language
        : "fr";


    setActiveLanguage(
      activeLanguage
    );


    showLoading(
      "Chargement du catalogue…"
    );


    hideError();


    /*
      On détruit bien l'ancien moteur.
      C'était un des bugs de la version précédente :
      la fonction manquait et bloquait le changement de langue.
    */

    destroyInnerBook();


    pdf =
      null;


    mode =
      "front";


    coverLayer.classList.add(
      "hidden"
    );


    try {

      const response =
        await fetch(
          catalogues[activeLanguage],
          {
            cache:
              "no-store"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          catalogues[activeLanguage]
        );

      }


      const data =
        await response.arrayBuffer();


      pdf =
        await pdfjsLib
          .getDocument({
            data:
              data
          })
          .promise;


      /*
        IMPORTANT :
        On ne rend plus 44 pages.

        On rend uniquement la première et la dernière
        pour que le catalogue soit immédiatement utilisable.
      */

      showLoading(
        "Préparation du catalogue…"
      );


      /*
        Couverture avant.
      */

      const firstPage =
        await pdf.getPage(1);


      const firstBase =
        firstPage.getViewport({
          scale: 1
        });


      const coverScale =
        Math.min(
          2200 / firstBase.width,
          3
        );


      const firstViewport =
        firstPage.getViewport({
          scale:
            coverScale
        });


      const firstCanvas =
        document.createElement(
          "canvas"
        );


      firstCanvas.width =
        Math.round(
          firstViewport.width
        );


      firstCanvas.height =
        Math.round(
          firstViewport.height
        );


      const firstContext =
        firstCanvas.getContext(
          "2d",
          {
            alpha: false
          }
        );


      firstContext.fillStyle =
        "#fff";


      firstContext.fillRect(
        0,
        0,
        firstCanvas.width,
        firstCanvas.height
      );


      await firstPage.render({

        canvasContext:
          firstContext,

        viewport:
          firstViewport,

        intent:
          "display"

      }).promise;


      const firstBlob =
        await new Promise(
          function (resolve) {

            firstCanvas.toBlob(
              resolve,
              "image/png"
            );

          }
        );


      if (!firstBlob) {

        throw new Error(
          "Impossible de préparer la couverture."
        );

      }


      frontCoverImg.src =
        URL.createObjectURL(
          firstBlob
        );


      /*
        Dernière page.
      */

      const lastPage =
        await pdf.getPage(
          pdf.numPages
        );


      const lastBase =
        lastPage.getViewport({
          scale: 1
        });


      const lastScale =
        Math.min(
          2200 / lastBase.width,
          3
        );


      const lastViewport =
        lastPage.getViewport({
          scale:
            lastScale
        });


      const lastCanvas =
        document.createElement(
          "canvas"
        );


      lastCanvas.width =
        Math.round(
          lastViewport.width
        );


      lastCanvas.height =
        Math.round(
          lastViewport.height
        );


      const lastContext =
        lastCanvas.getContext(
          "2d",
          {
            alpha: false
          }
        );


      lastContext.fillStyle =
        "#fff";


      lastContext.fillRect(
        0,
        0,
        lastCanvas.width,
        lastCanvas.height
      );


      await lastPage.render({

        canvasContext:
          lastContext,

        viewport:
          lastViewport,

        intent:
          "display"

      }).promise;


      const lastBlob =
        await new Promise(
          function (resolve) {

            lastCanvas.toBlob(
              resolve,
              "image/png"
            );

          }
        );


      if (!lastBlob) {

        throw new Error(
          "Impossible de préparer la dernière page."
        );

      }


      backCoverImg.src =
        URL.createObjectURL(
          lastBlob
        );


      /*
        Création rapide du moteur intérieur.
        Aucune des pages intérieures n'est encore rendue.
      */

      createInnerBook();


      /*
        Affiche immédiatement la couverture.
      */

      showFrontCover();


      hideLoading();


    } catch (error) {

      console.error(
        "Erreur catalogue :",
        error
      );


      showError(
        "Impossible de charger le catalogue : " +
        (
          error &&
          error.message
            ? error.message
            : "erreur inconnue"
        )
      );

    } finally {

      loadingCatalogue =
        false;

    }

  }

        rightEntry.canvas,
        previewRight

  stage.addEventListener(
    "touchstart",
    function (event) {

      const touch =
        event.changedTouches[0];


      touchStartX =

      touchStartY =
        touch.screenY;

    },
    {
      passive:
        true

  stage.addEventListener(
    "touchend",
    function (event) {

      if (
        busy
      ) {

        return;

      }


      const touch =
        event.changedTouches[0];


      const dx =
        touchStartX -
        touch.screenX;


      const dy =
        touchStartY -
        touch.screenY;


      if (
        Math.abs(dx) < 45 ||
        Math.abs(dx) < Math.abs(dy)
      ) {

        return;

      }


      if (
        dx > 0
      ) {

        nextButton.click();

      } else {

        prevButton.click();

      }

    },
    {
      passive:
        true
    }

              "back"
            ) {

              backCover.style.width =
                isMobile()
                  ? "100%"
                  : "50%";


              backCover.style.left =
                isMobile()
                  ? "0"
                  : "50%";


              backCover.style.transform =
                isMobile()
                  ? "translateX(0)"
                  : "translateX(-50%)";

            }

          },
          220
        );

    }
  );


  /* ========================================================
     DEMARRAGE
     ======================================================== */

  loadLanguage(
    detectLanguage()
  );

})();
</script>

</body>
</html>
