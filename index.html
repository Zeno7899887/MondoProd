<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  #catalogue-reader {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
    text-align: center;
  }

  /* =========================
     LANGUES
     ========================= */

  #catalogue-languages {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 0 18px;
  }

  .lang-btn {
    appearance: none;
    border: 0;
    outline: none;
    background: transparent;
    padding: 2px;
    margin: 0;
    font-size: 40px;
    line-height: 1;
    cursor: pointer;
    opacity: .42;
    transform: scale(1);
    transition: opacity .2s ease, transform .2s ease;
  }

  .lang-btn:hover {
    opacity: .9;
    transform: scale(1.08);
  }

  .lang-btn.active {
    opacity: 1;
    transform: scale(1.14);
  }

  /* =========================
     LIVRE
     ========================= */

  #book-area {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 0 58px;
  }

  #book {
    position: relative;
    width: min(1080px, 100%);
    aspect-ratio: 1.414 / 1;
    perspective: 1800px;
  }

  #spread {
    position: absolute;
    inset: 0;
    display: flex;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 18px 48px rgba(0,0,0,.18);
  }

  .page {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  .page canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
  }

  #left-page {
    box-shadow: inset -10px 0 18px -18px rgba(0,0,0,.55);
  }

  #right-page {
    box-shadow: inset 10px 0 18px -18px rgba(0,0,0,.55);
  }

  #seam {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 12px;
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(
      to right,
      rgba(0,0,0,.08),
      rgba(255,255,255,.34),
      rgba(0,0,0,.08),
      transparent
    );
  }

  /* =========================
     PAGE TOURNEE
     ========================= */

  #flip-page {
    display: none;
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    z-index: 20;
    transform-origin: left center;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    pointer-events: none;
  }

  #flip-front,
  #flip-back {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #fff;
    backface-visibility: hidden;
  }

  #flip-back {
    transform: rotateY(180deg);
  }

  #flip-front canvas,
  #flip-back canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
  }

  /* =========================
     FLÈCHES
     ========================= */

  .book-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 50;

    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.55);
    color: #fff;

    font-size: 36px;
    line-height: 1;

    cursor: pointer;

    transition: background .18s ease, transform .18s ease, opacity .18s ease;
  }

  .book-arrow:hover {
    background: rgba(0,0,0,.78);
    transform: translateY(-50%) scale(1.05);
  }

  .book-arrow:disabled {
    opacity: .18;
    cursor: default;
    transform: translateY(-50%);
  }

  #prev-page { left: 4px; }
  #next-page { right: 4px; }

  /* =========================
     CONTROLES
     ========================= */

  #reader-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 14px 0 0;
  }

  #reader-controls button {
    appearance: none;
    border: 0;
    outline: none;
    background: transparent;
    padding: 6px 9px;
    font-size: 22px;
    cursor: pointer;
    border-radius: 8px;
  }

  #reader-controls button:hover {
    background: rgba(0,0,0,.06);
  }

  #page-number {
    min-width: 96px;
    text-align: center;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  #status {
    display: none;
    margin: 18px auto;
    max-width: 92%;
    color: #666;
    font-size: 14px;
    line-height: 1.45;
  }

  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 700px) {
    #catalogue-languages {
      gap: 9px;
      margin-bottom: 13px;
    }

    .lang-btn {
      font-size: 34px;
    }

    #book-area {
      padding: 0 42px;
    }

    #book {
      width: min(92vw, 460px);
      aspect-ratio: 1 / 1.414;
    }

    #spread {
      display: block;
    }

    .page {
      width: 100%;
    }

    #left-page {
      display: none;
    }

    #right-page {
      display: block;
      box-shadow: none;
    }

    #seam {
      display: none;
    }

    #flip-page {
      width: 100%;
    }

    .book-arrow {
      width: 44px;
      height: 44px;
      font-size: 30px;
    }

    #prev-page { left: 2px; }
    #next-page { right: 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #flip-page {
      transition: none !important;
    }
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <div id="catalogue-languages" aria-label="Choisir la langue du catalogue">
    <button class="lang-btn" data-lang="fr" type="button" aria-label="Français">🇫🇷</button>
    <button class="lang-btn" data-lang="en" type="button" aria-label="English">🇬🇧</button>
    <button class="lang-btn" data-lang="it" type="button" aria-label="Italiano">🇮🇹</button>
    <button class="lang-btn" data-lang="es" type="button" aria-label="Español">🇪🇸</button>
  </div>

  <div id="book-area">

    <button id="prev-page" class="book-arrow" type="button" aria-label="Page précédente">‹</button>

    <div id="book">

      <div id="spread">
        <div id="left-page" class="page">
          <canvas id="left-canvas"></canvas>
        </div>

        <div id="right-page" class="page">
          <canvas id="right-canvas"></canvas>
        </div>

        <div id="seam"></div>
      </div>

      <div id="flip-page" aria-hidden="true">
        <div id="flip-front">
          <canvas id="flip-front-canvas"></canvas>
        </div>
        <div id="flip-back">
          <canvas id="flip-back-canvas"></canvas>
        </div>
      </div>

    </div>

    <button id="next-page" class="book-arrow" type="button" aria-label="Page suivante">›</button>

  </div>

  <div id="reader-controls">
    <button id="zoom-out" type="button" aria-label="Réduire le zoom">−</button>
    <span id="page-number">1 / 1</span>
    <button id="zoom-in" type="button" aria-label="Augmenter le zoom">+</button>
    <button id="fullscreen" type="button" aria-label="Plein écran">⛶</button>
  </div>

  <div id="status"></div>

</div>


<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function () {

  "use strict";

  /* ========================================================
     CONFIGURATION PDF
     ======================================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /*
    URLS PUBLIQUES EXACTES DE TON GITHUB PAGES.
    Les PDF sont à la racine du repository.
  */

  const catalogues = {

    fr:
      "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",

    en:
      "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",

    it:
      "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",

    es:
      "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"

  };


  /* ========================================================
     ÉLÉMENTS
     ======================================================== */

  const buttons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );

  const leftCanvas =
    document.getElementById("left-canvas");

  const rightCanvas =
    document.getElementById("right-canvas");

  const flipPage =
    document.getElementById("flip-page");

  const flipFrontCanvas =
    document.getElementById("flip-front-canvas");

  const flipBackCanvas =
    document.getElementById("flip-back-canvas");

  const leftPage =
    document.getElementById("left-page");

  const rightPage =
    document.getElementById("right-page");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const pageNumber =
    document.getElementById("page-number");

  const status =
    document.getElementById("status");

  const reader =
    document.getElementById("catalogue-reader");


  /* ========================================================
     ÉTAT
     ======================================================== */

  let pdf = null;

  let activeLanguage = "fr";

  let current = 1;

  let zoom = 1;

  let busy = false;


  /* ========================================================
     UTILITAIRES
     ======================================================== */

  function isMobile() {

    return window.matchMedia(
      "(max-width: 700px)"
    ).matches;

  }


  function showStatus(message) {

    status.textContent = message;
    status.style.display = "block";

  }


  function hideStatus() {

    status.style.display = "none";

  }


  function setActiveLanguage(language) {

    buttons.forEach(function (button) {

      button.classList.toggle(
        "active",
        button.dataset.lang === language
      );

    });

  }


  function clearCanvas(canvas) {

    const ctx =
      canvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      canvas.width || 1,
      canvas.height || 1
    );

  }


  /*
    Détecte la langue du site parent autant que possible :

    1. ?lang=fr
    2. URL du site parent contenant /fr/, /en/, /it/, /es/
    3. document.referrer
    4. <html lang="...">
    5. navigateur
    6. français par défaut
  */

  function detectLanguage() {

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const queryLanguage =
        (
          params.get("lang") ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (catalogues[queryLanguage]) {

        return queryLanguage;

      }

    } catch (error) {}


    try {

      const ref =
        document.referrer || "";

      const lowerRef =
        ref.toLowerCase();

      const refMatch =
        lowerRef.match(
          /(?:^|[\/?&_=.-])(fr|en|it|es)(?:[\/?&_=.-]|$)/
        );

      if (
        refMatch &&
        catalogues[refMatch[1]]
      ) {

        return refMatch[1];

      }

    } catch (error) {}


    const htmlLanguage =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLanguage]
    ) {

      return htmlLanguage;

    }


    try {

      const browserLanguage =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];

      if (
        catalogues[browserLanguage]
      ) {

        return browserLanguage;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     RENDU PDF
     ======================================================== */

  async function renderPage(
    pageIndex,
    canvas
  ) {

    if (
      !pdf ||
      !pageIndex ||
      pageIndex < 1 ||
      pageIndex > pdf.numPages
    ) {

      clearCanvas(canvas);
      return;

    }


    const page =
      await pdf.getPage(
        pageIndex
      );


    const baseViewport =
      page.getViewport({
        scale: 1
      });


    const container =
      canvas.parentElement;


    const width =
      Math.max(
        1,
        container.clientWidth
      );


    const height =
      Math.max(
        1,
        container.clientHeight
      );


    const fitScale =
      Math.min(
        width / baseViewport.width,
        height / baseViewport.height
      );


    const pixelRatio =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const renderScale =
      Math.max(
        0.1,
        fitScale * zoom * pixelRatio
      );


    const viewport =
      page.getViewport({
        scale: renderScale
      });


    canvas.width =
      Math.ceil(viewport.width);

    canvas.height =
      Math.ceil(viewport.height);


    canvas.style.width =
      "100%";

    canvas.style.height =
      "100%";


    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    ctx.fillStyle = "#fff";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    await page.render({

      canvasContext: ctx,
      viewport: viewport

    }).promise;

  }


  /* ========================================================
     AFFICHAGE DU LIVRE
     ======================================================== */

  function desktopSpread() {

    if (current === 1) {

      return {
        left: null,
        right: 1
      };

    }


    const left =
      current % 2 === 0
        ? current
        : current - 1;


    return {

      left: left,

      right:
        left + 1 <= pdf.numPages
          ? left + 1
          : null

    };

  }


  async function renderBook() {

    if (!pdf) return;


    if (isMobile()) {

      leftPage.style.display =
        "none";

      rightPage.style.display =
        "block";


      await renderPage(
        current,
        rightCanvas
      );


    } else {

      leftPage.style.display =
        "block";

      rightPage.style.display =
        "block";


      const spread =
        desktopSpread();


      if (spread.left) {

        await renderPage(
          spread.left,
          leftCanvas
        );

      } else {

        clearCanvas(leftCanvas);

      }


      if (spread.right) {

        await renderPage(
          spread.right,
          rightCanvas
        );

      } else {

        clearCanvas(rightCanvas);

      }


      current =
        spread.left || 1;

    }


    updateControls();

  }


  function updateControls() {

    if (!pdf) return;


    if (isMobile()) {

      pageNumber.textContent =
        current +
        " / " +
        pdf.numPages;

    } else {

      const spread =
        desktopSpread();


      if (!spread.left) {

        pageNumber.textContent =
          "1 / " +
          pdf.numPages;

      } else {

        pageNumber.textContent =
          spread.left +
          "–" +
          (
            spread.right ||
            spread.left
          ) +
          " / " +
          pdf.numPages;

      }

    }


    prevButton.disabled =
      current <= 1;


    nextButton.disabled =
      current >= pdf.numPages;

  }


  /* ========================================================
     ANIMATION PAGE SUIVANTE
     ======================================================== */

  async function nextPage() {

    if (
      !pdf ||
      busy ||
      current >= pdf.numPages
    ) {

      return;

    }


    busy = true;


    try {

      if (isMobile()) {

        current += 1;

        await renderBook();

        return;

      }


      const spread =
        desktopSpread();


      const oldRight =
        spread.right || current;


      const newLeft =
        oldRight + 1;


      if (
        newLeft > pdf.numPages
      ) {

        return;

      }


      await renderPage(
        oldRight,
        flipFrontCanvas
      );


      await renderPage(
        newLeft,
        flipBackCanvas
      );


      flipPage.style.display =
        "block";

      flipPage.style.transition =
        "none";

      flipPage.style.transform =
        "rotateY(0deg)";


      requestAnimationFrame(
        function () {

          requestAnimationFrame(
            function () {

              flipPage.style.transition =
                "transform .58s cubic-bezier(.22,.61,.36,1)";

              flipPage.style.transform =
                "rotateY(-180deg)";

            }
          );

        }
      );


      await new Promise(
        function (resolve) {

          setTimeout(
            resolve,
            600
          );

        }
      );


      flipPage.style.display =
        "none";

      flipPage.style.transition =
        "";

      flipPage.style.transform =
        "rotateY(0deg)";


      current =
        newLeft;


      await renderBook();

    } finally {

      busy = false;

    }

  }


  /* ========================================================
     ANIMATION PAGE PRÉCÉDENTE
     ======================================================== */

  async function previousPage() {

    if (
      !pdf ||
      busy ||
      current <= 1
    ) {

      return;

    }


    busy = true;


    try {

      if (isMobile()) {

        current -= 1;

        await renderBook();

        return;

      }


      const spread =
        desktopSpread();


      if (!spread.left) {

        return;

      }


      const oldLeft =
        spread.left;


      const previousRight =
        oldLeft - 1;


      const previousLeft =
        previousRight - 1 >= 1
          ? previousRight - 1
          : null;


      await renderPage(
        oldLeft,
        flipFrontCanvas
      );


      await renderPage(
        previousRight,
        flipBackCanvas
      );


      /*
        Pour le retour, le flip doit partir
        de la page gauche et tourner dans
        l'autre sens.
      */

      flipPage.style.display =
        "block";

      flipPage.style.right =
        "auto";

      flipPage.style.left =
        "0";

      flipPage.style.transformOrigin =
        "right center";

      flipPage.style.transition =
        "none";

      flipPage.style.transform =
        "rotateY(0deg)";


      requestAnimationFrame(
        function () {

          requestAnimationFrame(
            function () {

              flipPage.style.transition =
                "transform .58s cubic-bezier(.22,.61,.36,1)";

              flipPage.style.transform =
                "rotateY(180deg)";

            }

          );

        }

      );


      await new Promise(
        function (resolve) {

          setTimeout(
            resolve,
            600
          );

        }
      );


      flipPage.style.display =
        "none";

      flipPage.style.transition =
        "";

      flipPage.style.transform =
        "rotateY(0deg)";

      flipPage.style.right =
        "0";

      flipPage.style.left =
        "auto";

      flipPage.style.transformOrigin =
        "left center";


      current =
        previousLeft || 1;


      await renderBook();

    } finally {

      busy = false;

    }

  }


  /* ========================================================
     CHARGEMENT D'UN CATALOGUE
     ======================================================== */

  async function loadCatalogue(
    language
  ) {

    if (!catalogues[language]) {

      language = "fr";

    }


    activeLanguage =
      language;


    setActiveLanguage(
      language
    );


    hideStatus();


    try {

      /*
        URL ABSOLUE DE GITHUB PAGES
      */

      const response =
        await fetch(
          catalogues[language],
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          catalogues[language]
        );

      }


      const data =
        await response.arrayBuffer();


      pdf =
        await pdfjsLib.getDocument({
          data: data
        }).promise;


      current = 1;
      zoom = 1;


      await renderBook();


    } catch (error) {

      console.error(
        "Erreur catalogue :",
        error
      );


      showStatus(
        "Impossible de charger le catalogue. " +
        "Erreur : " +
        (
          error &&
          error.message
            ? error.message
            : "erreur inconnue"
        )
      );

    }

  }


  /* ========================================================
     CLIC DRAPEAUX
     ======================================================== */

  buttons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {

          loadCatalogue(
            button.dataset.lang
          );

        }
      );

    }
  );


  /* ========================================================
     BOUTONS
     ======================================================== */

  prevButton.addEventListener(
    "click",
    previousPage
  );


  nextButton.addEventListener(
    "click",
    nextPage
  );


  document
    .getElementById("zoom-in")
    .addEventListener(
      "click",
      async function () {

        zoom =
          Math.min(
            2.5,
            zoom + .15
          );

        await renderBook();

      }
    );


  document
    .getElementById("zoom-out")
    .addEventListener(
      "click",
      async function () {

        zoom =
          Math.max(
            .75,
            zoom - .15
          );

        await renderBook();

      }
    );


  document
    .getElementById("fullscreen")
    .addEventListener(
      "click",
      async function () {

        try {

          if (
            !document.fullscreenElement
          ) {

            await reader.requestFullscreen();

          } else {

            await document.exitFullscreen();

          }

        } catch (error) {

          console.error(
            "Fullscreen error:",
            error
          );

        }

      }
    );


  /* ========================================================
     SWIPE MOBILE
     ======================================================== */

  let touchStartX = 0;

  let touchStartY = 0;


  document
    .getElementById("book")
    .addEventListener(
      "touchstart",
      function (event) {

        const touch =
          event.changedTouches[0];

        touchStartX =
          touch.screenX;

        touchStartY =
          touch.screenY;

      },
      {
        passive: true
      }
    );


  document
    .getElementById("book")
    .addEventListener(
      "touchend",
      function (event) {

        const touch =
          event.changedTouches[0];

        const dx =
          touchStartX -
          touch.screenX;

        const dy =
          touchStartY -
          touch.screenY;


        if (
          Math.abs(dx) < 45 ||
          Math.abs(dx) < Math.abs(dy)
        ) {

          return;

        }


        if (dx > 0) {

          nextPage();

        } else {

          previousPage();

        }

      },
      {
        passive: true
      }
    );


  /* ========================================================
     REDIMENSIONNEMENT
     ======================================================== */

  window.addEventListener(
    "resize",
    function () {

      clearTimeout(
        window.__catalogueResize
      );


      window.__catalogueResize =
        setTimeout(
          function () {

            if (pdf) {
              renderBook();
            }

          },
          160
        );

    }
  );


  /* ========================================================
     DÉMARRAGE
     ======================================================== */

  loadCatalogue(
    detectLanguage()
  );

})();
</script>

</body>
</html>
