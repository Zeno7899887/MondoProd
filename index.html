
<!doctype html>
<div id="mp-catalogue-reader" data-loading="false">

  <div id="mp-loading" hidden aria-hidden="true">
    <img id="mp-loading-globe" alt="" src="https://raw.githubusercontent.com/Zeno7899887/MondoProd/main/Catalogue%20FR.pdf_11-2.png">
  </div>

  <div id="mp-catalogue-languages" aria-label="Choisir la langue du catalogue">
    <button class="mp-lang-btn" data-lang="fr" type="button" aria-label="Français">🇫🇷</button>
    <button class="mp-lang-btn" data-lang="en" type="button" aria-label="English">🇬🇧</button>
    <button class="mp-lang-btn" data-lang="it" type="button" aria-label="Italiano">🇮🇹</button>
    <button class="mp-lang-btn" data-lang="es" type="button" aria-label="Español">🇪🇸</button>
  </div>

  <!-- ======================= PC : effet magazine PageFlip ======================= -->
  <div id="mp-book-area">
    <button id="mp-first-page" class="mp-arrow mp-pc-arrow" type="button" aria-label="Première page">«</button>
    <button id="mp-prev-page" class="mp-arrow mp-pc-arrow" type="button" aria-label="Page précédente">‹</button>
    <div id="mp-book"></div>
    <button id="mp-next-page" class="mp-arrow mp-pc-arrow" type="button" aria-label="Page suivante">›</button>
    <button id="mp-last-page" class="mp-arrow mp-pc-arrow" type="button" aria-label="Dernière page">»</button>
  </div>

  <!-- ======================= Mobile : carrousel fondu/zoom ======================= -->
  <div id="mp-carousel-wrap">
    <div id="mp-carousel" aria-hidden="true"></div>
  </div>

  <div id="mp-arrows" aria-hidden="true">
    <button id="mp-mfirst-page" class="mp-arrow" type="button" aria-label="Première page">«</button>
    <button id="mp-mprev-page" class="mp-arrow" type="button" aria-label="Page précédente">‹</button>
    <button id="mp-mnext-page" class="mp-arrow" type="button" aria-label="Page suivante">›</button>
    <button id="mp-mlast-page" class="mp-arrow" type="button" aria-label="Dernière page">»</button>
  </div>

  <div id="mp-page-number">1 / 1</div>

  <div id="mp-status"></div>

</div>

<style>
  #mp-catalogue-reader { width:100%; max-width:1360px; margin:0 auto; padding:10px 8px; text-align:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif; color:#1d1d1f; position:relative; box-sizing:border-box; }
  #mp-catalogue-reader *, #mp-catalogue-reader *::before, #mp-catalogue-reader *::after { box-sizing:border-box; }

  #mp-catalogue-languages { display:flex; justify-content:center; align-items:center; gap:8px; margin:0 0 12px; }
  .mp-lang-btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; min-width:48px; height:38px; padding:0 11px; border:1px solid rgba(0,0,0,.10); border-radius:999px; background:rgba(255,255,255,.9); color:rgba(0,0,0,.6); box-shadow:0 2px 10px rgba(0,0,0,.06); cursor:pointer; font-size:18px; opacity:.72; transition:all .18s ease; }
  .mp-lang-btn:hover { opacity:1; background:#fff; }
  .mp-lang-btn.active { opacity:1; color:#111; background:#fff; border-color:rgba(0,0,0,.2); box-shadow:0 5px 18px rgba(0,0,0,.12); }

  /* ======================= PC : zone du livre PageFlip ======================= */
  #mp-book-area { position:relative; width:100%; display:flex; justify-content:center; align-items:center; padding:0 70px; min-height:clamp(320px, 55vw, 760px); }
  #mp-book { position:relative; width:min(1100px, 100%); max-width:1100px; aspect-ratio:1.41421356/1; margin:0 auto; background:transparent !important; overflow:visible; }
  #mp-book .mp-pdf-page { background:#fff; overflow:hidden; padding:0; margin:0; box-shadow:none; }
  #mp-book .mp-pdf-page img { display:block; width:100%; height:100%; object-fit:fill; background:#fff; user-select:none; pointer-events:none; }

  .mp-pc-arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:100; }
  #mp-first-page.mp-pc-arrow { left:0; }
  #mp-prev-page.mp-pc-arrow { left:40px; }
  #mp-next-page.mp-pc-arrow { right:40px; }
  #mp-last-page.mp-pc-arrow { right:0; }

  /* ======================= Mobile : carrousel fondu/zoom ======================= */
  #mp-carousel-wrap { display:none; justify-content:center; }
  #mp-carousel { position:relative; width:min(92vw, 470px); max-width:470px; aspect-ratio:1/1.41421356; margin:0 auto; perspective:1400px; }

  #mp-carousel .mp-slide {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(.90); pointer-events:none;
    transition:opacity .55s cubic-bezier(.22,.61,.36,1), transform .55s cubic-bezier(.22,.61,.36,1);
    background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 10px 34px rgba(0,0,0,.14);
    will-change:opacity, transform;
  }
  #mp-carousel .mp-slide.is-active { opacity:1; transform:scale(1); pointer-events:auto; z-index:2; }
  #mp-carousel .mp-slide img { display:block; width:100%; height:100%; object-fit:fill; background:#fff; user-select:none; pointer-events:none; }

  #mp-arrows { display:none; justify-content:center; align-items:center; gap:10px; margin:10px auto 0; }
  .mp-arrow { appearance:none; width:40px; height:40px; border:1px solid rgba(0,0,0,.12); border-radius:50%; background:rgba(255,255,255,.9); color:#1b1b1b; box-shadow:0 5px 20px rgba(0,0,0,.10); font-size:22px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .18s ease; }
  .mp-arrow:hover:not(:disabled) { background:#fff; transform:scale(1.05); }
  .mp-arrow:disabled { opacity:.25; cursor:default; }
  .mp-pc-arrow:hover:not(:disabled) { transform:translateY(-50%) scale(1.05); }

  #mp-page-number { margin-top:8px; font-size:12px; font-weight:600; color:rgba(0,0,0,.6); }

  #mp-loading { position:absolute; inset:0; z-index:5000; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; visibility:hidden; }
  #mp-loading[hidden] { display:none !important; }
  #mp-catalogue-reader[data-loading="true"] #mp-loading:not([hidden]) { opacity:1; visibility:visible; }
  #mp-loading-globe { width:72px; height:72px; object-fit:contain; animation:mpSpin 6s linear infinite; }
  @keyframes mpSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  #mp-status { display:none; max-width:780px; margin:12px auto 0; padding:10px 14px; border:1px solid rgba(190,30,45,.18); border-radius:10px; background:rgba(255,245,246,.86); color:#8b2833; font-size:13px; }

  /* Bascule PC / mobile : le livre PageFlip est utilisé au-dessus de 700px,
     le carrousel fondu/zoom en dessous. */
  @media (min-width: 701px) {
    #mp-book-area { display:flex; }
    #mp-carousel-wrap { display:none !important; }
    #mp-arrows { display:none !important; }
  }
  @media (max-width: 700px) {
    #mp-book-area { display:none !important; }
    #mp-carousel-wrap { display:flex; }
    #mp-arrows { display:flex; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>

  "use strict";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  /* Fichiers PDF récupérés directement depuis GitHub (contenu brut),

  var catalogues = {

    es: "https://raw.githubusercontent.com/Zeno7899887/MondoProd/main/catalogue-es.pdf"
  };
  var DEFAULT_LANGUAGE = "fr";

  function init(){

    var prevBtn = document.getElementById("mp-prev-page");
    var nextBtn = document.getElementById("mp-next-page");
    var lastBtn = document.getElementById("mp-last-page");

    var mFirstBtn = document.getElementById("mp-mfirst-page");
    var mPrevBtn = document.getElementById("mp-mprev-page");
    var mNextBtn = document.getElementById("mp-mnext-page");
    var mLastBtn = document.getElementById("mp-mlast-page");

    var langButtons = Array.prototype.slice.call(document.querySelectorAll(".mp-lang-btn"));

    var pdf = null;
    var pageFlip = null;
    var activeLanguage = DEFAULT_LANGUAGE;
    var loadRequestId = 0, activeLoadRequestId = 0;
    var slides = [], index = 0;
    var mobileMode = false;

    /* Cache des buffers PDF déjà téléchargés : permet de changer de langue
       instantanément si le catalogue a déjà été ouvert pendant la session,
       et de lancer le préchargement des autres langues en tâche de fond
       pour réduire le temps d'attente perçu lors d'un changement. */
    var bufferCache = {};
    var prefetchStarted = {};

    function isMobileView(){ return window.matchMedia("(max-width: 700px)").matches; }

    function setActive(lang){
      langButtons.forEach(function(b){ b.classList.toggle("active", b.dataset.lang === lang); });
    }
    function showLoading(){ reader.dataset.loading = "true"; var l=document.getElementById("mp-loading"); if(l){ l.hidden=false; } }
    function hideLoading(){ reader.dataset.loading = "false"; var l=document.getElementById("mp-loading"); if(l){ l.hidden=true; } }
    function showError(msg){ status.textContent = msg; status.style.display = "block"; hideLoading(); }
    function hideError(){ status.style.display = "none"; }

    function detectLanguage(){
      try {
        var params = new URLSearchParams(window.location.search);
        var q = (params.get("lang") || "").toLowerCase().split("-")[0];
        if (catalogues[q]) return q;
      } catch(e){}
      return DEFAULT_LANGUAGE;
    }

    /* Téléchargement du PDF, mis en cache par langue pour accélérer les
       changements de l
