<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue V31</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif; overflow-x:hidden; color:#1d1d1f; }

  #catalogue-reader {
    width:100%;
    max-width:1360px;
    margin:0 auto;
    padding:10px 14px 16px;
    text-align:center;
    isolation:isolate;
  }

  #catalogue-languages {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:0 0 14px;
  }

  .lang-btn {
    appearance:none;
    position:relative;
    z-index:1000;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-width:74px;
    height:38px;
    padding:0 11px;
    border:1px solid rgba(0,0,0,.10);
    border-radius:999px;
    outline:0;
    background:rgba(255,255,255,.84);
    color:rgba(0,0,0,.58);
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    opacity:.72;
    transform:translateY(0);
    transition:background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease;
    pointer-events:auto;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .lang-btn::after {
    content:attr(aria-label);
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .lang-btn:hover { opacity:1; transform:translateY(-1px); background:#fff; box-shadow:0 5px 16px rgba(0,0,0,.10); }
  .lang-btn.active { opacity:1; color:#111; background:#fff; border-color:rgba(0,0,0,.20); box-shadow:0 5px 18px rgba(0,0,0,.12); }
  .lang-btn:focus-visible { box-shadow:0 0 0 3px rgba(0,0,0,.12), 0 5px 18px rgba(0,0,0,.12); }

  #book-area {
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 92px;
    min-height:clamp(320px, 62vw, 790px);
  }

  #book {
    position:relative;
    width:min(1160px, 100%);
    max-width:1160px;
    aspect-ratio:1.41421356 / 1;
    margin:0 auto !important;
    transform:translateZ(0);
    transform-style:preserve-3d;
    background:transparent !important;
    overflow:visible;
  }

  /*
     Le wrapper interne de PageFlip ne doit pas être déplacé :
     c'est lui qui calcule la position exacte d'une couverture seule.
     On ne force donc ni left/right ni un margin artificiel.
  */
  #book .stf,
  #book .stf__parent,
  #book .stf__wrapper,
  #book .stf__block {
    margin-left:auto !important;
    margin-right:auto !important;
  }

  #book, #book .pdf-page, .book-arrow, .lang-btn {
    user-select:none;
    -webkit-user-select:none;
  }

  #book .pdf-page {
    background:#fff;
    overflow:hidden;
    padding:0;
    margin:0;
    box-shadow:none;
  }

  #book .pdf-page img {
    display:block;
    width:100%;
    height:100%;
    object-fit:fill;
    background:#fff;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .book-nav {
    position:static;
    z-index:500;
  }

  /* Les flèches sont placées hors de la surface du livre. */

  .book-arrow {
    position:absolute;
    top:50%;
    z-index:500;
    width:44px;
    height:44px;
    appearance:none;
    border:1px solid rgba(0,0,0,.10);
    border-radius:50%;
    background:rgba(255,255,255,.92);
    color:#1b1b1b;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:29px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 0 2px;
    cursor:pointer;
    transition:background .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease, border-color .18s ease;
  }

  .book-arrow:hover:not(:disabled) {
    background:#fff;
    border-color:rgba(0,0,0,.20);
    box-shadow:0 8px 25px rgba(0,0,0,.16);
    transform:scale(1.04);
  }

  .book-arrow:active:not(:disabled) { transform:scale(.98); }
  .book-arrow:disabled { opacity:.25; cursor:default; box-shadow:none; }

  /* Le chargement est désormais totalement silencieux : aucune bannière
     ni aucun texte ne doit rester au milieu de la liseuse. */
  #loading {
    display:none !important;
  }

  #catalogue-reader:not([data-ready="true"]) #book {
    pointer-events:none;
  }

  #status {
    display:none;
    max-width:780px;
    margin:12px auto 0;
    padding:10px 14px;
    border:1px solid rgba(190,30,45,.18);
    border-radius:10px;
    background:rgba(255,245,246,.86);
    color:#8b2833;
    font-size:13px;
    line-height:1.45;
  }

  #reader-controls {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    min-height:42px;
    margin:8px 0 0;
    padding:4px 8px;
    border:1px solid rgba(0,0,0,.08);
    border-radius:999px;
    width:max-content;
    max-width:100%;
    margin-left:auto;
    margin-right:auto;
    background:rgba(255,255,255,.68);
    box-shadow:0 2px 12px rgba(0,0,0,.05);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #reader-controls button {
    appearance:none;
    min-width:34px;
    height:32px;
    border:0;
    outline:0;
    background:transparent;
    color:rgba(0,0,0,.70);
    padding:0 8px;
    font-size:20px;
    cursor:pointer;
    border-radius:999px;
    transition:background .16s ease, color .16s ease, transform .16s ease;
  }
  #reader-controls button:hover { background:rgba(0,0,0,.06); color:#111; }
  #reader-controls button:focus-visible { box-shadow:0 0 0 3px rgba(0,0,0,.10); }
  #page-number { min-width:104px; padding:0 8px; font-size:12px; font-weight:600; color:rgba(0,0,0,.62); font-variant-numeric:tabular-nums; text-align:center; }

  #catalogue-reader:fullscreen { width:100vw; max-width:none; height:100vh; background:#fff; display:flex; flex-direction:column; justify-content:center; padding:12px 14px; }
  #catalogue-reader:fullscreen #book-area { flex:1 1 auto; min-height:0; }

  @media (max-width: 900px) {
    #catalogue-reader { padding-left:8px; padding-right:8px; }
    #book-area { padding-left:70px; padding-right:70px; min-height:0; }
  }

  @media (max-width: 700px) {
    #catalogue-languages { gap:6px; margin-bottom:10px; }
    .lang-btn { min-width:58px; height:34px; padding:0 8px; font-size:16px; gap:5px; }
    .lang-btn::after { font-size:10px; }
    #book-area { padding-left:54px; padding-right:54px; }
    #book { width:100%; max-width:470px; aspect-ratio:1 / 1.41421356; margin-left:auto !important; margin-right:auto !important; }
    .book-arrow { width:38px; height:38px; font-size:25px; }
    #reader-controls { margin-top:6px; }
  }

  @media (max-width: 430px) {
    .lang-btn { min-width:0; width:44px; padding:0; }
    .lang-btn::after { display:none; }
    #book-area { padding-left:46px; padding-right:46px; }
    .book-arrow { width:34px; height:34px; font-size:22px; }
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <!-- =======================================================
       DRAPEAUX
       ======================================================= -->

  <div id="catalogue-languages"
       aria-label="Choisir la langue du catalogue">

    <button
      class="lang-btn"
      data-lang="fr"
      type="button"
      aria-label="Français">
      🇫🇷
    </button>

    <button
      class="lang-btn"
      data-lang="en"
      type="button"
      aria-label="English">
      🇬🇧
    </button>

    <button
      class="lang-btn"
      data-lang="it"
      type="button"
      aria-label="Italiano">
      🇮🇹
    </button>

    <button
      class="lang-btn"
      data-lang="es"
      type="button"
      aria-label="Español">
      🇪🇸
    </button>

  </div>


  <!-- =======================================================
       LIVRE
       ======================================================= -->

  <div id="book-area">

    <div class="book-nav book-nav-left" aria-label="Navigation gauche">
      <button id="first-page" class="book-arrow" type="button" aria-label="Première page">«</button>
      <button id="prev-page" class="book-arrow" type="button" aria-label="Page précédente">‹</button>
    </div>

    <div id="book"></div>

    <div class="book-nav book-nav-right" aria-label="Navigation droite">
      <button id="next-page" class="book-arrow" type="button" aria-label="Page suivante">›</button>
      <button id="last-page" class="book-arrow" type="button" aria-label="Dernière page">»</button>
    </div>

  </div>


  <!-- =======================================================
       CONTRÔLES
       ======================================================= -->

  <div id="reader-controls">

    <button
      id="zoom-out"
      type="button"
      aria-label="Réduire le zoom">
      −
    </button>

    <span id="page-number">
      1 / 1
    </span>

    <button
      id="zoom-in"
      type="button"
      aria-label="Augmenter le zoom">
      +
    </button>

    <button
      id="fullscreen"
      type="button"
      aria-label="Plein écran">
      ⛶
    </button>

  </div>


  <div id="status"></div>

</div>


<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- =========================================================
     PAGEFLIP
     ========================================================= -->

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>

(function () {

  "use strict";


  /* ========================================================
     PDF.JS
     ======================================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ========================================================
     URLS EXACTES
     ======================================================== */

  const catalogues = {

    fr:
      "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",

    en:
      "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",

    it:
      "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",

    es:
      "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"

  };


  /* ========================================================
     ÉLÉMENTS
     ======================================================== */

  const bookElement =
    document.getElementById("book");

  const loading =
    document.getElementById("loading");

  const status =
    document.getElementById("status");

  const pageNumber =
    document.getElementById("page-number");

  const firstButton =
    document.getElementById("first-page");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const lastButton =
    document.getElementById("last-page");

  const fullscreenButton =
    document.getElementById("fullscreen");

  const zoomInButton =
    document.getElementById("zoom-in");

  const zoomOutButton =
    document.getElementById("zoom-out");

  const languageButtons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );


  /* ========================================================
     ÉTAT
     ======================================================== */

  let pageFlip = null;

  let pdf = null;

  let activeLanguage = "fr";
  let requestedLanguage = "fr";

  let loadRequestId = 0;
  let activeLoadRequestId = 0;
  let loadingCatalogue = false;

  /* Chaque page rendue est conservée pour le PDF actuellement affiché. */
  const renderedPages = new Set();
  const renderingPages = new Map();
  const pageImageUrls = new Map();
  let renderGeneration = 0;

  /* Pages préparées avant toute interaction utilisateur. */
  let readyPromise = Promise.resolve();

  /* Cache des documents PDF par langue pour rendre le switch beaucoup plus rapide. */
  const pdfDocumentCache = new Map();
  const pdfDataCache = new Map();
  const pdfPrefetchPromises = new Map();
  const renderedImageCache = new Map();
  let currentLanguageImages = null;


  /* ========================================================
     UTILITAIRES
     ======================================================== */

  function setActiveLanguage(language) {

    languageButtons.forEach(
      function (button) {

        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );

      }
    );

  }


  function showLoading(message) {
    document.getElementById("catalogue-reader").dataset.ready = "false";
  }


  function hideLoading() {
    document.getElementById("catalogue-reader").dataset.ready = "true";
  }


  function showError(message) {

    status.textContent =
      message;

    status.style.display =
      "block";

    hideLoading();

  }


  function hideError() {

    status.style.display =
      "none";

  }


  /* ========================================================
     LANGUE DU SITE
     ======================================================== */

  function detectLanguage() {

    /*
      1 — ?lang=fr
    */

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const queryLang =
        (
          params.get("lang") ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[queryLang]
      ) {

        return queryLang;

      }

    } catch (error) {}


    /*
      2 — Dernière langue choisie dans la liseuse.
    */

    try {
      const savedLang = (localStorage.getItem('mondoprod-catalogue-lang') || '')
        .toLowerCase()
        .split('-')[0];
      if (catalogues[savedLang]) return savedLang;
    } catch (error) {}


    /*
      3 — Langue du document.
    */

    const htmlLang =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLang]
    ) {

      return htmlLang;

    }


    /*
      3 — Langue du navigateur.
    */

    try {

      const browserLang =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[browserLang]
      ) {

        return browserLang;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     RENDRE UNE PAGE PDF DIRECTEMENT DANS UN CANVAS HD
     ======================================================== */

  function isMobileView() {
    return window.matchMedia("(max-width: 700px)").matches;
  }

  function getRenderTargetWidth() {

    const bookWidth = bookElement.clientWidth || 1120;
    const cssPageWidth = isMobileView() ? bookWidth : bookWidth / 2;
    const multiplier = Math.min(4.0, Math.max(2.8, window.devicePixelRatio * 1.8 + 1.4));

    return Math.min(
      3600,
      Math.max(1800, Math.ceil(cssPageWidth * multiplier))
    );
  }

  function sleepFrame() {
    return new Promise(function(resolve) {
      requestAnimationFrame(function() {
        requestAnimationFrame(resolve);
      });
    });
  }

  function cancelCurrentRenders() {
    renderingPages.forEach(function(entry) {
      try {
        if (entry && entry.task && typeof entry.task.cancel === 'function') {
          entry.task.cancel();
        }
      } catch (error) {}
    });
    renderingPages.clear();
  }

  function revokePageUrl(index) {
    const url = pageImageUrls.get(index);
    if (url) {
      try { URL.revokeObjectURL(url); } catch (error) {}
      pageImageUrls.delete(index);
    }
  }

  function revokeAllPageUrls() {
    pageImageUrls.forEach(function(url) {
      try { URL.revokeObjectURL(url); } catch (error) {}
    });
    pageImageUrls.clear();
  }

  function resetRenderState() {
    renderGeneration++;
    cancelCurrentRenders();
    renderedPages.clear();
    /* Les URLs mises en cache par langue restent valides pour les prochains switches. */
    pageImageUrls.clear();
    readyPromise = Promise.resolve();
  }

  function getLanguageImageCache(language) {
    let cache = renderedImageCache.get(language);
    if (!cache) {
      cache = new Map();
      renderedImageCache.set(language, cache);
    }
    return cache;
  }

  function getCurrentImageCache() {
    if (!currentLanguageImages) currentLanguageImages = getLanguageImageCache(activeLanguage);
    return currentLanguageImages;
  }


  function canvasToPngBlob(canvas) {
    return new Promise(function(resolve, reject) {
      canvas.toBlob(function(blob) {
        if (blob) resolve(blob);
        else reject(new Error('Impossible de créer l’image PNG de la page.'));
      }, 'image/png');
    });
  }

  async function renderPage(index, generation) {

    if (!pdf || generation !== renderGeneration || index < 0 || index >= pdf.numPages) return false;
    if (renderedPages.has(index)) return true;

    const existing = renderingPages.get(index);
    if (existing && existing.generation === generation) return existing.promise;

    const pageElement = document.querySelector('#book .pdf-page[data-page-index="' + index + '"]');
    if (!pageElement) return false;

    const image = pageElement.querySelector('img');
    if (!image) return false;

    const cached = getCurrentImageCache().get(index);
    if (cached) {
      image.src = cached;
      image.style.visibility = 'visible';
      pageImageUrls.set(index, cached);
      renderedPages.add(index);
      return true;
    }

    const pdfAtStart = pdf;
    const entry = { generation: generation, task: null, promise: null };

    entry.promise = (async function() {
      const page = await pdfAtStart.getPage(index + 1);
      if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

      const baseViewport = page.getViewport({ scale: 1 });
      const targetWidth = getRenderTargetWidth();
      const scale = targetWidth / baseViewport.width;
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);

      const context = canvas.getContext('2d', { alpha: false });
      if (!context) return false;

      context.fillStyle = '#fff';
      context.fillRect(0, 0, canvas.width, canvas.height);

      const renderTask = page.render({
        canvasContext: context,
        viewport: viewport,
        intent: 'display',
        renderInteractiveForms: true
      });

      entry.task = renderTask;
      await renderTask.promise;

      if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

      const blob = await canvasToPngBlob(canvas);
      if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

      const cache = getCurrentImageCache();
      const previousCached = cache.get(index);
      if (previousCached) {
        try { URL.revokeObjectURL(previousCached); } catch (error) {}
      }
      const objectUrl = URL.createObjectURL(blob);
      cache.set(index, objectUrl);
      pageImageUrls.set(index, objectUrl);

      image.onload = null;
      image.src = objectUrl;
      image.alt = 'Page ' + (index + 1);
      image.style.visibility = 'visible';

      renderedPages.add(index);
      return true;
    })().catch(function(error) {
      if (generation !== renderGeneration || (error && error.name === 'RenderingCancelledException')) {
        return false;
      }
      console.error('Erreur rendu page ' + (index + 1) + ':', error);
      return false;
    });

    renderingPages.set(index, entry);

    try {
      return await entry.promise;
    } finally {
      const current = renderingPages.get(index);
      if (current === entry) renderingPages.delete(index);
    }
  }

  async function renderPages(indices, generation) {
    const unique = Array.from(new Set(indices))
      .filter(function(index) { return pdf && index >= 0 && index < pdf.numPages; });

    if (generation !== renderGeneration) return false;

    /*
       Les pages sont rendues en parallèle dans des canvas temporaires hors-DOM,
       puis converties en PNG lossless. Les pages visibles de PageFlip sont donc
       de vraies images HTML, clonables sans perte de contenu pendant la rotation.
    */
    await Promise.all(unique.map(function(index) {
      return renderPage(index, generation);
    }));

    return generation === renderGeneration;
  }

  function preloadAround(index) {

    if (!pdf) return;
    const generation = renderGeneration;
    const total = pdf.numPages;
    const radius = 7;
    const indices = [];

    /* Priorité aux pages immédiatement visibles à la prochaine animation. */
    const priority = [
      index,
      index + 1,
      index + 2,
      index + 3,
      index - 1,
      index - 2,
      index + 4,
      index + 5,
      index - 3,
      index - 4,
      index + 6,
      index + 7,
      index - 5,
      index - 6,
      index - 7
    ];

    priority.forEach(function(i) {
      if (i >= 0 && i < total && !indices.includes(i)) indices.push(i);
    });

    if (index <= 3) {
      [0,1,2,3,4,5,6,7].forEach(function(i) {
        if (i < total && !indices.includes(i)) indices.push(i);
      });
    }

    if (index >= total - 4) {
      [total-8,total-7,total-6,total-5,total-4,total-3,total-2,total-1].forEach(function(i) {
        if (i >= 0 && i < total && !indices.includes(i)) indices.push(i);
      });
    }

    readyPromise = readyPromise.then(function() {
      if (generation !== renderGeneration) return;
      return renderPages(indices, generation);
    }).catch(function(error) {
      console.warn('Préchargement :', error);
    });

    return readyPromise;
  }

  async function ensurePagesReady(indices) {
    if (!pdf) return false;
    const generation = renderGeneration;
    const wanted = Array.from(new Set(indices)).filter(function(index) {
      return index >= 0 && index < pdf.numPages;
    });

    await (readyPromise || Promise.resolve());
    if (generation !== renderGeneration) return false;

    return renderPages(wanted, generation);
  }

  /* ========================================================
     CRÉER LA LISEUSE EN MODE HTML
     ======================================================== */

  function createBook() {

    bookElement.innerHTML = '';
    resetRenderState();

    const pageElements = [];

    for (
      let index = 0;
      index < pdf.numPages;
      index++
    ) {

      const page =
        document.createElement('div');

      page.className = 'pdf-page';
      page.dataset.pageIndex = String(index);
      page.setAttribute('data-density', 'soft');

      if (index === 0 || index === pdf.numPages - 1) {
        page.setAttribute('data-density', 'hard');
      }

      const image =
        document.createElement('img');

      image.setAttribute('aria-hidden', 'true');
      image.alt = 'Page ' + (index + 1);
      image.style.visibility = 'hidden';
      image.decoding = 'async';
      image.draggable = false;

      const cachedImages = getCurrentImageCache();
      const cachedUrl = cachedImages.get(index);
      if (cachedUrl) {
        image.src = cachedUrl;
        image.style.visibility = 'visible';
        renderedPages.add(index);
        pageImageUrls.set(index, cachedUrl);
      }

      page.appendChild(image);
      bookElement.appendChild(page);
      pageElements.push(page);

    }

    pageFlip =
      new St.PageFlip(
        bookElement,
        {
          width: 760,
          height: 1075,
          size: 'stretch',
          minWidth: 250,
          maxWidth: 1800,
          minHeight: 350,
          maxHeight: 2550,
          flippingTime: 950,
          showCover: true,
          drawShadow: true,
          maxShadowOpacity: .78,
          /* Coins natifs PageFlip : clic/drag dans les coins uniquement. */
          showPageCorners: true,
          useMouseEvents: true,
          swipeDistance: 25,
          clickEventForward: true,
          disableFlipByClick: true,
          mobileScrollSupport: true,
          usePortrait: isMobileView(),
          startPage: 0,
          startZIndex: 20,
          autoSize: false
        }
      );

    pageFlip.loadFromHTML(pageElements);
    pageFlip.turnToPage(0);

    requestAnimationFrame(function () {
      updateCounter();
    });

  }

  /* ========================================================
     COMPTEUR
     ======================================================== */

  function updateCounter() {

    if (
      !pageFlip ||
      !pdf
    ) {

      return;

    }


    const index =
      pageFlip.getCurrentPageIndex();


    const total =
      pdf.numPages;


    /*
      Première couverture.
    */

    if (
      index === 0
    ) {

      pageNumber.textContent =
        "1 / " +
        total;

    }

    /*
      Dernière couverture.
    */

    else if (
      index === total - 1
    ) {

      pageNumber.textContent =
        total +
        " / " +
        total;

    }

    /*
      Pages intérieures.
    */

    else {

      const first =
        index + 1;


      const second =
        Math.min(
          index + 2,
          total
        );


      /*
        En double page on affiche
        "2–3 / 44", "4–5 / 44", etc.
      */

      pageNumber.textContent =
        first +
        "–" +
        second +
        " / " +
        total;

    }


    firstButton.disabled =
      index <= 0;

    prevButton.disabled =
      index <= 0;

    nextButton.disabled =
      index >= total - 1;

    lastButton.disabled =
      index >= total - 1;

  }


  /* ========================================================
     ÉVÉNEMENTS PAGEFLIP
     ======================================================== */

  /* Navigation robustesse : une commande demandée pendant une
     animation est mémorisée et exécutée dès que PageFlip redevient
     disponible. La dernière commande gagne, ce qui évite tout blocage. */
  let pendingNavigation = null;

  function pageFlipIsFlipping() {
    if (!pageFlip || typeof pageFlip.getState !== "function") return false;
    try {
      return String(pageFlip.getState()) === "flipping";
    } catch (error) {
      return false;
    }
  }

  function runOrQueueNavigation(command) {
    if (!pageFlip) return;

    if (pageFlipIsFlipping()) {
      pendingNavigation = command;
      return;
    }

    pendingNavigation = null;
    try {
      command();
    } catch (error) {
      console.warn("Navigation PageFlip :", error);
    }
  }

  function flushPendingNavigation() {
    if (!pageFlip || !pendingNavigation || pageFlipIsFlipping()) return;

    const command = pendingNavigation;
    pendingNavigation = null;

    requestAnimationFrame(function () {
      if (!pageFlip) return;
      try {
        command();
      } catch (error) {
        console.warn("Navigation PageFlip :", error);
      }
    });
  }

  function hidePagesUnderCover() {

    bookElement.classList.remove(
      'cover-front-flip-hiding',
      'cover-back-flip-hiding'
    );

    if (!pageFlip || !pdf) return;

    const index = pageFlip.getCurrentPageIndex();
    const total = pdf.numPages;

    if (index <= 1) {
      bookElement.classList.add('cover-front-flip-hiding');
    } else if (index >= total - 2) {
      bookElement.classList.add('cover-back-flip-hiding');
    }
  }

  function showPagesUnderCover() {
    bookElement.classList.remove(
      'cover-front-flip-hiding',
      'cover-back-flip-hiding'
    );
  }

  function attachPageFlipEvents() {

    if (!pageFlip) return;

    pageFlip.on('flip', function() {
      showPagesUnderCover();
      updateCounter();
      preloadAround(pageFlip.getCurrentPageIndex());
    });

    pageFlip.on('changeState', function(event) {
      const state = event && event.data ? String(event.data) : '';
      const index = pageFlip.getCurrentPageIndex();
      const total = pdf ? pdf.numPages : 0;

      const nearFrontCover = index <= 1;
      const nearBackCover = total > 0 && index >= total - 2;

      if (state === 'flipping' && (nearFrontCover || nearBackCover)) {
        hidePagesUnderCover();
      }

      if (state === 'read') {
        showPagesUnderCover();
        updateCounter();
        preloadAround(index);
        flushPendingNavigation();
        return;
      }

      updateCounter();
    });

    pageFlip.on('changeOrientation', function() {
      updateCounter();
      preloadAround(pageFlip.getCurrentPageIndex());
    });
  }

  /* ========================================================
     CACHE DES PDF PAR LANGUE — SIMPLE ET RAPIDE
     ======================================================== */

  async function getCachedPdfDocument(language) {

    if (pdfDocumentCache.has(language)) {
      return pdfDocumentCache.get(language);
    }

    const url = catalogues[language];
    if (!url) {
      throw new Error('Langue de catalogue inconnue.');
    }

    /*
       On laisse PDF.js charger directement l'URL du PDF.
       Cela permet à PDF.js d'utiliser son chargement progressif/range,
       au lieu de télécharger systématiquement tout le fichier avant de
       pouvoir commencer à l'afficher.
    */
    const loadingTask = pdfjsLib.getDocument({
      url: url,
      disableAutoFetch: false,
      disableStream: false,
      disableRange: false,
      cMapPacked: true
    });

    const promise = loadingTask.promise.catch(function(error) {
      pdfDocumentCache.delete(language);
      throw error;
    });

    pdfDocumentCache.set(language, promise);
    return promise;
  }


  async function warmOtherLanguages(currentLanguage) {

    /*
       Précharge les trois autres PDF immédiatement en arrière-plan.
       On ne rend d'abord que leurs couvertures + premières pages :
       le changement de langue peut ainsi devenir quasi instantané après
       le premier chargement.
    */
    const languages = Object.keys(catalogues).filter(function(language) {
      return language !== currentLanguage;
    });

    await Promise.all(languages.map(async function(language) {

      try {

        const otherPdf = await getCachedPdfDocument(language);
        if (!otherPdf) return;

        const cache = getLanguageImageCache(language);
        const wanted = [0, 1, 2, 3].filter(function(index) {
          return index < otherPdf.numPages && !cache.has(index);
        });

        if (!wanted.length) return;

        /* Les rendus d'une langue en arrière-plan utilisent uniquement des
           canvas temporaires différents : aucun conflit de canvas. */
        for (const index of wanted) {
          if (cache.has(index)) continue;
          await renderLanguageImage(otherPdf, language, index);
        }

      } catch (error) {
        console.warn('Préchargement langue ' + language + ' :', error);
      }

    }));
  }


  async function renderLanguageImage(otherPdf, language, index) {

    const cache = getLanguageImageCache(language);
    if (cache.has(index)) return cache.get(index);

    const pdfPage = await otherPdf.getPage(index + 1);
    const baseViewport = pdfPage.getViewport({ scale: 1 });

    const targetWidth = Math.min(
      3000,
      Math.max(
        1900,
        Math.ceil(
          (bookElement.clientWidth || 700) *
          (isMobileView() ? 3.2 : 2.0)
        )
      )
    );

    const viewport = pdfPage.getViewport({
      scale: targetWidth / baseViewport.width
    });

    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    const context = canvas.getContext('2d', { alpha:false });
    if (!context) return null;

    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);

    await pdfPage.render({
      canvasContext: context,
      viewport: viewport,
      intent: 'display'
    }).promise;

    const blob = await canvasToPngBlob(canvas);
    const url = URL.createObjectURL(blob);
    cache.set(index, url);

    return url;
  }


  /* ========================================================
     CHARGER UN CATALOGUE
     ======================================================== */

  async function loadCatalogue(language) {

    if (!catalogues[language]) language = 'fr';

    const requestId = ++loadRequestId;
    activeLoadRequestId = requestId;
    requestedLanguage = language;
    loadingCatalogue = true;
    pendingNavigation = null;

    setActiveLanguage(language);
    hideError();
    showLoading('');

    try {

      /*
         1. On récupère le document demandé.
         2. On prépare seulement les premières pages nécessaires.
         3. Ensuite seulement on remplace le livre visible.

         Ainsi un ancien chargement ne peut jamais écraser un nouveau clic.
      */
      const loadedPdf = await getCachedPdfDocument(language);

      if (!loadedPdf || requestId !== activeLoadRequestId) return;

      const targetCache = getLanguageImageCache(language);

      /* Prépare la couverture et les trois pages qui suivent.
         Si elles ont déjà été préchargées, cette étape est quasi instantanée. */
      const firstPages = [0, 1, 2, 3].filter(function(index) {
        return index < loadedPdf.numPages && !targetCache.has(index);
      });

      for (const index of firstPages) {
        if (requestId !== activeLoadRequestId) return;
        await renderLanguageImage(loadedPdf, language, index);
      }

      if (requestId !== activeLoadRequestId) return;

      const previousPageFlip = pageFlip;

      pdf = loadedPdf;
      currentLanguageImages = targetCache;
      resetRenderState();
      const generation = renderGeneration;

      bookElement.innerHTML = '';
      pageFlip = null;

      createBook();
      attachPageFlipEvents();
      pageFlip.update();
      pageFlip.turnToPage(0);

      if (requestId !== activeLoadRequestId || generation !== renderGeneration) return;

      /* La nouvelle langue est maintenant réellement active. */
      activeLanguage = language;
      try {
        localStorage.setItem('mondoprod-catalogue-lang', language);
      } catch (error) {}

      document.documentElement.dataset.catalogueReady = 'true';
      document.documentElement.dataset.catalogueLanguage = activeLanguage;

      hideLoading();
      updateCounter();
      preloadAround(0);

      /* Le téléchargement des trois autres langues continue en silence. */
      warmOtherLanguages(language);

      if (previousPageFlip && previousPageFlip !== pageFlip) {
        try { previousPageFlip.destroy(); } catch (error) {}
      }

    } catch (error) {

      if (requestId !== activeLoadRequestId) return;

      console.error('Erreur catalogue ' + language + ' :', error);
      setActiveLanguage(activeLanguage);

      showError(
        'Impossible de charger le catalogue : ' +
        (error && error.message ? error.message : 'erreur inconnue')
      );

    } finally {

      if (requestId === activeLoadRequestId) {
        loadingCatalogue = false;
      }

    }
  }


  /* ========================================================
     DRAPEAUX — UN SEUL HANDLER, DÉCLENCHÉ AU CLIC
     ======================================================== */

  languageButtons.forEach(function(button) {

    button.addEventListener('click', function(event) {

      event.preventDefault();
      event.stopPropagation();

      const nextLanguage = button.dataset.lang;
      if (!catalogues[nextLanguage]) return;

      /*
         requestedLanguage est utilisé plutôt que activeLanguage :
         cela permet de cliquer immédiatement sur une autre langue
         pendant qu'une première transition est encore en cours.
      */
      if (nextLanguage === requestedLanguage && loadingCatalogue) {
        return;
      }

      if (nextLanguage === activeLanguage && pdf && !loadingCatalogue) {
        return;
      }

      loadCatalogue(nextLanguage);

    }, { capture:true });

  });


  /* ========================================================
     COINS INTERACTIFS — pont direct vers l'API utilisateur PageFlip
     ======================================================== */

  let cornerPointerActive = false;
  let cornerPointerId = null;

  function getBookPoint(event) {
    const rect = bookElement.getBoundingClientRect();
    return {
      x: event.clientX - rect.left,
      y: event.clientY - rect.top
    };
  }

  function pointIsCorner(point) {
    const rect = bookElement.getBoundingClientRect();
    const corner = Math.max(58, Math.min(90, rect.width * 0.08));
    const nearTop = point.y <= corner;
    const nearBottom = point.y >= rect.height - corner;
    const nearLeft = point.x <= corner;
    const nearRight = point.x >= rect.width - corner;
    return (nearTop || nearBottom) && (nearLeft || nearRight);
  }

  function pointerOnCorner(event) {
    if (!pageFlip || pageFlipIsFlipping()) return;
    if (event.target.closest && (event.target.closest('.book-arrow') || event.target.closest('.lang-btn'))) return;
    const point = getBookPoint(event);
    if (!pointIsCorner(point)) return;

    cornerPointerActive = true;
    cornerPointerId = event.pointerId;
    try { bookElement.setPointerCapture(event.pointerId); } catch (e) {}
    try { pageFlip.startUserTouch(point); } catch (e) {}
    event.preventDefault();
    event.stopPropagation();
  }

  function pointerMoveCorner(event) {
    if (!cornerPointerActive || event.pointerId !== cornerPointerId || !pageFlip) return;
    const point = getBookPoint(event);
    try { pageFlip.userMove(point, event.pointerType === 'touch'); } catch (e) {}
    event.preventDefault();
    event.stopPropagation();
  }

  function pointerUpCorner(event) {
    if (!cornerPointerActive || event.pointerId !== cornerPointerId || !pageFlip) return;
    const point = getBookPoint(event);
    cornerPointerActive = false;
    cornerPointerId = null;
    try { pageFlip.userStop(point, false); } catch (e) {}
    try { bookElement.releasePointerCapture(event.pointerId); } catch (e) {}
    event.preventDefault();
    event.stopPropagation();
  }

  bookElement.addEventListener('pointerdown', pointerOnCorner, true);
  bookElement.addEventListener('pointermove', pointerMoveCorner, true);
  bookElement.addEventListener('pointerup', pointerUpCorner, true);
  bookElement.addEventListener('pointercancel', pointerUpCorner, true);

  /* ========================================================
     FLÈCHES
     ======================================================== */

  firstButton.addEventListener(
    "click",
    function () {
      runOrQueueNavigation(function () {
        if (!pageFlip) return;
        pageFlip.turnToPage(0);
      });
    }
  );


  lastButton.addEventListener(
    "click",
    function () {
      runOrQueueNavigation(function () {
        if (!pageFlip || !pdf) return;
        pageFlip.turnToPage(Math.max(0, pdf.numPages - 1));
      });
    }
  );


  prevButton.addEventListener(
    "click",
    async function () {
      if (!pageFlip || !pdf) return;
      const current = pageFlip.getCurrentPageIndex();
      const target = Math.max(0, current - 2);
      if (pageFlipIsFlipping()) {
        pendingNavigation = async function () {
          await ensurePagesReady([current - 4, current - 3, current - 2, current - 1, current, current + 1, current + 2]);
          if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
        };
        return;
      }
      await ensurePagesReady([current - 4, current - 3, current - 2, current - 1, current, current + 1, current + 2]);
      if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
    }
  );


  nextButton.addEventListener(
    "click",
    async function () {
      if (!pageFlip || !pdf) return;
      const current = pageFlip.getCurrentPageIndex();
      const target = Math.min(pdf.numPages - 1, current + 2);
      if (pageFlipIsFlipping()) {
        pendingNavigation = async function () {
          await ensurePagesReady([current - 2, current - 1, current, current + 1, current + 2, current + 3, current + 4]);
          if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
        };
        return;
      }
      await ensurePagesReady([current - 2, current - 1, current, current + 1, current + 2, current + 3, current + 4]);
      if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
    }
  );


  /* ========================================================
     ZOOM
     ======================================================== */

  let readerScale = 1;


  zoomInButton.addEventListener(
    "click",
    function () {

      readerScale =
        Math.min(
          1.14,
          readerScale + .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      bookElement.style.transformOrigin =
        "center center";

    }
  );


  zoomOutButton.addEventListener(
    "click",
    function () {

      readerScale =
        Math.max(
          .90,
          readerScale - .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      bookElement.style.transformOrigin =
        "center center";

    }
  );


  /* ========================================================
     PLEIN ÉCRAN
     ======================================================== */

  fullscreenButton.addEventListener(
    "click",
    async function () {

      try {

        if (
          !document.fullscreenElement
        ) {

          await document
            .getElementById(
              "catalogue-reader"
            )
            .requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(
          "Fullscreen:",
          error
        );

      }

    }
  );


  /* ========================================================
     CLAVIER
     ======================================================== */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        !pageFlip
      ) {

        return;

      }


      if (event.key === "ArrowRight") {
        const current = pageFlip.getCurrentPageIndex();
        ensurePagesReady([current - 2, current - 1, current, current + 1, current + 2, current + 3, current + 4]).then(function() {
          if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
        });
      }

      if (event.key === "ArrowLeft") {
        const current = pageFlip.getCurrentPageIndex();
        ensurePagesReady([current - 4, current - 3, current - 2, current - 1, current, current + 1, current + 2]).then(function() {
          if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
        });
      }

    }
  );


  /* ========================================================
     REDIMENSIONNEMENT
     ======================================================== */

  let resizeTimer = null;

  window.addEventListener('resize', function () {

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(function () {

      if (pageFlip && pdf) {
        resetRenderState();
        pageFlip.update();
        const current = pageFlip.getCurrentPageIndex();
        readyPromise = sleepFrame().then(function() {
          return ensurePagesReady([current - 2, current - 1, current, current + 1, current + 2]);
        });
        preloadAround(current);
      }

    }, 180);

  });


  window.addEventListener('beforeunload', function() {
    renderedImageCache.forEach(function(cache) {
      cache.forEach(function(url) {
        try { URL.revokeObjectURL(url); } catch (error) {}
      });
    });
  });

  /* ========================================================
     DÉMARRAGE
     ======================================================== */

  loadCatalogue(
    detectLanguage()
  );

})();

</script>

</body>
</html>
