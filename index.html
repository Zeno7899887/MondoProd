<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mondo Prod — Catalogue</title>

<style>
  :root {
    --reader-width: min(1100px, 94vw);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
  }

  #catalogue-reader {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
  }

  /* =========================
     LANGUES
     ========================= */

  #catalogue-languages {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 0 18px;
  }

  .lang-btn {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 3px;
    font-size: 40px;
    line-height: 1;
    cursor: pointer;
    opacity: .42;
    transform: scale(1);
    transition: opacity .2s ease, transform .2s ease;
  }

  .lang-btn:hover {
    opacity: .85;
    transform: scale(1.08);
  }

  .lang-btn.active {
    opacity: 1;
    transform: scale(1.14);
  }

  /* =========================
     LIVRE
     ========================= */

  #book-area {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 58px;
  }

  #book {
    position: relative;
    width: var(--reader-width);
    max-width: 1100px;
    aspect-ratio: 1.414 / 1;
    perspective: 1800px;
  }

  #spread {
    position: absolute;
    inset: 0;
    display: flex;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.18);
    background: #fff;
  }

  .page {
    width: 50%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    position: relative;
  }

  .page canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
  }

  #seam {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 12px;
    transform: translateX(-50%);
    pointer-events: none;
    background: linear-gradient(
      to right,
      rgba(0,0,0,.08),
      rgba(255,255,255,.36),
      rgba(0,0,0,.08),
      transparent
    );
  }

  /* =========================
     PAGE TURN
     ========================= */

  .turn {
    display: none;
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 20;
    transform-style: preserve-3d;
    pointer-events: none;
  }

  .turn.right {
    right: 0;
    transform-origin: left center;
  }

  .turn.left {
    left: 0;
    transform-origin: right center;
  }

  .turn-face {
    position: absolute;
    inset: 0;
    background: #fff;
    overflow: hidden;
    backface-visibility: hidden;
  }

  .turn-face.back {
    transform: rotateY(180deg);
  }

  .turn-face canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
  }

  /* =========================
     FLÈCHES
     ========================= */

  .book-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 50;

    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.55);
    color: #fff;

    font-size: 36px;
    line-height: 1;

    cursor: pointer;

    transition: transform .18s ease, background .18s ease, opacity .18s ease;
  }

  .book-arrow:hover {
    background: rgba(0,0,0,.78);
    transform: translateY(-50%) scale(1.05);
  }

  .book-arrow:disabled {
    opacity: .18;
    cursor: default;
    transform: translateY(-50%);
  }

  #prev-page {
    left: 4px;
  }

  #next-page {
    right: 4px;
  }

  /* =========================
     CONTROLES
     ========================= */

  #reader-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }

  #reader-controls button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 6px 9px;
    font-size: 22px;
    cursor: pointer;
    border-radius: 8px;
  }

  #reader-controls button:hover {
    background: rgba(0,0,0,.06);
  }

  #page-number {
    min-width: 86px;
    text-align: center;
    font-size: 14px;
  }

  #status {
    display: none;
    margin: 18px auto;
    max-width: 90%;
    text-align: center;
    color: #666;
    font-size: 14px;
  }

  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 700px) {
    #catalogue-languages {
      gap: 9px;
      margin-bottom: 13px;
    }

    .lang-btn {
      font-size: 34px;
    }

    #book-area {
      padding: 0 42px;
    }

    #book {
      width: min(92vw, 460px);
      aspect-ratio: 1 / 1.414;
    }

    #spread .page {
      width: 100%;
    }

    #left-page {
      display: none;
    }

    #right-page {
      display: block;
    }

    #seam {
      display: none;
    }

    .book-arrow {
      width: 44px;
      height: 44px;
      font-size: 30px;
    }
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <div id="catalogue-languages" aria-label="Langue du catalogue">
    <button class="lang-btn" data-lang="fr" type="button">🇫🇷</button>
    <button class="lang-btn" data-lang="en" type="button">🇬🇧</button>
    <button class="lang-btn" data-lang="it" type="button">🇮🇹</button>
    <button class="lang-btn" data-lang="es" type="button">🇪🇸</button>
  </div>

  <div id="book-area">

    <button id="prev-page" class="book-arrow" type="button" aria-label="Page précédente">‹</button>

    <div id="book">

      <div id="spread">
        <div id="left-page" class="page">
          <canvas id="left-canvas"></canvas>
        </div>

        <div id="right-page" class="page">
          <canvas id="right-canvas"></canvas>
        </div>

        <div id="seam"></div>
      </div>

      <div id="turn-right" class="turn right">
        <div class="turn-face">
          <canvas id="turn-right-front"></canvas>
        </div>
        <div class="turn-face back">
          <canvas id="turn-right-back"></canvas>
        </div>
      </div>

      <div id="turn-left" class="turn left">
        <div class="turn-face">
          <canvas id="turn-left-front"></canvas>
        </div>
        <div class="turn-face back">
          <canvas id="turn-left-back"></canvas>
        </div>
      </div>

    </div>

    <button id="next-page" class="book-arrow" type="button" aria-label="Page suivante">›</button>

  </div>

  <div id="reader-controls">
    <button id="zoom-out" type="button" aria-label="Réduire le zoom">−</button>
    <span id="page-number">1 / 1</span>
    <button id="zoom-in" type="button" aria-label="Augmenter le zoom">+</button>
    <button id="fullscreen" type="button" aria-label="Plein écran">⛶</button>
  </div>

  <div id="status"></div>

</div>

<!-- PDF.js sans modules : plus robuste sur GitHub Pages -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function () {

  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  /*
    Les PDF sont bien À LA RACINE de ton repository.
    Donc aucun dossier "catalogues".
  */
  const catalogues = {
    fr: "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",
    en: "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",
    it: "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",
    es: "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"
  };

  const buttons = Array.from(
    document.querySelectorAll(".lang-btn")
  );

  const leftCanvas =
    document.getElementById("left-canvas");

  const rightCanvas =
    document.getElementById("right-canvas");

  const pageNumber =
    document.getElementById("page-number");

  const status =
    document.getElementById("status");

  const leftPage =
    document.getElementById("left-page");

  const rightPage =
    document.getElementById("right-page");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const turnRight =
    document.getElementById("turn-right");

  const turnLeft =
    document.getElementById("turn-left");

  let pdf = null;
  let currentPage = 1;
  let zoom = 1;
  let busy = false;
  let activeLanguage = "fr";

  function isMobile() {
    return window.matchMedia(
      "(max-width: 700px)"
    ).matches;
  }

  function detectLanguage() {

    let lang =
      (
        document.documentElement.lang || ""
      )
      .toLowerCase()
      .split("-")[0]
      .split("_")[0];

    if (catalogues[lang]) {
      return lang;
    }

    return "fr";
  }

  function setActiveLanguage(lang) {

    buttons.forEach(function (button) {

      button.classList.toggle(
        "active",
        button.dataset.lang === lang
      );

    });

  }

  function showStatus(message) {

    status.textContent = message;
    status.style.display = "block";

  }

  function hideStatus() {

    status.style.display = "none";

  }

  function clearCanvas(canvas) {

    const ctx =
      canvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      canvas.width || 1,
      canvas.height || 1
    );

  }

  async function renderPage(
    pageIndex,
    canvas
  ) {

    if (
      !pageIndex ||
      pageIndex < 1 ||
      pageIndex > pdf.numPages
    ) {

      clearCanvas(canvas);
      return;

    }

    const page =
      await pdf.getPage(pageIndex);

    const baseViewport =
      page.getViewport({
        scale: 1
      });

    const container =
      canvas.parentElement;

    const width =
      container.clientWidth;

    const height =
      container.clientHeight;

    const fitScale =
      Math.min(
        width / baseViewport.width,
        height / baseViewport.height
      );

    const deviceRatio =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    const scale =
      Math.max(
        .1,
        fitScale * zoom * deviceRatio
      );

    const viewport =
      page.getViewport({
        scale
      });

    canvas.width =
      Math.floor(viewport.width);

    canvas.height =
      Math.floor(viewport.height);

    canvas.style.width = "100%";
    canvas.style.height = "100%";

    const ctx =
      canvas.getContext(
        "2d",
        { alpha: false }
      );

    ctx.fillStyle = "#fff";
    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    await page.render({
      canvasContext: ctx,
      viewport: viewport
    }).promise;

  }

  function currentSpread() {

    if (isMobile()) {
      return {
        left: null,
        right: currentPage
      };
    }

    if (currentPage === 1) {
      return {
        left: null,
        right: 1
      };
    }

    const left =
      currentPage % 2 === 0
        ? currentPage
        : currentPage - 1;

    return {
      left: left,
      right:
        left + 1 <= pdf.numPages
          ? left + 1
          : null
    };

  }

  async function renderBook() {

    if (!pdf) return;

    if (isMobile()) {

      leftPage.style.display = "none";
      rightPage.style.display = "block";

      await renderPage(
        currentPage,
        rightCanvas
      );

    } else {

      leftPage.style.display = "block";
      rightPage.style.display = "block";

      const spread =
        currentSpread();

      if (spread.left) {
        await renderPage(
          spread.left,
          leftCanvas
        );
      } else {
        clearCanvas(leftCanvas);
      }

      if (spread.right) {
        await renderPage(
          spread.right,
          rightCanvas
        );
      } else {
        clearCanvas(rightCanvas);
      }

      currentPage =
        spread.left || 1;

    }

    updateControls();

  }

  function updateControls() {

    if (!pdf) return;

    if (isMobile()) {

      pageNumber.textContent =
        currentPage +
        " / " +
        pdf.numPages;

      prevButton.disabled =
        currentPage <= 1;

      nextButton.disabled =
        currentPage >= pdf.numPages;

    } else {

      const spread =
        currentSpread();

      if (!spread.left) {

        pageNumber.textContent =
          "1 / " +
          pdf.numPages;

      } else {

        pageNumber.textContent =
          spread.left +
          "–" +
          (spread.right || spread.left) +
          " / " +
          pdf.numPages;

      }

      prevButton.disabled =
        currentPage <= 1;

      nextButton.disabled =
        currentPage >= pdf.numPages;

    }

  }

  async function nextPage() {

    if (!pdf || busy) return;

    if (isMobile()) {

      if (
        currentPage >= pdf.numPages
      ) return;

      busy = true;

      currentPage += 1;

      try {
        await renderBook();
      } finally {
        busy = false;
      }

      return;
    }

    const spread =
      currentSpread();

    const nextLeft =
      spread.right
        ? spread.right + 1
        : currentPage + 2;

    if (
      nextLeft > pdf.numPages
    ) return;

    busy = true;

    try {

      const rightPage =
        spread.right || currentPage;

      await renderPage(
        rightPage,
        document.getElementById(
          "turn-right-front"
        )
      );

      await renderPage(
        nextLeft,
        document.getElementById(
          "turn-right-back"
        )
      );

      turnRight.style.display =
        "block";

      turnRight.style.transition =
        "none";

      turnRight.style.transform =
        "rotateY(0deg)";

      requestAnimationFrame(function () {

        requestAnimationFrame(function () {

          turnRight.style.transition =
            "transform .55s cubic-bezier(.22,.61,.36,1)";

          turnRight.style.transform =
            "rotateY(-180deg)";

        });

      });

      await new Promise(function (resolve) {
        setTimeout(resolve, 570);
      });

      turnRight.style.display =
        "none";

      turnRight.style.transition =
        "";

      turnRight.style.transform =
        "rotateY(0deg)";

      currentPage =
        nextLeft;

      await renderBook();

    } finally {

      busy = false;

    }

  }

  async function previousPage() {

    if (!pdf || busy) return;

    if (isMobile()) {

      if (currentPage <= 1) return;

      busy = true;

      currentPage -= 1;

      try {
        await renderBook();
      } finally {
        busy = false;
      }

      return;

    }

    if (currentPage <= 1) return;

    const spread =
      currentSpread();

    const previousRight =
      spread.left - 1;

    const previousLeft =
      Math.max(
        1,
        previousRight - 1
      );

    busy = true;

    try {

      await renderPage(
        spread.left,
        document.getElementById(
          "turn-left-front"
        )
      );

      await renderPage(
        previousRight,
        document.getElementById(
          "turn-left-back"
        )
      );

      turnLeft.style.display =
        "block";

      turnLeft.style.transition =
        "none";

      turnLeft.style.transform =
        "rotateY(0deg)";

      requestAnimationFrame(function () {

        requestAnimationFrame(function () {

          turnLeft.style.transition =
            "transform .55s cubic-bezier(.22,.61,.36,1)";

          turnLeft.style.transform =
            "rotateY(180deg)";

        });

      });

      await new Promise(function (resolve) {
        setTimeout(resolve, 570);
      });

      turnLeft.style.display =
        "none";

      turnLeft.style.transition =
        "";

      turnLeft.style.transform =
        "rotateY(0deg)";

      currentPage =
        previousLeft;

      await renderBook();

    } finally {

      busy = false;

    }

  }

  async function loadCatalogue(lang) {

    if (!catalogues[lang]) {
      lang = "fr";
    }

    activeLanguage =
      lang;

    setActiveLanguage(lang);

    hideStatus();

    try {

      /*
        On charge d'abord le PDF avec fetch() depuis GitHub Pages,
        puis on donne directement les octets à PDF.js.
        Cela évite les problèmes de requêtes Range/stream éventuels.
      */
      const response = await fetch(
        catalogues[lang],
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          "HTTP " +
          response.status +
          " pour " +
          catalogues[lang]
        );
      }

      const pdfData =
        await response.arrayBuffer();

      pdf = await pdfjsLib.getDocument({
        data: pdfData
      }).promise;

      currentPage = 1;
      zoom = 1;

      await renderBook();

    } catch (error) {

      console.error(
        "Erreur chargement PDF :",
        error
      );

      showStatus(
        "Impossible de charger le catalogue : " +
        (error && error.message
          ? error.message
          : "erreur inconnue")
      );

    }

  }

  buttons.forEach(function (button) {

    button.addEventListener(
      "click",
      function () {

        loadCatalogue(
          button.dataset.lang
        );

      }
    );

  });

  prevButton.addEventListener(
    "click",
    previousPage
  );

  nextButton.addEventListener(
    "click",
    nextPage
  );

  document
    .getElementById("zoom-in")
    .addEventListener("click", async function () {

      zoom =
        Math.min(
          2.5,
          zoom + .15
        );

      await renderBook();

    });

  document
    .getElementById("zoom-out")
    .addEventListener("click", async function () {

      zoom =
        Math.max(
          .75,
          zoom - .15
        );

      await renderBook();

    });

  document
    .getElementById("fullscreen")
    .addEventListener("click", async function () {

      if (!document.fullscreenElement) {

        await document
          .getElementById(
            "catalogue-reader"
          )
          .requestFullscreen();

      } else {

        await document.exitFullscreen();

      }

    });

  let touchStart = 0;

  book.addEventListener(
    "touchstart",
    function (event) {

      touchStart =
        event.changedTouches[0].screenX;

    },
    { passive: true }
  );

  book.addEventListener(
    "touchend",
    function (event) {

      const touchEnd =
        event.changedTouches[0].screenX;

      const distance =
        touchStart - touchEnd;

      if (
        Math.abs(distance) < 45
      ) return;

      if (distance > 0) {
        nextPage();
      } else {
        previousPage();
      }

    },
    { passive: true }
  );

  window.addEventListener(
    "resize",
    function () {

      clearTimeout(
        window.__readerResizeTimer
      );

      window.__readerResizeTimer =
        setTimeout(
          function () {
            if (pdf) {
              renderBook();
            }
          },
          150
        );

    }
  );

  loadCatalogue(
    detectLanguage()
  );

})();
</script>

</body>
</html>
