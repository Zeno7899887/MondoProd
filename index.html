<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue V29</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif; overflow-x:hidden; color:#1d1d1f; }

  #catalogue-reader {
    width:100%;
    max-width:1360px;
    margin:0 auto;
    padding:10px 14px 16px;
    text-align:center;
    isolation:isolate;
  }

  #catalogue-languages {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:0 0 14px;
  }

  .lang-btn {
    appearance:none;
    position:relative;
    z-index:1000;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-width:74px;
    height:38px;
    padding:0 11px;
    border:1px solid rgba(0,0,0,.10);
    border-radius:999px;
    outline:0;
    background:rgba(255,255,255,.84);
    color:rgba(0,0,0,.58);
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    opacity:.72;
    transform:translateY(0);
    transition:background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease;
    pointer-events:auto;
  }
  .lang-btn::after {
    content:attr(aria-label);
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .lang-btn:hover { opacity:1; transform:translateY(-1px); background:#fff; box-shadow:0 5px 16px rgba(0,0,0,.10); }
  .lang-btn.active { opacity:1; color:#111; background:#fff; border-color:rgba(0,0,0,.20); box-shadow:0 5px 18px rgba(0,0,0,.12); }
  .lang-btn:focus-visible { box-shadow:0 0 0 3px rgba(0,0,0,.12), 0 5px 18px rgba(0,0,0,.12); }

  #book-area {
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 72px;
    min-height:clamp(320px, 62vw, 790px);
  }

  #book {
    position:relative;
    width:min(1160px, 100%);
    max-width:1160px;
    aspect-ratio:1.41421356 / 1;
    margin:0 auto;
    transform:translateZ(0);
    transform-style:preserve-3d;
    background:transparent !important;
    overflow:visible;
  }

  #book .stf,
  #book .stf__wrapper,
  #book .stf__block {
    margin-left:auto !important;
    margin-right:auto !important;
  }
  #book .stf { left:0 !important; right:0 !important; }

  #book, #book .pdf-page, .book-arrow, .lang-btn { user-select:none; -webkit-user-select:none; }

  #book .pdf-page {
    background:#fff;
    overflow:hidden;
    padding:0;
    margin:0;
    box-shadow:none;
  }
  #book .pdf-page canvas {
    display:block;
    width:100%;
    height:100%;
    background:#fff;
    object-fit:fill;
    image-rendering:auto;
  }

  /*
     Les pages sont rendues en images PNG lossless.
     C'est volontaire : PageFlip clone les pages HTML pendant une
     vraie rotation, et les images conservent leur contenu dans ces clones
     contrairement aux canvas HTML clonés.
  */
  #book .pdf-page img {
    display:block;
    width:100%;
    height:100%;
    object-fit:fill;
    background:#fff;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .book-arrow {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:100;
    width:46px;
    height:46px;
    appearance:none;
    border:1px solid rgba(0,0,0,.12);
    border-radius:50%;
    background:rgba(255,255,255,.90);
    color:#1b1b1b;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:31px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 0 2px;
    cursor:pointer;
    transition:background .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease, border-color .18s ease;
  }
  .book-arrow:hover:not(:disabled) { background:#fff; border-color:rgba(0,0,0,.20); box-shadow:0 8px 25px rgba(0,0,0,.16); transform:translateY(-50%) scale(1.04); }
  .book-arrow:active:not(:disabled) { transform:translateY(-50%) scale(.98); }
  .book-arrow:disabled { opacity:.25; cursor:default; box-shadow:none; }
  #first-page { left:10px; }
  #prev-page { left:62px; }
  #next-page { right:62px; }
  #last-page { right:10px; }

  /* Zones de coins interactifs. Elles épousent exactement la zone du livre
     et transmettent les Pointer Events directement à PageFlip. */
  #corner-layer {
    position:absolute;
    z-index:150;
    pointer-events:none;
  }
  .corner-zone {
    position:absolute;
    width:82px;
    height:82px;
    pointer-events:auto;
    touch-action:none;
    background:transparent;
  }
  #corner-tl { left:0; top:0; cursor:pointer; }
  #corner-bl { left:0; bottom:0; cursor:pointer; }
  #corner-tr { right:0; top:0; cursor:pointer; }
  #corner-br { right:0; bottom:0; cursor:pointer; }

  /* Le chargement est désormais totalement silencieux : aucune bannière
     ni aucun texte ne doit rester au milieu de la liseuse. */
  #loading {
    display:none !important;
  }

  #catalogue-reader:not([data-ready="true"]) #book {
    pointer-events:none;
  }

  #status {
    display:none;
    max-width:780px;
    margin:12px auto 0;
    padding:10px 14px;
    border:1px solid rgba(190,30,45,.18);
    border-radius:10px;
    background:rgba(255,245,246,.86);
    color:#8b2833;
    font-size:13px;
    line-height:1.45;
  }

  #reader-controls {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    min-height:42px;
    margin:8px 0 0;
    padding:4px 8px;
    border:1px solid rgba(0,0,0,.08);
    border-radius:999px;
    width:max-content;
    max-width:100%;
    margin-left:auto;
    margin-right:auto;
    background:rgba(255,255,255,.68);
    box-shadow:0 2px 12px rgba(0,0,0,.05);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #reader-controls button {
    appearance:none;
    min-width:34px;
    height:32px;
    border:0;
    outline:0;
    background:transparent;
    color:rgba(0,0,0,.70);
    padding:0 8px;
    font-size:20px;
    cursor:pointer;
    border-radius:999px;
    transition:background .16s ease, color .16s ease, transform .16s ease;
  }
  #reader-controls button:hover { background:rgba(0,0,0,.06); color:#111; }
  #reader-controls button:focus-visible { box-shadow:0 0 0 3px rgba(0,0,0,.10); }
  #page-number { min-width:104px; padding:0 8px; font-size:12px; font-weight:600; color:rgba(0,0,0,.62); font-variant-numeric:tabular-nums; text-align:center; }

  #catalogue-reader:fullscreen { width:100vw; max-width:none; height:100vh; background:#fff; display:flex; flex-direction:column; justify-content:center; padding:12px 14px; }
  #catalogue-reader:fullscreen #book-area { flex:1 1 auto; min-height:0; }

  @media (max-width: 900px) {
    #catalogue-reader { padding-left:8px; padding-right:8px; }
    #book-area { padding:0 52px; min-height:0; }
    #book { width:min(100%, 1040px); }
    #first-page { left:2px; }
    #prev-page { left:48px; }
    #next-page { right:48px; }
    #last-page { right:2px; }
  }

  @media (max-width: 700px) {
    #catalogue-languages { gap:6px; margin-bottom:10px; }
    .lang-btn { min-width:58px; height:34px; padding:0 8px; font-size:16px; gap:5px; }
    .lang-btn::after { font-size:10px; }
    #book-area { padding:0 42px; }
    #book { width:min(92vw, 470px); aspect-ratio:1 / 1.41421356; max-width:470px; margin-left:auto !important; margin-right:auto !important; }
    .book-arrow { width:40px; height:40px; font-size:27px; }
    #first-page { left:0; }
    #prev-page { left:39px; }
    #next-page { right:39px; }
    #last-page { right:0; }
    #reader-controls { margin-top:6px; }
  }

  @media (max-width: 430px) {
    .lang-btn { min-width:0; width:44px; padding:0; }
    .lang-btn::after { display:none; }
    #book-area { padding:0 36px; }
    .book-arrow { width:36px; height:36px; font-size:24px; }
    #prev-page { left:34px; }
    #next-page { right:34px; }
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <!-- =======================================================
       DRAPEAUX
       ======================================================= -->

  <div id="catalogue-languages"
       aria-label="Choisir la langue du catalogue">

    <button
      class="lang-btn"
      data-lang="fr"
      type="button"
      aria-label="Français">
      🇫🇷
    </button>

    <button
      class="lang-btn"
      data-lang="en"
      type="button"
      aria-label="English">
      🇬🇧
    </button>

    <button
      class="lang-btn"
      data-lang="it"
      type="button"
      aria-label="Italiano">
      🇮🇹
    </button>

    <button
      class="lang-btn"
      data-lang="es"
      type="button"
      aria-label="Español">
      🇪🇸
    </button>

  </div>


  <!-- =======================================================
       LIVRE
       ======================================================= -->

  <div id="book-area">

    <button
      id="first-page"
      class="book-arrow"
      type="button"
      aria-label="Première page">
      «
    </button>


    <button
      id="prev-page"
      class="book-arrow"
      type="button"
      aria-label="Page précédente">
      ‹
    </button>


    <div id="book"></div>

    <div id="corner-layer" aria-hidden="true">
      <div id="corner-tl" class="corner-zone"></div>
      <div id="corner-bl" class="corner-zone"></div>
      <div id="corner-tr" class="corner-zone"></div>
      <div id="corner-br" class="corner-zone"></div>
    </div>


    <button
      id="next-page"
      class="book-arrow"
      type="button"
      aria-label="Page suivante">
      ›
    </button>


    <button
      id="last-page"
      class="book-arrow"
      type="button"
      aria-label="Dernière page">
      »
    </button>

  </div>


  <!-- =======================================================
       CONTRÔLES
       ======================================================= -->

  <div id="reader-controls">

    <button
      id="zoom-out"
      type="button"
      aria-label="Réduire le zoom">
      −
    </button>

    <span id="page-number">
      1 / 1
    </span>

    <button
      id="zoom-in"
      type="button"
      aria-label="Augmenter le zoom">
      +
    </button>

    <button
      id="fullscreen"
      type="button"
      aria-label="Plein écran">
      ⛶
    </button>

  </div>


  <div id="status"></div>

</div>


<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- =========================================================
     PAGEFLIP
     ========================================================= -->

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>


<script>

(function () {

  "use strict";


  /* ========================================================
     PDF.JS
     ======================================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ========================================================
     URLS EXACTES
     ======================================================== */

  const catalogues = {

    fr:
      "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",

    en:
      "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",

    it:
      "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",

    es:
      "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"

  };


  /* ========================================================
     ÉLÉMENTS
     ======================================================== */

  const bookElement =
    document.getElementById("book");

  const loading =
    document.getElementById("loading");

  const status =
    document.getElementById("status");

  const pageNumber =
    document.getElementById("page-number");

  const firstButton =
    document.getElementById("first-page");

  const prevButton =
    document.getElementById("prev-page");

  const nextButton =
    document.getElementById("next-page");

  const lastButton =
    document.getElementById("last-page");

  const fullscreenButton =
    document.getElementById("fullscreen");

  const zoomInButton =
    document.getElementById("zoom-in");

  const zoomOutButton =
    document.getElementById("zoom-out");

  const languageButtons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );

  const cornerLayer = document.getElementById("corner-layer");
  const cornerTL = document.getElementById("corner-tl");
  const cornerBL = document.getElementById("corner-bl");
  const cornerTR = document.getElementById("corner-tr");
  const cornerBR = document.getElementById("corner-br");


  /* ========================================================
     ÉTAT
     ========================================================

  let pageFlip = null;

  let pdf = null;

  let activeLanguage = "fr";
  let requestedLanguage = "fr";

  let loadRequestId = 0;
  let activeLoadRequestId = 0;
  let loadingCatalogue = false;

  /* Cache des téléchargements PDF. On ne touche pas à la mécanique d'affichage
     de V28 : on accélère seulement l'arrivée des données des autres langues. */
  const catalogueBufferPromises = new Map();

  /* Chaque page rendue est conservée pour le PDF actuellement affiché. */
  const renderedPages = new Set();
  const renderingPages = new Map();
  const pageImageUrls = new Map();
  let renderGeneration = 0;

  /* Pages préparées avant toute interaction utilisateur. */
  let readyPromise = Promise.resolve();


  /* ========================================================
     UTILITAIRES
     ======================================================== */

  function setActiveLanguage(language) {

    languageButtons.forEach(
      function (button) {

        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );

      }
    );

  }


  function showLoading(message) {
    document.getElementById("catalogue-reader").dataset.ready = "false";
  }


  function hideLoading() {
    document.getElementById("catalogue-reader").dataset.ready = "true";
  }


  function showError(message) {

    status.textContent =
      message;

    status.style.display =
      "block";

    hideLoading();

  }


  function hideError() {

    status.style.display =
      "none";

  }


  /* ========================================================
     LANGUE DU SITE
     ======================================================== */

  function detectLanguage() {

    /*
      1 — ?lang=fr
    */

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const queryLang =
        (
          params.get("lang") ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[queryLang]
      ) {

        return queryLang;

      }

    } catch (error) {}


    /*
      2 — Dernière langue choisie dans la liseuse.
    */

    try {
      const savedLang = (localStorage.getItem('mondoprod-catalogue-lang') || '')
        .toLowerCase()
        .split('-')[0];
      if (catalogues[savedLang]) return savedLang;
    } catch (error) {}


    /*
      3 — Langue du document.
    */

    const htmlLang =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLang]
    ) {

      return htmlLang;

    }


    /*
      3 — Langue du navigateur.
    */

    try {

      const browserLang =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[browserLang]
      ) {

        return browserLang;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     RENDRE UNE PAGE PDF DIRECTEMENT DANS UN CANVAS HD
     ======================================================== */

  function isMobileView() {
    return window.matchMedia("(max-width: 700px)").matches;
  }

  function getRenderTargetWidth() {

    const bookWidth = bookElement.clientWidth || 1120;
    const cssPageWidth = isMobileView() ? bookWidth : bookWidth / 2;
    const multiplier = Math.min(4.0, Math.max(2.8, window.devicePixelRatio * 1.8 + 1.4));

    return Math.min(
      3600,
      Math.max(1800, Math.ceil(cssPageWidth * multiplier))
    );
  }

  function sleepFrame() {
    return new Promise(function(resolve) {
      requestAnimationFrame(function() {
        requestAnimationFrame(resolve);
      });
    });
  }

  function cancelCurrentRenders() {
    renderingPages.forEach(function(entry) {
      try {
        if (entry && entry.task && typeof entry.task.cancel === 'function') {
          entry.task.cancel();
        }
      } catch (error) {}
    });
    renderingPages.clear();
  }

  function revokePageUrl(index) {
    const url = pageImageUrls.get(index);
    if (url) {
      try { URL.revokeObjectURL(url); } catch (error) {}
      pageImageUrls.delete(index);
    }
  }

  function revokeAllPageUrls() {
    pageImageUrls.forEach(function(url) {
      try { URL.revokeObjectURL(url); } catch (error) {}
    });
    pageImageUrls.clear();
  }

  function resetRenderState() {
    renderGeneration++;
    cancelCurrentRenders();
    renderedPages.clear();
    revokeAllPageUrls();
    readyPromise = Promise.resolve();
  }

  function canvasToPngBlob(canvas) {
    return new Promise(function(resolve, reject) {
      canvas.toBlob(function(blob) {
        if (blob) resolve(blob);
        else reject(new Error('Impossible de créer l’image PNG de la page.'));
      }, 'image/png');
    });
  }

  async function renderPage(index, generation) {

    if (!pdf || generation !== renderGeneration || index < 0 || index >= pdf.numPages) return false;
    if (renderedPages.has(index)) return true;

    const existing = renderingPages.get(index);
    if (existing && existing.generation === generation) return existing.promise;

    const pageElement = document.querySelector('#book .pdf-page[data-page-index="' + index + '"]');
    if (!pageElement) return false;

    const image = pageElement.querySelector('img');
    if (!image) return false;

    const pdfAtStart = pdf;
    const entry = { generation: generation, task: null, promise: null };

    entry.promise = (async function() {
      const page = await pdfAtStart.getPage(index + 1);
      if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

      const baseViewport = page.getViewport({ scale: 1 });
      const targetWidth = getRenderTargetWidth();
      const scale = targetWidth / baseViewport.width;
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);

      const context = canvas.getContext('2d', { alpha: false });
      if (!context) return false;

      context.fillStyle = '#fff';
      context.fillRect(0, 0, canvas.width, canvas.height);

      const renderTask = page.render({
        canvasContext: context,
        viewport: viewport,
        intent: 'display',
        renderInteractiveForms: true
      });

      entry.task = renderTask;
      await renderTask.promise;

      if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

      const blob = await canvasToPngBlob(canvas);
      if (generation !== renderGeneration || pdf !== pdfAtStart) return false;

      revokePageUrl(index);
      const objectUrl = URL.createObjectURL(blob);
      pageImageUrls.set(index, objectUrl);

      image.onload = null;
      image.src = objectUrl;
      image.alt = 'Page ' + (index + 1);
      image.style.visibility = 'visible';

      renderedPages.add(index);
      return true;
    })().catch(function(error) {
      if (generation !== renderGeneration || (error && error.name === 'RenderingCancelledException')) {
        return false;
      }
      console.error('Erreur rendu page ' + (index + 1) + ':', error);
      return false;
    });

    renderingPages.set(index, entry);

    try {
      return await entry.promise;
    } finally {
      const current = renderingPages.get(index);
      if (current === entry) renderingPages.delete(index);
    }
  }

  async function renderPages(indices, generation) {
    const unique = Array.from(new Set(indices))
      .filter(function(index) { return pdf && index >= 0 && index < pdf.numPages; });

    if (generation !== renderGeneration) return false;

    /*
       Les pages sont rendues en parallèle dans des canvas temporaires hors-DOM,
       puis converties en PNG lossless. Les pages visibles de PageFlip sont donc
       de vraies images HTML, clonables sans perte de contenu pendant la rotation.
    */
    await Promise.all(unique.map(function(index) {
      return renderPage(index, generation);
    }));

    return generation === renderGeneration;
  }

  function preloadAround(index) {

    if (!pdf) return;
    const generation = renderGeneration;
    const total = pdf.numPages;
    const radius = 7;
    const indices = [];

    /* Priorité aux pages immédiatement visibles à la prochaine animation. */
    const priority = [
      index,
      index + 1,
      index + 2,
      index + 3,
      index - 1,
      index - 2,
      index + 4,
      index + 5,
      index - 3,
      index - 4,
      index + 6,
      index + 7,
      index - 5,
      index - 6,
      index - 7
    ];

    priority.forEach(function(i) {
      if (i >= 0 && i < total && !indices.includes(i)) indices.push(i);
    });

    if (index <= 3) {
      [0,1,2,3,4,5,6,7].forEach(function(i) {
        if (i < total && !indices.includes(i)) indices.push(i);
      });
    }

    if (index >= total - 4) {
      [total-8,total-7,total-6,total-5,total-4,total-3,total-2,total-1].forEach(function(i) {
        if (i >= 0 && i < total && !indices.includes(i)) indices.push(i);
      });
    }

    readyPromise = readyPromise.then(function() {
      if (generation !== renderGeneration) return;
      return renderPages(indices, generation);
    }).catch(function(error) {
      console.warn('Préchargement :', error);
    });

    return readyPromise;
  }

  async function ensurePagesReady(indices) {
    if (!pdf) return false;
    const generation = renderGeneration;
    const wanted = Array.from(new Set(indices)).filter(function(index) {
      return index >= 0 && index < pdf.numPages;
    });

    await (readyPromise || Promise.resolve());
    if (generation !== renderGeneration) return false;

    return renderPages(wanted, generation);
  }

  /* ========================================================
     CRÉER LA LISEUSE EN MODE HTML
     ======================================================== */

  function createBook() {

    bookElement.innerHTML = '';
    resetRenderState();

    const pageElements = [];

    for (
      let index = 0;
      index < pdf.numPages;
      index++
    ) {

      const page =
        document.createElement('div');

      page.className = 'pdf-page';
      page.dataset.pageIndex = String(index);
      page.setAttribute('data-density', 'soft');

      if (index === 0 || index === pdf.numPages - 1) {
        page.setAttribute('data-density', 'hard');
      }

      const image =
        document.createElement('img');

      image.setAttribute('aria-hidden', 'true');
      image.alt = 'Page ' + (index + 1);
      image.style.visibility = 'hidden';
      image.decoding = 'async';
      image.draggable = false;

      page.appendChild(image);
      bookElement.appendChild(page);
      pageElements.push(page);

    }

    pageFlip =
      new St.PageFlip(
        bookElement,
        {
          width: 760,
          height: 1075,
          size: 'stretch',
          minWidth: 250,
          maxWidth: 1800,
          minHeight: 350,
          maxHeight: 2550,
          flippingTime: 950,
          showCover: true,
          drawShadow: true,
          maxShadowOpacity: .78,
          showPageCorners: true,
          useMouseEvents: true,
          swipeDistance: 25,
          clickEventForward: true,
          disableFlipByClick: true,
          mobileScrollSupport: true,
          usePortrait: isMobileView(),
          startPage: 0,
          startZIndex: 20,
          autoSize: false
        }
      );

    pageFlip.loadFromHTML(pageElements);
    pageFlip.turnToPage(0);

    requestAnimationFrame(function () {
      updateCounter();
    });

  }

  /* ========================================================
     COMPTEUR
     ======================================================== */

  function updateCounter() {

    if (
      !pageFlip ||
      !pdf
    ) {

      return;

    }


    const index =
      pageFlip.getCurrentPageIndex();


    const total =
      pdf.numPages;


    /*
      Première couverture.
    */

    if (
      index === 0
    ) {

      pageNumber.textContent =
        "1 / " +
        total;

    }

    /*
      Dernière couverture.
    */

    else if (
      index === total - 1
    ) {

      pageNumber.textContent =
        total +
        " / " +
        total;

    }

    /*
      Pages intérieures.
    */

    else {

      const first =
        index + 1;


      const second =
        Math.min(
          index + 2,
          total
        );


      /*
        En double page on affiche
        "2–3 / 44", "4–5 / 44", etc.
      */

      pageNumber.textContent =
        first +
        "–" +
        second +
        " / " +
        total;

    }


    firstButton.disabled =
      index <= 0;

    prevButton.disabled =
      index <= 0;

    nextButton.disabled =
      index >= total - 1;

    lastButton.disabled =
      index >= total - 1;

  }


  /* ========================================================
     ÉVÉNEMENTS PAGEFLIP
     ======================================================== */

  /* Navigation robustesse : une commande demandée pendant une
     animation est mémorisée et exécutée dès que PageFlip redevient
     disponible. La dernière commande gagne, ce qui évite tout blocage. */
  let pendingNavigation = null;

  function pageFlipIsFlipping() {
    if (!pageFlip || typeof pageFlip.getState !== "function") return false;
    try {
      return String(pageFlip.getState()) === "flipping";
    } catch (error) {
      return false;
    }
  }

  function runOrQueueNavigation(command) {
    if (!pageFlip) return;

    if (pageFlipIsFlipping()) {
      pendingNavigation = command;
      return;
    }

    pendingNavigation = null;
    try {
      command();
    } catch (error) {
      console.warn("Navigation PageFlip :", error);
    }
  }

  function flushPendingNavigation() {
    if (!pageFlip || !pendingNavigation || pageFlipIsFlipping()) return;

    const command = pendingNavigation;
    pendingNavigation = null;

    requestAnimationFrame(function () {
      if (!pageFlip) return;
      try {
        command();
      } catch (error) {
        console.warn("Navigation PageFlip :", error);
      }
    });
  }

  function hidePagesUnderCover() {

    bookElement.classList.remove(
      'cover-front-flip-hiding',
      'cover-back-flip-hiding'
    );

    if (!pageFlip || !pdf) return;

    const index = pageFlip.getCurrentPageIndex();
    const total = pdf.numPages;

    if (index <= 1) {
      bookElement.classList.add('cover-front-flip-hiding');
    } else if (index >= total - 2) {
      bookElement.classList.add('cover-back-flip-hiding');
    }
  }

  function showPagesUnderCover() {
    bookElement.classList.remove(
      'cover-front-flip-hiding',
      'cover-back-flip-hiding'
    );
  }

  function attachPageFlipEvents() {

    if (!pageFlip) return;

    pageFlip.on('flip', function() {
      showPagesUnderCover();
      updateCounter();
      preloadAround(pageFlip.getCurrentPageIndex());
    });

    pageFlip.on('changeState', function(event) {
      const state = event && event.data ? String(event.data) : '';
      const index = pageFlip.getCurrentPageIndex();
      const total = pdf ? pdf.numPages : 0;

      const nearFrontCover = index <= 1;
      const nearBackCover = total > 0 && index >= total - 2;

      if (state === 'flipping' && (nearFrontCover || nearBackCover)) {
        hidePagesUnderCover();
      }

      if (state === 'read') {
        showPagesUnderCover();
        updateCounter();
        preloadAround(index);
        flushPendingNavigation();
        return;
      }

      updateCounter();
    });

    pageFlip.on('changeOrientation', function() {
      updateCounter();
      preloadAround(pageFlip.getCurrentPageIndex());
    });
  }

  /* ========================================================
     CHARGER UN CATALOGUE
     ======================================================== */

  function getCatalogueBuffer(language) {

    const url = catalogues[language];
    if (!url) {
      return Promise.reject(new Error('Langue de catalogue inconnue.'));
    }

    if (!catalogueBufferPromises.has(language)) {
      const promise = fetch(url, {
        method: 'GET',
        cache: 'force-cache',
        credentials: 'omit'
      })
      .then(function(response) {
        if (!response.ok) {
          throw new Error('HTTP ' + response.status + ' — ' + url);
        }
        return response.arrayBuffer();
      })
      .catch(function(error) {
        catalogueBufferPromises.delete(language);
        throw error;
      });

      catalogueBufferPromises.set(language, promise);
    }

    return catalogueBufferPromises.get(language);
  }

  function prefetchOtherCatalogues(currentLanguage) {
    Object.keys(catalogues).forEach(function(language) {
      if (language !== currentLanguage) {
        getCatalogueBuffer(language).catch(function() {});
      }
    });
  }

  async function getCatalogueDocument(language, requestId) {

    const buffer = await getCatalogueBuffer(language);

    if (requestId !== activeLoadRequestId) return null;

    /* PDF.js peut transférer le buffer au worker. On lui donne donc une copie
       pour que le cache reste réutilisable lors d'un prochain switch. */
    const data = buffer.slice(0);

    return pdfjsLib.getDocument({
      data: data,
      disableAutoFetch: false,
      disableStream: false,
      disableRange: false,
      cMapPacked: true
    }).promise;
  }

  async function loadCatalogue(language) {

    if (!catalogues[language]) language = 'fr';

    const requestId = ++loadRequestId;
    activeLoadRequestId = requestId;
    requestedLanguage = language;
    loadingCatalogue = true;
    pendingNavigation = null;

    setActiveLanguage(language);
    hideError();
    showLoading('Chargement du catalogue ' + language.toUpperCase() + '…');

    try {

      /*
        IMPORTANT : on ne détruit PAS le catalogue actuellement visible
        tant que le nouveau PDF n'est pas téléchargé et que ses premières
        pages ne sont pas prêtes. Le bouton de langue reste donc fiable,
        même si l'utilisateur clique plusieurs fois.
      */
      const loadedPdf = await getCatalogueDocument(language, requestId);

      if (!loadedPdf || requestId !== activeLoadRequestId) return;

      /* Créer le nouveau livre uniquement après le chargement du PDF. */
      const previousPageFlip = pageFlip;
      const previousPdf = pdf;

      pdf = loadedPdf;
      resetRenderState();
      const generation = renderGeneration;

      bookElement.innerHTML = '';
      pageFlip = null;

      createBook();
      attachPageFlipEvents();
      pageFlip.update();
      pageFlip.turnToPage(0);

      /*
        Deux frames permettent à PageFlip de construire sa géométrie avant
        que PDF.js ne fixe la taille exacte des canvas.
      */
      await sleepFrame();

      /*
        Préchargement silencieux : on prépare les 4 premières pages avant
        d'autoriser la navigation. Aucun message de préparation ne reste donc
        affiché au milieu du lecteur.
      */
      await ensurePagesReady([0, 1, 2, 3, 4, 5, 6, 7]);

      if (requestId !== activeLoadRequestId || generation !== renderGeneration) {
        return;
      }

      activeLanguage = language;
      try { localStorage.setItem('mondoprod-catalogue-lang', language); } catch (error) {}
      document.documentElement.dataset.catalogueReady = 'true';
      document.documentElement.dataset.catalogueLanguage = activeLanguage;

      hideLoading();
      updateCounter();
      preloadAround(0);

      /* Prépare silencieusement les 3 autres catalogues pendant que
         l'utilisateur consulte celui qui vient d'être ouvert. */
      prefetchOtherCatalogues(language);
      positionCornerLayer();

      /* L'ancien livre est détruit seulement maintenant que le nouveau est prêt. */
      if (previousPageFlip && previousPageFlip !== pageFlip) {
        try { previousPageFlip.destroy(); } catch (error) {}
      }
      if (previousPdf && previousPdf !== loadedPdf && typeof previousPdf.cleanup === 'function') {
        try { previousPdf.cleanup(); } catch (error) {}
      }

    } catch (error) {

      if (requestId !== activeLoadRequestId) return;

      console.error('Erreur catalogue ' + language + ' :', error);
      setActiveLanguage(activeLanguage);
      showError(
        'Impossible de charger le catalogue : ' +
        (error && error.message ? error.message : 'erreur inconnue')
      );

    } finally {

      if (requestId === activeLoadRequestId) {
        loadingCatalogue = false;
      }

    }
  }

  /* ========================================================
     DRAPEAUX
     ======================================================== */

  languageButtons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function (event) {

          event.preventDefault();
          event.stopPropagation();

          const requestedLanguage = button.dataset.lang;

          if (!catalogues[requestedLanguage]) {
            return;
          }

          if (requestedLanguage === activeLanguage && pdf && !loadingCatalogue) {
            return;
          }

          loadCatalogue(requestedLanguage);

        }
      );

    }
  );


  /* ========================================================
     COINS INTERACTIFS
     ======================================================== */

  function positionCornerLayer() {
    if (!cornerLayer || !bookElement) return;

    const areaRect = document.getElementById('book-area').getBoundingClientRect();
    const bookRect = bookElement.getBoundingClientRect();

    cornerLayer.style.left = (bookRect.left - areaRect.left) + 'px';
    cornerLayer.style.top = (bookRect.top - areaRect.top) + 'px';
    cornerLayer.style.width = bookRect.width + 'px';
    cornerLayer.style.height = bookRect.height + 'px';
  }

  function bookPointFromPointer(event) {
    const rect = bookElement.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, event.clientX - rect.left));
    const y = Math.max(0, Math.min(rect.height, event.clientY - rect.top));
    return { x: x, y: y };
  }

  function bindCornerZone(zone) {
    if (!zone) return;

    let activePointerId = null;

    zone.addEventListener('pointerdown', function(event) {
      if (!pageFlip || !pdf || pageFlipIsFlipping()) return;

      activePointerId = event.pointerId;
      try { zone.setPointerCapture(event.pointerId); } catch (error) {}

      event.preventDefault();
      event.stopPropagation();

      try {
        pageFlip.startUserTouch(bookPointFromPointer(event));
      } catch (error) {
        activePointerId = null;
      }
    });

    zone.addEventListener('pointermove', function(event) {
      if (activePointerId !== event.pointerId || !pageFlip) return;

      event.preventDefault();
      event.stopPropagation();

      try {
        pageFlip.userMove(bookPointFromPointer(event), false);
      } catch (error) {}
    });

    function finish(event) {
      if (activePointerId !== event.pointerId || !pageFlip) return;

      event.preventDefault();
      event.stopPropagation();

      try {
        pageFlip.userStop(bookPointFromPointer(event), false);
      } catch (error) {}

      try { zone.releasePointerCapture(event.pointerId); } catch (error) {}
      activePointerId = null;
    }

    zone.addEventListener('pointerup', finish);
    zone.addEventListener('pointercancel', finish);
  }

  bindCornerZone(cornerTL);
  bindCornerZone(cornerBL);
  bindCornerZone(cornerTR);
  bindCornerZone(cornerBR);

  positionCornerLayer();

  /* ========================================================
     FLÈCHES
     ======================================================== */

  firstButton.addEventListener(
    "click",
    function () {
      runOrQueueNavigation(function () {
        if (!pageFlip) return;
        pageFlip.turnToPage(0);
      });
    }
  );


  lastButton.addEventListener(
    "click",
    function () {
      runOrQueueNavigation(function () {
        if (!pageFlip || !pdf) return;
        pageFlip.turnToPage(Math.max(0, pdf.numPages - 1));
      });
    }
  );


  prevButton.addEventListener(
    "click",
    async function () {
      if (!pageFlip || !pdf) return;
      const current = pageFlip.getCurrentPageIndex();
      const target = Math.max(0, current - 2);
      if (pageFlipIsFlipping()) {
        pendingNavigation = async function () {
          await ensurePagesReady([current - 4, current - 3, current - 2, current - 1, current, current + 1, current + 2]);
          if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
        };
        return;
      }
      await ensurePagesReady([current - 4, current - 3, current - 2, current - 1, current, current + 1, current + 2]);
      if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
    }
  );


  nextButton.addEventListener(
    "click",
    async function () {
      if (!pageFlip || !pdf) return;
      const current = pageFlip.getCurrentPageIndex();
      const target = Math.min(pdf.numPages - 1, current + 2);
      if (pageFlipIsFlipping()) {
        pendingNavigation = async function () {
          await ensurePagesReady([current - 2, current - 1, current, current + 1, current + 2, current + 3, current + 4]);
          if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
        };
        return;
      }
      await ensurePagesReady([current - 2, current - 1, current, current + 1, current + 2, current + 3, current + 4]);
      if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
    }
  );


  /* ========================================================
     ZOOM
     ======================================================== */

  let readerScale = 1;


  zoomInButton.addEventListener(
    "click",
    function () {

      readerScale =
        Math.min(
          1.14,
          readerScale + .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      bookElement.style.transformOrigin =
        "center center";

    }
  );


  zoomOutButton.addEventListener(
    "click",
    function () {

      readerScale =
        Math.max(
          .90,
          readerScale - .04
        );


      bookElement.style.transform =
        "translateZ(0) scale(" +
        readerScale +
        ")";


      bookElement.style.transformOrigin =
        "center center";

    }
  );


  /* ========================================================
     PLEIN ÉCRAN
     ======================================================== */

  fullscreenButton.addEventListener(
    "click",
    async function () {

      try {

        if (
          !document.fullscreenElement
        ) {

          await document
            .getElementById(
              "catalogue-reader"
            )
            .requestFullscreen();

        } else {

          await document.exitFullscreen();

        }

      } catch (error) {

        console.error(
          "Fullscreen:",
          error
        );

      }

    }
  );


  /* ========================================================
     CLAVIER
     ======================================================== */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        !pageFlip
      ) {

        return;

      }


      if (event.key === "ArrowRight") {
        const current = pageFlip.getCurrentPageIndex();
        ensurePagesReady([current - 2, current - 1, current, current + 1, current + 2, current + 3, current + 4]).then(function() {
          if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipNext("bottom");
        });
      }

      if (event.key === "ArrowLeft") {
        const current = pageFlip.getCurrentPageIndex();
        ensurePagesReady([current - 4, current - 3, current - 2, current - 1, current, current + 1, current + 2]).then(function() {
          if (pageFlip && !pageFlipIsFlipping()) pageFlip.flipPrev("bottom");
        });
      }

    }
  );


  /* ========================================================
     REDIMENSIONNEMENT
     ======================================================== */

  let resizeTimer = null;

  window.addEventListener('resize', function () {

    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(function () {

      if (pageFlip && pdf) {
        resetRenderState();
        pageFlip.update();
        const current = pageFlip.getCurrentPageIndex();
        readyPromise = sleepFrame().then(function() {
          return ensurePagesReady([current - 2, current - 1, current, current + 1, current + 2]);
        });
        preloadAround(current);
        positionCornerLayer();
      }

    }, 180);

  });


  /* ========================================================
     DÉMARRAGE
     ======================================================== */

  const initialLanguage = detectLanguage();
  loadCatalogue(initialLanguage);

  /* Le préchargement des autres langues démarre sans bloquer l'ouverture
     du catalogue courant. */
  setTimeout(function() {
    prefetchOtherCatalogues(initialLanguage);
  }, 350);

})();

</script>

</body>
</html>
