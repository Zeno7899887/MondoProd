<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue</title>

<style>
  :root {
    --reader-width: min(1080px, 100%);
    --page-ratio: 1.41421356;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  #catalogue-reader {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0;
    text-align: center;
    color: #222;
  }

  /* =========================
     LANGUES
     ========================= */

  #catalogue-languages {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 0 18px;
  }

  .lang-btn {
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 2px;
    margin: 0;
    font-size: 40px;
    line-height: 1;
    cursor: pointer;
    opacity: .42;
    transform: scale(1);
    transition: opacity .20s ease, transform .20s ease;
  }

  .lang-btn:hover {
    opacity: .88;
    transform: scale(1.08);
  }

  .lang-btn.active {
    opacity: 1;
    transform: scale(1.14);
  }

  /* =========================
     LIVRE
     ========================= */

  #book-area {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 58px;
  }

  #book {
    position: relative;
    width: var(--reader-width);
    max-width: 1080px;
    aspect-ratio: 1.41421356 / 1;
    perspective: 2200px;
    transform: translateZ(0);
    isolation: isolate;
  }

  /*
    Le spread reste COMPLETEMENT FIXE pendant l'animation.
    Seule la feuille de transition au-dessus tourne.
  */
  #spread {
    position: absolute;
    inset: 0;
    display: flex;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 20px 50px rgba(0,0,0,.18),
      0 1px 0 rgba(0,0,0,.08);
    transform: translateZ(0);
  }

  .page {
    position: relative;
    width: 50%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    flex: 0 0 50%;
    transform: translateZ(0);
  }

  .page canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
  }

  #left-page {
    box-shadow: inset -12px 0 22px -20px rgba(0,0,0,.55);
  }

  #right-page {
    box-shadow: inset 12px 0 22px -20px rgba(0,0,0,.55);
  }

  #seam {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 12px;
    transform: translateX(-50%) translateZ(10px);
    z-index: 6;
    pointer-events: none;
    background:
      linear-gradient(
        to right,
        rgba(0,0,0,.07),
        rgba(255,255,255,.38) 36%,
        rgba(0,0,0,.08) 62%,
        transparent
      );
  }

  /*
    Page overlay.
    IMPORTANT :
    - taille fixe
    - aucun scale pendant le flip
    - transform uniquement en rotateY
    => la page ne "saute" pas / ne change pas de place.
  */

  #flip-page {
    display: none;
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    z-index: 30;
    transform-origin: left center;
    transform-style: preserve-3d;
    will-change: transform;
    backface-visibility: hidden;
    pointer-events: none;
    transform: translateZ(0) rotateY(0deg);
  }

  #flip-front,
  #flip-back {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #fff;
    backface-visibility: hidden;
    transform-style: preserve-3d;
  }

  #flip-front {
    box-shadow:
      0 0 0 1px rgba(0,0,0,.05),
      10px 0 30px rgba(0,0,0,.14);
  }

  #flip-back {
    transform: rotateY(180deg);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.05),
      -10px 0 30px rgba(0,0,0,.12);
  }

  #flip-front::after,
  #flip-back::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(
        90deg,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,.06) 88%,
        rgba(0,0,0,.13) 100%
      );
    opacity: .7;
  }

  #flip-back::after {
    transform: scaleX(-1);
  }

  #flip-front canvas,
  #flip-back canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
  }

  /* =========================
     FLÈCHES
     ========================= */

  .book-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 50;

    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.55);
    color: #fff;

    font-size: 36px;
    line-height: 1;

    cursor: pointer;

    transition:
      background .18s ease,
      transform .18s ease,
      opacity .18s ease;
  }

  .book-arrow:hover:not(:disabled) {
    background: rgba(0,0,0,.78);
    transform: translateY(-50%) scale(1.05);
  }

  .book-arrow:disabled {
    opacity: .18;
    cursor: default;
  }

  #prev-page { left: 4px; }
  #next-page { right: 4px; }

  /* =========================
     CONTRÔLES
     ========================= */

  #reader-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 14px 0 0;
  }

  #reader-controls button {
    appearance: none;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 6px 9px;
    font-size: 22px;
    cursor: pointer;
    border-radius: 8px;
    transition: background .18s ease;
  }

  #reader-controls button:hover {
    background: rgba(0,0,0,.06);
  }

  #page-number {
    min-width: 96px;
    text-align: center;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  #status {
    display: none;
    margin: 18px auto;
    max-width: 92%;
    color: #666;
    font-size: 14px;
    line-height: 1.45;
  }

  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 700px) {

    #catalogue-languages {
      gap: 9px;
      margin-bottom: 13px;
    }

    .lang-btn {
      font-size: 34px;
    }

    #book-area {
      padding: 0 42px;
    }

    #book {
      width: min(92vw, 460px);
      aspect-ratio: 1 / 1.41421356;
      max-width: 460px;
    }

    #spread {
      display: block;
    }

    #left-page {
      display: none;
    }

    #right-page {
      display: block;
      width: 100%;
      height: 100%;
      box-shadow: none;
    }

    #seam {
      display: none;
    }

    #flip-page {
      width: 100%;
      transform-origin: left center;
    }

    .book-arrow {
      width: 44px;
      height: 44px;
      font-size: 30px;
    }

    #prev-page { left: 2px; }
    #next-page { right: 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #flip-page {
      transition: none !important;
    }
  }
</style>
</head>

<body>

<div id="catalogue-reader">

  <div id="catalogue-languages" aria-label="Choisir la langue du catalogue">
    <button class="lang-btn" data-lang="fr" type="button" aria-label="Français">🇫🇷</button>
    <button class="lang-btn" data-lang="en" type="button" aria-label="English">🇬🇧</button>
    <button class="lang-btn" data-lang="it" type="button" aria-label="Italiano">🇮🇹</button>
    <button class="lang-btn" data-lang="es" type="button" aria-label="Español">🇪🇸</button>
  </div>

  <div id="book-area">

    <button id="prev-page" class="book-arrow" type="button" aria-label="Page précédente">‹</button>

    <div id="book">

      <div id="spread">

        <div id="left-page" class="page">
          <canvas id="left-canvas"></canvas>
        </div>

        <div id="right-page" class="page">
          <canvas id="right-canvas"></canvas>
        </div>

        <div id="seam"></div>

      </div>


      <!--
        Feuille temporaire utilisée UNIQUEMENT pendant
        l'animation. Le livre réel reste fixe dessous.
      -->

      <div id="flip-page" aria-hidden="true">

        <div id="flip-front">
          <canvas id="flip-front-canvas"></canvas>
        </div>

        <div id="flip-back">
          <canvas id="flip-back-canvas"></canvas>
        </div>

      </div>

    </div>

    <button id="next-page" class="book-arrow" type="button" aria-label="Page suivante">›</button>

  </div>


  <div id="reader-controls">

    <button id="zoom-out" type="button" aria-label="Réduire le zoom">−</button>

    <span id="page-number">1 / 1</span>

    <button id="zoom-in" type="button" aria-label="Augmenter le zoom">+</button>

    <button id="fullscreen" type="button" aria-label="Plein écran">⛶</button>

  </div>


  <div id="status"></div>

</div>


<!-- =========================================================
     PDF.JS
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>
(function () {

  "use strict";


  /* ========================================================
     PDF.JS
     ======================================================== */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* ========================================================
     URLS EXACTES GITHUB PAGES
     ======================================================== */

  const catalogues = {

    fr:
      "https://zeno7899887.github.io/MondoProd/catalogue-fr.pdf",

    en:
      "https://zeno7899887.github.io/MondoProd/catalogue-en.pdf",

    it:
      "https://zeno7899887.github.io/MondoProd/catalogue-it.pdf",

    es:
      "https://zeno7899887.github.io/MondoProd/catalogue-es.pdf"

  };


  /* ========================================================
     ÉLÉMENTS
     ======================================================== */

  const buttons =
    Array.from(
      document.querySelectorAll(".lang-btn")
    );

  const reader =
    document.getElementById(
      "catalogue-reader"
    );

  const book =
    document.getElementById(
      "book"
    );

  const spread =
    document.getElementById(
      "spread"
    );

  const leftPage =
    document.getElementById(
      "left-page"
    );

  const rightPage =
    document.getElementById(
      "right-page"
    );

  const leftCanvas =
    document.getElementById(
      "left-canvas"
    );

  const rightCanvas =
    document.getElementById(
      "right-canvas"
    );

  const flipPage =
    document.getElementById(
      "flip-page"
    );

  const flipFrontCanvas =
    document.getElementById(
      "flip-front-canvas"
    );

  const flipBackCanvas =
    document.getElementById(
      "flip-back-canvas"
    );

  const prevButton =
    document.getElementById(
      "prev-page"
    );

  const nextButton =
    document.getElementById(
      "next-page"
    );

  const pageNumber =
    document.getElementById(
      "page-number"
    );

  const status =
    document.getElementById(
      "status"
    );


  /* ========================================================
     ÉTAT
     ======================================================== */

  let pdf = null;

  let current = 1;

  let zoom = 1;

  let activeLanguage = "fr";

  let busy = false;

  let resizeTimer = null;


  /* ========================================================
     UTILITAIRES
     ======================================================== */

  function isMobile() {

    return window.matchMedia(
      "(max-width: 700px)"
    ).matches;

  }


  function setActiveLanguage(
    language
  ) {

    buttons.forEach(
      function (button) {

        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );

      }
    );

  }


  function showStatus(
    message
  ) {

    status.textContent =
      message;

    status.style.display =
      "block";

  }


  function hideStatus() {

    status.style.display =
      "none";

  }


  function clearCanvas(
    canvas
  ) {

    const ctx =
      canvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      canvas.width || 1,
      canvas.height || 1
    );

  }


  /*
    Détection de la langue du site parent.
  */

  function detectLanguage() {

    /*
      1. Paramètre ?lang=
    */

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const queryLang =
        (
          params.get("lang") ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[queryLang]
      ) {

        return queryLang;

      }

    } catch (error) {}


    /*
      2. Document.referrer
    */

    try {

      const ref =
        (
          document.referrer ||
          ""
        ).toLowerCase();


      const match =
        ref.match(
          /(?:^|[\/?&_=.-])(fr|en|it|es)(?:[\/?&_=.-]|$)/
        );


      if (
        match &&
        catalogues[match[1]]
      ) {

        return match[1];

      }

    } catch (error) {}


    /*
      3. Langue HTML
    */

    const htmlLang =
      (
        document.documentElement.lang ||
        ""
      )
      .toLowerCase()
      .split("-")[0];


    if (
      catalogues[htmlLang]
    ) {

      return htmlLang;

    }


    /*
      4. Langue du navigateur
    */

    try {

      const browserLang =
        (
          navigator.language ||
          ""
        )
        .toLowerCase()
        .split("-")[0];


      if (
        catalogues[browserLang]
      ) {

        return browserLang;

      }

    } catch (error) {}


    return "fr";

  }


  /* ========================================================
     RENDU D'UNE PAGE PDF
     ======================================================== */

  async function renderPage(
    pageIndex,
    canvas,
    container
  ) {

    if (
      !pdf ||
      !pageIndex ||
      pageIndex < 1 ||
      pageIndex > pdf.numPages
    ) {

      clearCanvas(canvas);
      return;

    }


    const page =
      await pdf.getPage(
        pageIndex
      );


    const baseViewport =
      page.getViewport({
        scale: 1
      });


    /*
      Dimensions CSS EXACTES du compartiment.
    */

    const cssWidth =
      Math.max(
        1,
        container.clientWidth
      );

    const cssHeight =
      Math.max(
        1,
        container.clientHeight
      );


    /*
      Le PDF est toujours entièrement contenu
      dans la même zone : aucun changement de
      position pendant le flip.
    */

    const fitScale =
      Math.min(
        cssWidth / baseViewport.width,
        cssHeight / baseViewport.height
      );


    /*
      Haute densité de pixels.

      2x sur écran normal.
      Jusqu'à 3x sur écran Retina.
      Cela réduit fortement la pixelisation.
    */

    const deviceRatio =
      Math.min(
        window.devicePixelRatio || 1,
        3
      );


    const renderScale =
      fitScale *
      zoom *
      deviceRatio;


    const viewport =
      page.getViewport({
        scale: renderScale
      });


    canvas.width =
      Math.max(
        1,
        Math.round(viewport.width)
      );

    canvas.height =
      Math.max(
        1,
        Math.round(viewport.height)
      );


    /*
      CSS fixe : le canvas occupe toujours
      exactement la même zone.
    */

    canvas.style.width =
      "100%";

    canvas.style.height =
      "100%";


    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: false,
          willReadFrequently: false
        }
      );


    ctx.fillStyle =
      "#ffffff";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    await page.render({

      canvasContext:
        ctx,

      viewport:
        viewport,

      intent:
        "display",

      enableWebGL:
        true,

      renderInteractiveForms:
        true

    }).promise;

  }


  /* ========================================================
     CALCUL DES DEUX PAGES
     ======================================================== */

  function getSpread() {

    if (isMobile()) {

      return {
        left: null,
        right: current
      };

    }


    /*
      La couverture reste seule à droite.
    */

    if (current === 1) {

      return {
        left: null,
        right: 1
      };

    }


    const left =
      current % 2 === 0
        ? current
        : current - 1;


    const right =
      left + 1 <= pdf.numPages
        ? left + 1
        : null;


    return {
      left,
      right
    };

  }


  /* ========================================================
     RENDU DU LIVRE
     ======================================================== */

  async function renderBook() {

    if (!pdf) return;


    if (isMobile()) {

      leftPage.style.display =
        "none";

      rightPage.style.display =
        "block";


      await renderPage(
        current,
        rightCanvas,
        rightPage
      );


    } else {

      leftPage.style.display =
        "block";

      rightPage.style.display =
        "block";


      const pages =
        getSpread();


      if (pages.left) {

        await renderPage(
          pages.left,
          leftCanvas,
          leftPage
        );

      } else {

        clearCanvas(
          leftCanvas
        );

      }


      if (pages.right) {

        await renderPage(
          pages.right,
          rightCanvas,
          rightPage
        );

      } else {

        clearCanvas(
          rightCanvas
        );

      }


      current =
        pages.left || 1;

    }


    updateControls();

  }


  /* ========================================================
     CONTRÔLES
     ======================================================== */

  function updateControls() {

    if (!pdf) return;


    if (isMobile()) {

      pageNumber.textContent =
        current +
        " / " +
        pdf.numPages;

    } else {

      const pages =
        getSpread();


      if (!pages.left) {

        pageNumber.textContent =
          "1 / " +
          pdf.numPages;

      } else {

        pageNumber.textContent =
          pages.left +
          "–" +
          (
            pages.right ||
            pages.left
          ) +
          " / " +
          pdf.numPages;

      }

    }


    prevButton.disabled =
      current <= 1;


    nextButton.disabled =
      current >= pdf.numPages;

  }


  /* ========================================================
     PRÉPARER LA PAGE EN TRAIN DE TOURNER
     ======================================================== */

  async function prepareFlip(
    direction
  ) {

    if (!pdf) return false;


    /*
      Sur mobile : aucune double-page.
      On change simplement de page avec
      un léger mouvement horizontal/fondu.
    */

    if (isMobile()) {

      return true;

    }


    const pages =
      getSpread();


    if (
      direction === "next"
    ) {

      const oldRight =
        pages.right || current;


      const newLeft =
        oldRight + 1;


      if (
        newLeft > pdf.numPages
      ) {

        return false;

      }


      /*
        Même compartiment exact que la page de droite.
      */

      await renderPage(
        oldRight,
        flipFrontCanvas,
        rightPage
      );


      await renderPage(
        newLeft,
        flipBackCanvas,
        rightPage
      );


      /*
        On force exactement la même largeur/hauteur
        avant d'afficher la feuille.
      */

      flipPage.style.width =
        rightPage.getBoundingClientRect().width +
        "px";

      flipPage.style.height =
        rightPage.getBoundingClientRect().height +
        "px";

      flipPage.style.right =
        "0";

      flipPage.style.left =
        "auto";

      flipPage.style.transformOrigin =
        "left center";

      flipPage.style.display =
        "block";

      flipPage.style.transition =
        "none";

      flipPage.style.transform =
        "translateZ(0) rotateY(0deg)";


      return true;

    }


    /*
      Retour arrière :
      on utilise la page de gauche comme
      feuille de départ.
    */

    if (!pages.left) {

      return false;

    }


    const previousRight =
      pages.left - 1;


    if (
      previousRight < 1
    ) {

      return false;

    }


    const previousLeft =
      previousRight - 1 >= 1
        ? previousRight - 1
        : null;


    await renderPage(
      pages.left,
      flipFrontCanvas,
      leftPage
    );


    await renderPage(
      previousRight,
      flipBackCanvas,
      leftPage
    );


    flipPage.style.width =
      leftPage.getBoundingClientRect().width +
      "px";

    flipPage.style.height =
      leftPage.getBoundingClientRect().height +
      "px";

    flipPage.style.left =
      "0";

    flipPage.style.right =
      "auto";

    flipPage.style.transformOrigin =
      "right center";

    flipPage.style.display =
      "block";

    flipPage.style.transition =
      "none";

    flipPage.style.transform =
      "translateZ(0) rotateY(0deg)";


    return true;

  }


  /* ========================================================
     PAGE SUIVANTE
     ======================================================== */

  async function nextPage() {

    if (
      !pdf ||
      busy ||
      current >= pdf.numPages
    ) {

      return;

    }


    busy = true;


    try {

      if (isMobile()) {

        current += 1;

        /*
          Petit mouvement horizontal naturel,
          sans déplacer la page de façon excessive.
        */

        rightPage.animate(
          [
            {
              opacity: 0.72,
              transform: "translateX(12px)"
            },
            {
              opacity: 1,
              transform: "translateX(0)"
            }
          ],
          {
            duration: 220,
            easing: "cubic-bezier(.22,.61,.36,1)"
          }
        );


        await renderBook();

        return;

      }


      const prepared =
        await prepareFlip(
          "next"
        );


      if (!prepared) {
        return;
      }


      requestAnimationFrame(
        function () {

          requestAnimationFrame(
            function () {

              flipPage.style.transition =
                "transform .68s cubic-bezier(.22,.61,.36,1)";

              flipPage.style.transform =
                "translateZ(0) rotateY(-180deg)";

            }
          );

        }
      );


      await new Promise(
        function (resolve) {

          setTimeout(
            resolve,
            700
          );

        }
      );


      flipPage.style.display =
        "none";

      flipPage.style.transition =
        "none";

      flipPage.style.transform =
        "translateZ(0) rotateY(0deg)";


      /*
        Le nouveau spread est affiché
        UNIQUEMENT après la fin du flip.
      */

      current =
        getSpread().right + 1;


      if (
        current > pdf.numPages
      ) {

        current =
          pdf.numPages;

      }


      await renderBook();

    } finally {

      busy = false;

    }

  }


  /* ========================================================
     PAGE PRÉCÉDENTE
     ======================================================== */

  async function previousPage() {

    if (
      !pdf ||
      busy ||
      current <= 1
    ) {

      return;

    }


    busy = true;


    try {

      if (isMobile()) {

        current -= 1;


        rightPage.animate(
          [
            {
              opacity: 0.72,
              transform: "translateX(-12px)"
            },
            {
              opacity: 1,
              transform: "translateX(0)"
            }
          ],
          {
            duration: 220,
            easing: "cubic-bezier(.22,.61,.36,1)"
          }
        );


        await renderBook();

        return;

      }


      const pages =
        getSpread();


      if (!pages.left) {

        return;

      }


      const prepared =
        await prepareFlip(
          "previous"
        );


      if (!prepared) {

        return;

      }


      requestAnimationFrame(
        function () {

          requestAnimationFrame(
            function () {

              flipPage.style.transition =
                "transform .68s cubic-bezier(.22,.61,.36,1)";

              flipPage.style.transform =
                "translateZ(0) rotateY(180deg)";

            }
          );

        }
      );


      await new Promise(
        function (resolve) {

          setTimeout(
            resolve,
            700
          );

        }
      );


      flipPage.style.display =
        "none";

      flipPage.style.transition =
        "none";

      flipPage.style.transform =
        "translateZ(0) rotateY(0deg)";


      /*
        On revient au spread précédent.
      */

      current =
        Math.max(
          1,
          pages.left - 2
        );


      await renderBook();

    } finally {

      busy = false;

    }

  }


  /* ========================================================
     CHARGEMENT DU CATALOGUE
     ======================================================== */

  async function loadCatalogue(
    language
  ) {

    if (
      !catalogues[language]
    ) {

      language = "fr";

    }


    activeLanguage =
      language;


    setActiveLanguage(
      language
    );


    hideStatus();


    /*
      Annule visuellement un éventuel flip.
    */

    flipPage.style.display =
      "none";

    flipPage.style.transition =
      "none";

    flipPage.style.transform =
      "translateZ(0) rotateY(0deg)";


    try {

      /*
        IMPORTANT :
        les URLS ABSOLUES sont utilisées ici.
      */

      const response =
        await fetch(
          catalogues[language],
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          catalogues[language]
        );

      }


      const data =
        await response.arrayBuffer();


      pdf =
        await pdfjsLib.getDocument({
          data: data
        }).promise;


      current = 1;

      zoom = 1;


      await renderBook();


    } catch (error) {

      console.error(
        "Erreur catalogue :",
        error
      );


      showStatus(
        "Impossible de charger le catalogue. " +
        (
          error &&
          error.message
            ? error.message
            : "Erreur inconnue."
        )
      );

    }

  }


  /* ========================================================
     ZOOM
     ======================================================== */

  document
    .getElementById("zoom-in")
    .addEventListener(
      "click",
      async function () {

        zoom =
          Math.min(
            2.5,
            zoom + .15
          );

        await renderBook();

      }
    );


  document
    .getElementById("zoom-out")
    .addEventListener(
      "click",
      async function () {

        zoom =
          Math.max(
            .75,
            zoom - .15
          );

        await renderBook();

      }
    );


  /* ========================================================
     PLEIN ÉCRAN
     ======================================================== */

  document
    .getElementById("fullscreen")
    .addEventListener(
      "click",
      async function () {

        try {

          if (
            !document.fullscreenElement
          ) {

            await reader.requestFullscreen();

          } else {

            await document.exitFullscreen();

          }

        } catch (error) {

          console.error(
            "Fullscreen:",
            error
          );

        }

      }
    );


  /* ========================================================
     DRAPEAUX
     ======================================================== */

  buttons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {

          if (
            button.dataset.lang ===
            activeLanguage
          ) {

            return;

          }


          loadCatalogue(
            button.dataset.lang
          );

        }
      );

    }
  );


  /* ========================================================
     CLAVIER
     ======================================================== */

  document.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key === "ArrowRight"
      ) {

        nextPage();

      }

      if (
        event.key === "ArrowLeft"
      ) {

        previousPage();

      }

    }
  );


  /* ========================================================
     SWIPE MOBILE
     ======================================================== */

  let touchStartX = 0;
  let touchStartY = 0;


  book.addEventListener(
    "touchstart",
    function (event) {

      const touch =
        event.changedTouches[0];

      touchStartX =
        touch.screenX;

      touchStartY =
        touch.screenY;

    },
    {
      passive: true
    }
  );


  book.addEventListener(
    "touchend",
    function (event) {

      const touch =
        event.changedTouches[0];

      const dx =
        touchStartX -
        touch.screenX;

      const dy =
        touchStartY -
        touch.screenY;


      /*
        On ne déclenche le swipe que si
        le geste est principalement horizontal.
      */

      if (
        Math.abs(dx) < 45 ||
        Math.abs(dx) < Math.abs(dy)
      ) {

        return;

      }


      if (dx > 0) {

        nextPage();

      } else {

        previousPage();

      }

    },
    {
      passive: true
    }
  );


  /* ========================================================
     RESIZE
     ======================================================== */

  window.addEventListener(
    "resize",
    function () {

      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          function () {

            if (pdf && !busy) {

              renderBook();

            }

          },
          180
        );

    }
  );


  /* ========================================================
     DÉMARRAGE
     ======================================================== */

  loadCatalogue(
    detectLanguage()
  );

})();
</script>

</body>
</html>
