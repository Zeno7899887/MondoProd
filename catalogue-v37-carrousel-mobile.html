
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo Prod — Catalogue V38</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif; overflow-x:hidden; color:#1d1d1f; }

  #catalogue-reader {
    width:100%;
    max-width:1360px;
    margin:0 auto;
    padding:10px 14px 16px;
    text-align:center;
    isolation:isolate;
  }

  #catalogue-languages {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:0 0 14px;
  }

  .lang-btn {
    appearance:none;
    position:relative;
    z-index:1000;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-width:74px;
    height:38px;
    padding:0 11px;
    border:1px solid rgba(0,0,0,.10);
    border-radius:999px;
    outline:0;
    background:rgba(255,255,255,.84);
    color:rgba(0,0,0,.58);
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    opacity:.72;
    transform:translateY(0);
    transition:background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease;
    pointer-events:auto;
  }
  .lang-btn::after {
    content:attr(aria-label);
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .lang-btn:hover { opacity:1; transform:translateY(-1px); background:#fff; box-shadow:0 5px 16px rgba(0,0,0,.10); }
  .lang-btn.active { opacity:1; color:#111; background:#fff; border-color:rgba(0,0,0,.20); box-shadow:0 5px 18px rgba(0,0,0,.12); }
  .lang-btn:focus-visible { box-shadow:0 0 0 3px rgba(0,0,0,.12), 0 5px 18px rgba(0,0,0,.12); }

  #book-area {
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 142px;
    min-height:clamp(320px, 62vw, 790px);
  }

  #book {
    position:relative;
    width:min(1160px, 100%);
    max-width:1160px;
    aspect-ratio:1.41421356 / 1;
    margin:0 auto;
    transform:translateZ(0);
    transform-style:preserve-3d;
    background:transparent !important;
    overflow:visible;
  }

  #book .stf,
  #book .stf__wrapper,
  #book .stf__block {
    margin-left:auto !important;
    margin-right:auto !important;
  }
  #book .stf { left:0 !important; right:0 !important; }

  #book, #book .pdf-page, .book-arrow, .lang-btn { user-select:none; -webkit-user-select:none; }

  #book .pdf-page {
    background:#fff;
    overflow:hidden;
    padding:0;
    margin:0;
    box-shadow:none;
  }
  #book .pdf-page canvas {
    display:block;
    width:100%;
    height:100%;
    background:#fff;
    object-fit:fill;
    image-rendering:auto;
  }

  /*
     Les pages sont rendues en images PNG lossless.
     C'est volontaire : PageFlip clone les pages HTML pendant une
     vraie rotation, et les images conservent leur contenu dans ces clones
     contrairement aux canvas HTML clonés.
  */
  #book .pdf-page img {
    display:block;
    width:100%;
    height:100%;
    object-fit:fill;
    background:#fff;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  .book-arrow {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:100;
    width:46px;
    height:46px;
    appearance:none;
    border:1px solid rgba(0,0,0,.12);
    border-radius:50%;
    background:rgba(255,255,255,.90);
    color:#1b1b1b;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:31px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 0 2px;
    cursor:pointer;
    transition:background .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease, border-color .18s ease;
  }
  .book-arrow:hover:not(:disabled) { background:#fff; border-color:rgba(0,0,0,.20); box-shadow:0 8px 25px rgba(0,0,0,.16); transform:translateY(-50%) scale(1.04); }
  .book-arrow:active:not(:disabled) { transform:translateY(-50%) scale(.98); }
  .book-arrow:disabled { opacity:.25; cursor:default; box-shadow:none; }
  #first-page { left:0; }
  #prev-page { left:54px; }
  #next-page { right:54px; }
  #last-page { right:0; }

  /* Zones de coins interactifs. Elles épousent exactement la zone du livre
     et transmettent les Pointer Events directement à PageFlip. */
  #corner-layer {
    position:absolute;
    z-index:150;
    pointer-events:none;
  }
  .corner-zone {
    position:absolute;
    width:104px;
    height:104px;
    pointer-events:auto;
    touch-action:none;
    background:transparent;
  }
  #corner-tl { left:0; top:0; cursor:pointer; }
  #corner-bl { left:0; bottom:0; cursor:pointer; }
  #corner-tr { right:0; top:0; cursor:pointer; }
  #corner-br { right:0; bottom:0; cursor:pointer; }

  #catalogue-reader {
    position:relative;
  }

  #loading {
    position:absolute;
    inset:0;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    visibility:hidden;
  }

  #loading[hidden] {
    display:none !important;
    opacity:0 !important;
    visibility:hidden !important;
  }

  #catalogue-reader:not([data-loading="true"]) #loading {
    opacity:0;
    visibility:hidden;
  }

  #catalogue-reader[data-loading="true"] #loading:not([hidden]) {
    opacity:1;
    visibility:visible;
  }

  #loading-globe {
    width:72px;
    height:72px;
    object-fit:contain;
    animation:catalogueGlobeSpin 6s linear infinite;
  }

  @keyframes catalogueGlobeSpin {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }

  #catalogue-reader:not([data-ready="true"]) #book {
    pointer-events:none;
  }

  #status {
    display:none;
    max-width:780px;
    margin:12px auto 0;
    padding:10px 14px;
    border:1px solid rgba(190,30,45,.18);
    border-radius:10px;
    background:rgba(255,245,246,.86);
    color:#8b2833;
    font-size:13px;
    line-height:1.45;
  }

  #reader-controls {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    min-height:42px;
    margin:8px 0 0;
    padding:4px 8px;
    border:1px solid rgba(0,0,0,.08);
    border-radius:999px;
    width:max-content;
    max-width:100%;
    margin-left:auto;
    margin-right:auto;
    background:rgba(255,255,255,.68);
    box-shadow:0 2px 12px rgba(0,0,0,.05);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #reader-controls button {
    appearance:none;
    min-width:34px;
    height:32px;
    border:0;
    outline:0;
    background:transparent;
    color:rgba(0,0,0,.70);
    padding:0 8px;
    font-size:20px;
    cursor:pointer;
    border-radius:999px;
    transition:background .16s ease, color .16s ease, transform .16s ease;
  }
  #reader-controls button:hover { background:rgba(0,0,0,.06); color:#111; }
  #reader-controls button:focus-visible { box-shadow:0 0 0 3px rgba(0,0,0,.10); }
  #page-number { min-width:104px; padding:0 8px; font-size:12px; font-weight:600; color:rgba(0,0,0,.62); font-variant-numeric:tabular-nums; text-align:center; }

  #catalogue-reader:fullscreen { width:100vw; max-width:none; height:100vh; background:#fff; display:flex; flex-direction:column; justify-content:center; padding:12px 14px; }
  #catalogue-reader:fullscreen #book-area { flex:1 1 auto; min-height:0; }

  @media (max-width: 900px) {
    #catalogue-reader { padding-left:8px; padding-right:8px; }
    #book-area { padding:0 92px; min-height:0; }
    #book { width:min(100%, 1040px); }
    #first-page { left:0; }
    #prev-page { left:46px; }
    #next-page { right:46px; }
    #last-page { right:0; }
  }

  /* =========================================================
     CARROUSEL MOBILE (≤700px)
     Le mode PC (PageFlip / #book) n'est jamais modifié.
     En dessous de 700px, #book est masqué et remplacé visuellement
     par #mobile-carousel : les pages apparaissent une par une,
     centrées, avec un simple fondu (pas d'effet de livre).
     Les flèches de navigation passent sous l'image (et non sur les
     côtés) pour ne jamais gêner la lecture du catalogue au doigt.
     ========================================================= */

  #mobile-carousel {
    display:none;
    position:relative;
    width:min(92vw, 470px);
    max-width:470px;
    aspect-ratio:1 / 1.41421356;
    margin:0 auto;
  }

  #mobile-carousel .carousel-slide {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(.97);
    pointer-events:none;
    transition:opacity .42s ease, transform .42s ease;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 10px 34px rgba(0,0,0,.14);
  }

  #mobile-carousel .carousel-slide.is-active {
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
    z-index:2;
  }

  #mobile-carousel .carousel-slide img {
    display:block;
    width:100%;
    height:100%;
    object-fit:fill;
    background:#fff;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  /* Rangée de flèches mobile, affichée uniquement en dessous de 700px,
     positionnée directement sous le carrousel (flux normal, pas absolute). */
  #mobile-arrows {
    display:none;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:10px auto 0;
  }

  #mobile-arrows .book-arrow {
    position:static;
    transform:none;
  }
  #mobile-arrows .book-arrow:hover:not(:disabled) { transform:scale(1.04); }
  #mobile-arrows .book-arrow:active:not(:disabled) { transform:scale(.98); }

  @media (max-width: 700px) {
    #catalogue-languages { gap:6px; margin-bottom:10px; }
    .lang-btn { min-width:58px; height:34px; padding:0 8px; font-size:16px; gap:5px; }
    .lang-btn::after { font-size:10px; }

    /* Le conteneur épouse la hauteur réelle du contenu : plus de
       min-height fixe hérité du mode PC, ni de gros espaces latéraux. */
    #book-are
